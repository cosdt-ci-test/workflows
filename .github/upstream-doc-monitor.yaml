# Upstream doc monitor — 完全自包含的监控清单
#
# 手动指定全部监控项，不依赖 projects.yaml 解析（监控清单与项目注册表
# 各自独立演进，repo 一致性由本文件的评审保障）。
#
# 每个条目 = 一个监控项，字段：
#   project  展示标签（工单标题与报告分组用；同一标签可出现在多个条目）
#   owner    处理人 GitHub 用户名（可选但强烈建议填写：该条目产生的工单
#            会 @owner；缺省则工单不 @人）
#   url      文档地址，源类型自动识别：
#     https://github.com/<owner>/<repo>/blob/<branch>/<path>
#              → 监控 GitHub 仓库内的单个文档（branch 填该仓库默认分支名）
#     其他 http(s) 地址 → 监控外部官方网页
#
# 若同一项目未来需要监控第二个文档，增加一个条目即可（标签可重复、
# 可配不同 owner）。新增条目首轮记 first_seen（不建工单），第二轮起
# 正常判定变化。
#
# TODO(owner): 当前 4 个测试条目的 owner 均为 lltiaor；后续补齐全量
# 清单时按团队分工逐条填写。测试条目（ci-test / page-test）验证完
# 成后删除。

projects:
  - project: deepspeed
    owner: lltiaor
    url: https://github.com/deepspeedai/DeepSpeed/blob/master/README.md
  # 官方网页监控示例（ascend.github.io 社区文档页，URL 已核实可达）。
  # 其他项目的社区文档页核实路径后按同款方式追加。
  - project: lm-eval-ascend-doc
    owner: lltiaor
    url: https://ascend.github.io/docs/sources/lm_evaluation/quick_start.html
  # CI 效果验证用条目：监控 lltiaor 自己的测试仓库文档（public），
  # 改 doc.md 内容 → 下一轮 dispatch 触发 changed → 建工单 @lltiaor。
  # 验证完成后删除本条目。
  - project: ci-test
    owner: lltiaor
    url: https://github.com/lltiaor/doc-test/blob/main/doc.md
  - project: page-test
    owner: lltiaor
    url: https://lltiaor.github.io/doc-test/
