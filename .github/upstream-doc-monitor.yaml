# Upstream doc monitor — 完全自包含的监控清单
#
# 手动指定全部监控项，不依赖 projects.yaml 解析（监控清单与项目注册表
# 各自独立演进，repo 一致性由本文件的评审保障）。
#
# 每个条目 = 一个监控项，字段：
#   project  展示标签（工单标题与报告分组用；同一标签可出现在多个条目）
#   owner    处理人 GitHub 用户名（可选但强烈建议填写：该条目产生的工单
#            会 @owner 并尽力设为 assignee；缺省则工单不 @人）
#   source   采集源，type 二选一：
#     type: repo_file → 监控 GitHub 仓库内的单个文档
#       repo    owner/repo 形式（必填）
#       path    仓库内文档路径，相对仓库根（必填）
#       branch  可选，默认上游默认分支
#     type: web_page → 监控外部官方网页
#       url     完整 http(s) 地址（必填）
#
# 若同一项目未来需要监控第二个文档，增加一个条目即可（标签可重复、
# 可配不同 owner）。新增条目首轮记 first_seen（不建工单），第二轮起
# 正常判定变化。
#
# TODO(owner): 以下条目尚未指定 owner——请按团队分工补填，否则工单
# 不会 @到具体处理人。

projects:
