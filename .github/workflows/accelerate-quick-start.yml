# accelerate quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml
# twice (once per machine generation) and merges the two results with a
# shared composite action. This file only declares what varies per
# project: schedule, concurrency, machine generations (runner + image),
# upstream repo, monitored doc, and the test entry command. The guard
# loop, cache I/O, state relay, publishing and result aggregation all
# live in the engine + the merge action.
#
# Cache keys (quick-start-monitor-state-accelerate-<machine_type>_*) and
# per-machine artifact names (accelerate-quick-start-<run_id>-<machine_type>)
# are derived from project=accelerate + machine_type, not from the
# workflow name.

name: accelerate-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'accelerate-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch / PR
  # runs already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # schedule:
  # Run every 6 hours: '15 */6 * * *' fires at minute 15 of every
  # 6th hour (00:15, 06:15, 12:15, 18:15). Cadence is loose enough
  # for an upstream that releases monthly (Accelerate), but tight
  # enough that doc fixes propagate within a day.
  #   - cron: '15 */6 * * *'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids
  # burning the self-hosted NPU runner on unrelated PRs. `pull_request`
  # (not `pull_request_target`): contents: read is enough, no
  # write-token risk. doc_url uses github.sha to match the workflow
  # checkout, including the merge commit on pull_request runs.
  pull_request:
    branches: [main]
    paths:
      - 'projects/accelerate/**'
      - '.github/workflows/accelerate-quick-start.yml'

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-accelerate-a2_*),
      # per-machine artifacts (accelerate-quick-start-<run_id>-a2) and the
      # test working dir (workflows/projects/accelerate).
      project: accelerate
      machine_type: a2
      # Dual-card NPU runner: the DDP training / gather_for_metrics /
      # load_checkpoint_and_dispatch sections all need 2 visible devices
      # (`accelerate launch --num_processes 2`, device_map npu:0 + npu:1).
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      timeout_minutes: 90
      upstream_repo: huggingface/accelerate
      # The doc under guard. Both URLs point at the cosdt-ci-test fork
      # (this repo); both URLs select the triggering commit via github.sha.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/accelerate/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/accelerate/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/accelerate; env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by the
      # engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: accelerate
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg. TODO(verify): confirm the a3
      # runner label before enabling.
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-a3-ubuntu22.04-py3.12
      timeout_minutes: 90
      upstream_repo: huggingface/accelerate
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/accelerate/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/accelerate/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: accelerate
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
