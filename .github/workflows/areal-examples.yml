# areal examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. See docs/examples-guard-engine.md for the design.
#
# NOTE: guard target switched 2026-10-10 from the ascend-v1.0.5 branch to
# the release line (latest release = v2.1.0, matching the manifest's
# reconciliation tree). target_ref stays empty so the engine resolves the
# latest upstream release; dispatch with an explicit ref to override.
# The supported recipes + image (areal_npu:v1.0.5-a2) were validated on
# ascend-v1.0.5 and are pending re-validation on the release line.

name: areal-examples

concurrency:
  group: ${{ github.event_name == 'schedule' && 'areal-examples-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Bring-up phase: keep the schedule disabled until a few manual rounds are
  # green. Re-enable when ready:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release)
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

jobs:
  areal-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      project: areal
      upstream_repo: areal-project/AReaL
      target_ref: ${{ inputs.target_ref }}
      max_parallel: 4
