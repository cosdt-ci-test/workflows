# bitsandbytes quick start guard - project thin trigger.
#
# The shared quick-start template owns monitoring, cache state, result
# validation, and artifact publishing. Project-specific environment setup
# and document execution live in projects/bitsandbytes/tests.

name: bitsandbytes-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'bitsandbytes-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '35 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: bitsandbytes
      machine_type: a2
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
      timeout_minutes: 90
      upstream_repo: bitsandbytes-foundation/bitsandbytes
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/bitsandbytes/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/bitsandbytes/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: bitsandbytes
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg.
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: >-
        --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
      timeout_minutes: 90
      upstream_repo: bitsandbytes-foundation/bitsandbytes
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/bitsandbytes/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/bitsandbytes/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: bitsandbytes
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
