# DeepSpeed quick start guard - project thin trigger.
#
# Calls the common engine once per machine generation (A2/A3) and merges
# the per-machine result.json files into one artifact. This file only
# declares the machine-specific runner/image, upstream repo, monitored
# doc, and test entry command.
name: deepspeed-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'deepspeed-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: deepspeed
      machine_type: a2
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: ''
      timeout_minutes: 180
      upstream_repo: deepspeedai/DeepSpeed
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/deepspeed/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/deepspeed/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: deepspeed
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg. The quick-start test uses both
      # cards for the distributed DeepSpeed launch.
      test_runner: '["linux-aarch64-a3-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: ''
      timeout_minutes: 180
      upstream_repo: deepspeedai/DeepSpeed
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/deepspeed/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/deepspeed/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: deepspeed
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
