# DGL-Ascend quick start: build the engine-selected GitHub commit,
# verify installed NPU graph operations, and train LightGCN for one epoch.
# The fixture aligns the checkout with UPSTREAM_REF before submodule setup.
name: dgl-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'dgl-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Keep manual triggering while the revised tutorial is validated on NPU.
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dgl-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: dgl
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # Source and the official Gowalla archive are recreated in a temporary cwd.
      container_options: ''
      # Includes dependency installation, a source build, and one training epoch.
      timeout_minutes: 240
      # No releases or tags: the engine resolves the default-branch HEAD SHA.
      upstream_repo: BUPT-GAMMA/dgl-ascend
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/dgl/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/dgl/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
