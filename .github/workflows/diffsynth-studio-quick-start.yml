# diffsynth-studio quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml; this
# file only declares what varies per project: concurrency, runner, container
# image, upstream repo, monitored doc, and the test entry command. The guard
# loop, cache I/O, state relay and publishing all live in the engine.
#
# Two machine legs run the same doc and test:
#   qs-a2  Atlas 900 A2 (Ascend 910B)
#   qs-a3  Atlas 900 A3 (Ascend 910C)
# The merge job folds both result.json files into one artifact.

name: diffsynth-studio-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'diffsynth-studio-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '20 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: diffsynth-studio
      machine_type: a2
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      timeout_minutes: 120
      upstream_repo: modelscope/DiffSynth-Studio
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/diffsynth-studio/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/diffsynth-studio/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: diffsynth-studio
      machine_type: a3
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      timeout_minutes: 120
      upstream_repo: modelscope/DiffSynth-Studio
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/diffsynth-studio/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/diffsynth-studio/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: diffsynth-studio
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
