# Examples guard engine - the common, reusable part of the examples
# guarding pipeline.

name: examples-template

on:
  workflow_call:
    inputs:
      project:
        description: Project directory under projects/; namespaces cache keys, artifact names and scheduling paths
        type: string
        required: true
      upstream_repo:
        description: Upstream repo (owner/name) polled for releases; fallback target when dispatch inputs are empty
        type: string
        required: true
      target_repo:
        description: Optional dispatch-only target repo override (owner/name)
        type: string
        default: ''
      target_ref:
        description: Dispatch-only ref; empty selects the latest release
        type: string
        default: ''
      default_branch:
        description: Branch to use when manual latest-release lookup is unavailable
        type: string
        default: main
      examples_repo:
        description: Repo containing the example scripts (defaults to upstream_repo)
        type: string
        default: ''
      max_parallel:
        description: Max parallel run-example matrix legs
        type: number
        default: 4

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      need_to_run: ${{ steps.decide.outputs.need_to_run }}
      trigger: ${{ steps.decide.outputs.trigger }}
      target_repo: ${{ steps.decide.outputs.target_repo }}
      target_ref: ${{ steps.decide.outputs.target_ref }}
      reason: ${{ steps.decide.outputs.reason }}
      cache_result: ${{ steps.monitor.outputs.cache_result }}
      workflow_files_hash: ${{ steps.monitor.outputs.workflow_files_hash }}
    env:
      UPSTREAM_REPO: ${{ inputs.upstream_repo }}
    steps:
      - name: Restore monitor state
        id: cache-restore
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          # Per-run key always misses; restore-keys picks the latest
          # save (ownership verified by the next step).
          key: examples-monitor-state-${{ inputs.project }}_${{ github.run_id }}
          restore-keys: |
            examples-monitor-state-${{ inputs.project }}_

      - name: Verify matched cache key
        if: github.event_name == 'schedule'
        env:
          PROJECT: ${{ inputs.project }}
          MATCHED_KEY: ${{ steps.cache-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ -n "$MATCHED_KEY" ] \
            && ! printf '%s' "$MATCHED_KEY" | grep -Eq "^examples-monitor-state-${PROJECT}_[0-9]+$"; then
            echo "::warning::monitor-state cache cross-talk: matched key '$MATCHED_KEY' is not owned by project '$PROJECT' - discarding cache (cold start)"
            rm -rf .monitor-state
          else
            echo "matched cache key ok: ${MATCHED_KEY:-cold start}"
          fi

      - name: Checkout workflows
        if: github.event_name == 'schedule'
        uses: actions/checkout@v6
        with:
          path: workflows
          persist-credentials: false

      - name: Monitor upstream
        id: monitor
        if: github.event_name == 'schedule'
        env:
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          PROJECT: ${{ inputs.project }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
        run: |
          set -euo pipefail
          # Single source of .monitor state for both signals below.
          if [ -f .monitor-state/.monitor ]; then
            . .monitor-state/.monitor
          fi
          NEED="false"
          REASON=""

          # Check the latest upstream release first, falling back to the default branch on HTTP 404.
          RESP_FILE=$(mktemp)
          HTTP_CODE=$(curl -sSL --retry 3 -o "$RESP_FILE" -w '%{http_code}' \
            "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" || true)
          TAG=""
          if [ "$HTTP_CODE" = "200" ]; then
            TAG=$(jq -r '.tag_name // empty' "$RESP_FILE")
          fi
          rm -f "$RESP_FILE"
          if [ "$HTTP_CODE" = "404" ]; then
            HEAD_RESP=$(mktemp)
            HEAD_CODE=$(curl -sSL --retry 3 -o "$HEAD_RESP" -w '%{http_code}' \
              "https://api.github.com/repos/$UPSTREAM_REPO/commits/$DEFAULT_BRANCH" || true)
            HEAD_SHA=""
            if [ "$HEAD_CODE" = "200" ]; then
              HEAD_SHA=$(jq -r '.sha // empty' "$HEAD_RESP")
            fi
            rm -f "$HEAD_RESP"
            if [ -n "$HEAD_SHA" ]; then
              TAG="$HEAD_SHA"
              if [ "${last_release_tag:-}" != "$TAG" ]; then
                NEED="true"
                REASON="head"
                echo "release signal 404 (no releases); HEAD fallback FIRED: ${last_release_tag:-<none>} -> $HEAD_SHA"
              elif [ "${release_outcome:-}" = "failure" ]; then
                NEED="true"
                REASON="head-retry"
                echo "HEAD fallback RETRY (previous outcome failure, sha $HEAD_SHA unchanged)"
              else
                echo "HEAD fallback unchanged ($HEAD_SHA), previous outcome: ${release_outcome:-none}"
              fi
            else
              echo "no release published and HEAD lookup failed (HTTP $HEAD_CODE) - nothing to guard"
              {
                echo "## examples guard: $UPSTREAM_REPO"
                echo "No release published - nothing to guard, no result."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ -z "$TAG" ]; then
            echo "release signal unknown (HTTP $HTTP_CODE) - not triggering, state untouched"
          else
            if [ "${last_release_tag:-}" != "$TAG" ]; then
              NEED="true"
              REASON="release"
              echo "release signal FIRED: ${last_release_tag:-<none>} -> $TAG"
            elif [ "${release_outcome:-}" = "failure" ]; then
              NEED="true"
              REASON="release-retry"
              echo "release signal RETRY (previous outcome failure, tag $TAG unchanged)"
            else
              echo "release tag unchanged ($TAG), previous outcome: ${release_outcome:-none}"
            fi
          fi
          echo "release_ref=$TAG" >> "$GITHUB_OUTPUT"

          WORKFLOW_FILES_HASH=$(
            git -C workflows ls-tree -r HEAD -- \
              "projects/$PROJECT" ".github/workflows/$PROJECT-examples.yml" \
              .github/workflows/examples-template.yml \
              scripts/check_supported_entries.py scripts/write_example_result.py \
              scripts/summarize_example_results.py schemas/result.schema.json \
              | sha256sum | cut -d' ' -f1
          )
          if [ -z "$TAG" ]; then
            REASON="monitor-error"
          elif [ "$NEED" != "true" ]; then
            if [ "${last_workflow_files_hash:-}" != "$WORKFLOW_FILES_HASH" ]; then
              NEED="true"
              REASON="workflow-files"
              echo "workflow-files signal FIRED: ${last_workflow_files_hash:-<none>} -> $WORKFLOW_FILES_HASH"
            elif [ "${release_outcome:-}" = "success" ] && CACHE_RESULT=$(
              python3 workflows/scripts/summarize_example_results.py cached .monitor-state/machines.json
            ); then
              REASON="cached"
              printf 'cache_result=%s\n' "$CACHE_RESULT" >> "$GITHUB_OUTPUT"
            else
              NEED="true"
              REASON="cache-miss"
            fi
          fi

          {
            echo "need_to_run=$NEED"
            echo "reason=$REASON"
            echo "workflow_files_hash=${WORKFLOW_FILES_HASH}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide target
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.target_ref }}
          INPUT_REPO: ${{ inputs.target_repo }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          MONITOR_NEED: ${{ steps.monitor.outputs.need_to_run }}
          MONITOR_REF: ${{ steps.monitor.outputs.release_ref }}
          MONITOR_REASON: ${{ steps.monitor.outputs.reason }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            REF=""
            REASON=""
            if [ -n "$INPUT_REF" ]; then
              REF="$INPUT_REF"
              REASON="explicit"
            else
              # Manual with empty input: query the latest upstream
              # release tag so the run targets a verified, stable
              # ref rather than bleeding-edge main. Falls back to
              # main if the API is unreachable or no release exists.
              RESP_FILE=$(mktemp)
              HTTP_CODE=$(curl -sSL --retry 3 -o "$RESP_FILE" -w '%{http_code}' \
                "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" || true)
              TAG=""
              if [ "$HTTP_CODE" = "200" ]; then
                TAG=$(jq -r '.tag_name // empty' "$RESP_FILE")
              fi
              rm -f "$RESP_FILE"
              if [ -n "$TAG" ]; then
                REF="$TAG"
                REASON="latest-release"
              else
                REF="$DEFAULT_BRANCH"
                REASON="branch-fallback"
                echo "::warning::failed to fetch latest release for $UPSTREAM_REPO (HTTP $HTTP_CODE) - falling back to $DEFAULT_BRANCH"
              fi
            fi
            REPO="${INPUT_REPO:-$UPSTREAM_REPO}"
            {
              echo "need_to_run=true"
              echo "trigger=workflow_dispatch"
              echo "target_repo=$REPO"
              echo "target_ref=$REF"
              echo "reason=$REASON"
            } >> "$GITHUB_OUTPUT"
            echo "resolved repo=$REPO ref=$REF reason=$REASON (manual)"
            exit 0
          fi
          {
            echo "need_to_run=$MONITOR_NEED"
            echo "trigger=schedule"
            echo "target_repo=$UPSTREAM_REPO"
            echo "target_ref=$MONITOR_REF"
            echo "reason=$MONITOR_REASON"
          } >> "$GITHUB_OUTPUT"
          echo "resolved repo=$UPSTREAM_REPO ref=$MONITOR_REF reason=$MONITOR_REASON"

  manifest-check:
    needs: monitor
    if: needs.monitor.outputs.need_to_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      supported_matrix: ${{ steps.check.outputs.supported_matrix }}
      has_supported: ${{ steps.check.outputs.has_supported }}
      a3_matrix: ${{ steps.check.outputs.a3_matrix }}
      has_a3: ${{ steps.check.outputs.has_a3 }}
      publish_matrix: ${{ steps.check.outputs.publish_matrix }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v6
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.monitor.outputs.target_repo }}
          ref: ${{ needs.monitor.outputs.target_ref }}
          path: target

      # Split mode (examples_repo set): the example scripts live in a
      # separate repo from the monitored upstream. Release tags do not
      # exist in the examples repo, so it always follows its default
      # branch (DeepSpeedExamples uses master, not main).
      - name: Checkout examples repo
        if: inputs.examples_repo != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.examples_repo }}
          path: examples

      - name: Check supported entries and derive matrix
        id: check
        env:
          # Non-split: the example tree is the upstream checkout itself.
          EXAMPLES_ROOT: ${{ inputs.examples_repo != '' && 'examples' || 'target' }}
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml
          python3 workflows/scripts/check_supported_entries.py \
            --target-root "$EXAMPLES_ROOT" \
            --manifest "workflows/projects/${{ inputs.project }}/examples_manifest.yaml"

  run-example:
    name: ${{ matrix.example.name }}
    needs: [monitor, manifest-check]
    if: needs.manifest-check.outputs.has_supported == 'true'
    runs-on: ${{ matrix.example.runner }}
    timeout-minutes: ${{ matrix.example.timeout_minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.supported_matrix) }}
    env:
      PROJECT_ROOT: ${{ github.workspace }}/workflows/projects/${{ inputs.project }}
      TARGET_ROOT: ${{ github.workspace }}/target
      EXAMPLES_ROOT: ${{ inputs.examples_repo != '' && format('{0}/examples', github.workspace) || format('{0}/target', github.workspace) }}
      FIXTURE_DIR: ${{ github.workspace }}/workflows/projects/${{ inputs.project }}/fixtures
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: "1"
      HF_METRICS_CACHE: ${{ github.workspace }}/.hf-metrics
      PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TIMEOUT: "120"
    container:
      image: ${{ matrix.example.image }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v6
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.monitor.outputs.target_repo }}
          ref: ${{ needs.monitor.outputs.target_ref }}
          path: target

      - name: Checkout examples repo
        if: inputs.examples_repo != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.examples_repo }}
          path: examples

      - name: Set declared NPU visibility
        if: matrix.example.npu_devices
        env:
          NPU_DEVICES: ${{ matrix.example.npu_devices }}
        run: echo "ASCEND_RT_VISIBLE_DEVICES=$NPU_DEVICES" >> "$GITHUB_ENV"

      - name: Setup example environment
        env:
          PROFILE: ${{ matrix.example.profile }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXEC: ${{ matrix.example.exec }}
        run: bash "$PROJECT_ROOT/scripts/setup_example.sh" "$PROFILE"

      - name: Run example
        env:
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXAMPLE_SOURCE: ${{ matrix.example.source || 'upstream' }}
          EXEC: ${{ matrix.example.exec }}
          LAUNCHER: ${{ matrix.example.launcher || '' }}
          PROFILE: ${{ matrix.example.profile }}
          OVERLAY_ARGS: ${{ toJSON(matrix.example.overlay_args) }}
        run: |
          df -h /dev/shm
          mkdir -p "$GITHUB_WORKSPACE/output"
          CI_OUTPUT_DIR="$GITHUB_WORKSPACE/output" \
            bash "$PROJECT_ROOT/scripts/run_example.sh" "$EXAMPLE_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/train.log"


  run-example-a3:
    name: ${{ matrix.example.name }}
    needs: [monitor, manifest-check]
    if: needs.manifest-check.outputs.has_a3 == 'true'
    runs-on: ${{ matrix.example.runner }}
    timeout-minutes: ${{ matrix.example.timeout_minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.a3_matrix) }}
    env:
      PROJECT_ROOT: ${{ github.workspace }}/workflows/projects/${{ inputs.project }}
      TARGET_ROOT: ${{ github.workspace }}/target
      EXAMPLES_ROOT: ${{ inputs.examples_repo != '' && format('{0}/examples', github.workspace) || format('{0}/target', github.workspace) }}
      FIXTURE_DIR: ${{ github.workspace }}/workflows/projects/${{ inputs.project }}/fixtures
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: "1"
      HF_METRICS_CACHE: ${{ github.workspace }}/.hf-metrics
      PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TIMEOUT: "120"
    container:
      image: ${{ matrix.example.image }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v6
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.monitor.outputs.target_repo }}
          ref: ${{ needs.monitor.outputs.target_ref }}
          path: target

      - name: Checkout examples repo
        if: inputs.examples_repo != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.examples_repo }}
          path: examples

      - name: Set declared NPU visibility
        if: matrix.example.npu_devices
        env:
          NPU_DEVICES: ${{ matrix.example.npu_devices }}
        run: echo "ASCEND_RT_VISIBLE_DEVICES=$NPU_DEVICES" >> "$GITHUB_ENV"

      - name: Setup example environment
        env:
          PROFILE: ${{ matrix.example.profile }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXEC: ${{ matrix.example.exec }}
        run: bash "$PROJECT_ROOT/scripts/setup_example.sh" "$PROFILE"

      - name: Run example
        env:
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXAMPLE_SOURCE: ${{ matrix.example.source || 'upstream' }}
          EXEC: ${{ matrix.example.exec }}
          LAUNCHER: ${{ matrix.example.launcher || '' }}
          PROFILE: ${{ matrix.example.profile }}
          OVERLAY_ARGS: ${{ toJSON(matrix.example.overlay_args) }}
        run: |
          df -h /dev/shm
          mkdir -p "$GITHUB_WORKSPACE/output"
          CI_OUTPUT_DIR="$GITHUB_WORKSPACE/output" \
            bash "$PROJECT_ROOT/scripts/run_example.sh" "$EXAMPLE_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/train.log"

  publish-results:
    name: publish-result (${{ matrix.example.name }})
    needs: [monitor, manifest-check, run-example, run-example-a3]
    if: always() && needs.manifest-check.outputs.has_supported == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Every matrix job sees the same execution conclusions.
      execution_conclusions: ${{ needs.run-example.result }} ${{ needs.run-example-a3.result }}
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.publish_matrix) }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v6
        with:
          path: workflows

      - name: Write result JSON
        env:
          TARGET_REPO: ${{ needs.monitor.outputs.target_repo }}
          TARGET_REF: ${{ needs.monitor.outputs.target_ref }}
          TRIGGER: ${{ needs.monitor.outputs.trigger }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXAMPLE_SOURCE: ${{ matrix.example.source || '' }}
          MACHINE_TYPE: ${{ matrix.example.machine_type || '' }}
          IMAGE: ${{ matrix.example.image }}
          EXPECTED_JOB_NAME: ${{ matrix.example.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 workflows/scripts/write_example_result.py \
            --output "$GITHUB_WORKSPACE/output/result.json"

      - name: Validate result.json
        run: |
          set -euo pipefail
          python3 -m pip install -q "check-jsonschema==0.38.0"
          check-jsonschema --schemafile workflows/schemas/result.schema.json \
            output/result.json

      # Artifact upload runs on GitHub-hosted infrastructure. The self-hosted
      # NPU runner only executes the example and reports its normal job status.
      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-examples-${{ github.run_id }}-${{ strategy.job-index }}
          if-no-files-found: error
          path: output/result.json

  summarize-results:
    needs: [monitor, manifest-check, publish-results]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download example results
        id: download-results
        if: needs.manifest-check.outputs.has_supported == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.project }}-examples-${{ github.run_id }}-*
          path: example-results

      - name: Summarize example results
        id: summarize
        env:
          PROJECT: ${{ inputs.project }}
          TRIGGER: ${{ needs.monitor.outputs.trigger || github.event_name }}
          TARGET_REPO: ${{ needs.monitor.outputs.target_repo }}
          TARGET_REF: ${{ needs.monitor.outputs.target_ref }}
          REASON: ${{ needs.monitor.outputs.reason }}
          CACHE_RESULT: ${{ needs.monitor.outputs.cache_result }}
          MANIFEST_RESULT: ${{ needs.manifest-check.result }}
          PUBLISH_MATRIX: ${{ needs.manifest-check.outputs.publish_matrix }}
          CONCLUSIONS: >-
            ${{ join(needs.*.result, ' ') }}
            ${{ needs.publish-results.outputs.execution_conclusions }}
            ${{ steps.download-results.outcome }}
        run: python3 scripts/summarize_example_results.py summarize --artifacts example-results --output summary.json

      - name: Save monitor state
        id: save-state
        if: github.event_name == 'schedule' && needs.monitor.outputs.need_to_run == 'true'
        env:
          TARGET_REF: ${{ needs.monitor.outputs.target_ref }}
          WORKFLOW_FILES_HASH: ${{ needs.monitor.outputs.workflow_files_hash }}
        run: |
          set -euo pipefail
          mkdir -p .monitor-state
          if [ "$(jq -r .workflow_status summary.json)" = "success" ]; then
            OUT="success"
            jq '.machines' summary.json > .monitor-state/machines.json
          else
            OUT="failure"
          fi
          {
            printf 'last_release_tag=%q\n' "${TARGET_REF:?TARGET_REF is required}"
            printf 'release_outcome=%q\n' "$OUT"
            printf 'last_workflow_files_hash=%q\n' "$WORKFLOW_FILES_HASH"
          } > .monitor-state/.monitor
          echo "recorded outcome: $OUT, tag $TARGET_REF, wf_hash=$WORKFLOW_FILES_HASH"

      - name: Persist monitor state to cache
        if: steps.save-state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: examples-monitor-state-${{ inputs.project }}_${{ github.run_id }}

      - name: Upload example summary
        if: ${{ !cancelled() && steps.summarize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-examples-summary-${{ github.run_id }}
          path: summary.json
          if-no-files-found: error
          overwrite: true

      - name: Report summary failure
        run: test "$(jq -r .workflow_status summary.json)" != failure
