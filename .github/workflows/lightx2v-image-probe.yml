# Temporary probe: pull the candidate mindiesd image on the NPU runner
# (same `container:` mechanism as quick-start-template.yml — the runner
# host docker daemon pulls it during "Set up job / Initialize containers";
# no manual docker anywhere) and dump the preinstalled module inventory.
# The judgment table in .trae/documents/lightx2v-mindiesd-image-swap.md is
# filled from this output; delete this file together with the Phase C
# (image swap) commit.
name: lightx2v-image-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ['linux-aarch64-a2-2']
    container:
      # Candidate image for lightx2v-quick-start.yml's `image:` input.
      # ascendhub (SWR) namespace — same registry domain as the current
      # CANN 9.1.0 image, which the runner already pulls daily.
      # TODO: cross-check the exact path/tag against the ascendhub
      # mindiesd download page before dispatching.
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/mindiesd:v3.0.0-A2-ubuntu22.04-py3.11-aarch64
    steps:
      - name: probe image deps
        run: |
          python - <<'PY'
          import sys, os, importlib
          print('python', sys.version.split()[0])
          mods = ['torch', 'torch_npu', 'triton', 'cv2', 'decord', 'torchaudio',
                  'soundfile', 'zmq', 'PIL', 'torchada', 'modelscope', 'mindiesd',
                  'transformers', 'diffusers', 'imageio_ffmpeg', 'fastapi', 'av']
          for m in mods:
              try:
                  mod = importlib.import_module(m)
                  print(m, 'OK', getattr(mod, '__version__', '?'))
              except Exception as e:
                  print(m, 'MISSING', type(e).__name__, str(e)[:60])
          import torch, torch_npu
          print('npu_available:', torch.npu.is_available())
          print('device_count:', torch.npu.device_count())
          print('set_env exists:',
                os.path.isfile('/usr/local/Ascend/ascend-toolkit/set_env.sh'))
          PY
          npu-smi info | head -12 || echo 'npu-smi not found'
