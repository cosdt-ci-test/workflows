# Scheduling fields (runner, npu_devices, image, timeout, profile) come
# from each supported entry in projects/llama.cpp/examples_manifest.yaml.
# Trigger contract is section 5 of the llama.cpp simple-guard plan:
# two signals (supported-file hash OR latest release id), each tests its
# own tree, no priority, no failure retry. Do not treat
# docs/guarding-examples.md 要求 2 as this project's rule.
# Upstream default branch is master.
name: llama.cpp-examples

on:
  # First force run must go green before enabling. Do not use 0 */6
  # (that is the ms-swift Quick Start slot).
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: skip monitor gate and run examples
        type: boolean
        default: false
      target_repo:
        description: Target llama.cpp repository (force only)
        required: true
        default: ggml-org/llama.cpp
        type: string
      target_ref:
        description: Branch, tag, or SHA (force only)
        required: true
        default: master
        type: string

concurrency:
  group: ${{ github.event_name == 'schedule' && 'llama.cpp-examples-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  UPSTREAM_REPO: ggml-org/llama.cpp
  GH_API: https://api.github.com

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      trigger: ${{ steps.decide.outputs.trigger }}
      targets: ${{ steps.decide.outputs.targets }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4

      - name: Restore monitor state
        id: cache-restore
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force) }}
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          # Per-run key misses; restore-keys picks the latest save.
          # Must not prefix-collide with llama.cpp-quick-start's keys.
          key: llama.cpp-examples-monitor-state-${{ github.run_id }}
          restore-keys: |
            llama.cpp-examples-monitor-state-

      - name: Monitor supported file hash
        id: monitor-supported
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_PATH: projects/llama.cpp/examples_manifest.yaml
          STATE_DIR: .monitor-state
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          import yaml

          api = os.environ['GH_API']
          repo = os.environ['UPSTREAM_REPO']
          token = os.environ['GH_TOKEN']
          manifest_path = os.environ['MANIFEST_PATH']
          state_dir = os.environ['STATE_DIR']
          github_output = os.environ['GITHUB_OUTPUT']

          def gh_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'cosdt-ci-test-llama-cpp-monitor',
                  },
              )
              try:
                  with urllib.request.urlopen(request) as response:
                      return json.load(response), response.status
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None, 404
                  raise SystemExit(f'GET {url} failed: HTTP {exc.code}') from exc

          manifest = yaml.safe_load(
              open(manifest_path, encoding='utf-8')) or {}
          paths = [
              item['path'] for item in (manifest.get('supported') or [])
              if item.get('path')
          ]

          commit, status = gh_json(f'{api}/repos/{repo}/commits/master')
          if status != 200 or not commit or not commit.get('sha'):
              raise SystemExit('failed to resolve master SHA')
          master_sha = commit['sha']

          records = []

          def collect(path):
              quoted = urllib.parse.quote(path, safe='/')
              url = f'{api}/repos/{repo}/contents/{quoted}?ref={master_sha}'
              data, code = gh_json(url)
              if code == 404:
                  records.append((path, 'MISSING'))
                  return
              if isinstance(data, dict) and data.get('type') == 'file':
                  records.append((data['path'], data['sha']))
                  return
              if isinstance(data, list):
                  for item in data:
                      item_path = item.get('path')
                      if item.get('type') == 'file' and item_path:
                          records.append((item_path, item['sha']))
                      elif item.get('type') == 'dir' and item_path:
                          collect(item_path)
                  return
              raise SystemExit(f'unexpected contents payload for {path}')

          for supported_path in paths:
              collect(supported_path)

          records.sort(key=lambda item: item[0])
          if records:
              payload = ''.join(
                  f'{path}\t{sha}\n' for path, sha in records)
              digest = hashlib.sha256(payload.encode()).hexdigest()
          else:
              digest = hashlib.sha256(b'').hexdigest()

          os.makedirs(state_dir, exist_ok=True)
          old_path = os.path.join(state_dir, '.supported_hash')
          old = ''
          if os.path.isfile(old_path):
              old = open(old_path, encoding='utf-8').read().strip()
          changed = digest != old
          if changed:
              with open(old_path, 'w', encoding='utf-8') as handle:
                  handle.write(digest + '\n')

          with open(github_output, 'a', encoding='utf-8') as handle:
              handle.write(f'changed={"true" if changed else "false"}\n')
              handle.write(f'master_sha={master_sha}\n')
              handle.write(f'supported_hash={digest}\n')
          print(
              f'supported_hash={digest} changed={changed} '
              f'master_sha={master_sha} files={len(records)}')
          PY

      - name: Monitor upstream latest release id
        id: monitor-release
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          AUTH_HEADER="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          payload=$(curl -fsSL --retry 3 \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$GH_API/repos/$UPSTREAM_REPO/releases/latest")
          id=$(jq -r '.id // empty' <<<"$payload")
          tag=$(jq -r '.tag_name // empty' <<<"$payload")
          if [ -z "$id" ] || [ -z "$tag" ]; then
            echo "failed to read latest release id/tag" >&2
            exit 1
          fi
          tag_enc=$(jq -rn --arg t "$tag" '$t|@uri')
          release_sha=$(curl -fsSL --retry 3 \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$GH_API/repos/$UPSTREAM_REPO/commits/${tag_enc}" \
            | jq -r '.sha // empty')
          if [ -z "$release_sha" ]; then
            echo "failed to resolve release SHA for tag ${tag}" >&2
            exit 1
          fi
          old=$(cat "$STATE_DIR/.last_release_id" 2>/dev/null || echo "")
          if [ "$old" != "$id" ]; then
            echo "$id" > "$STATE_DIR/.last_release_id"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag"
          echo "release_id=$id sha=$release_sha old=$old"

      - name: Persist monitor state
        if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force)) }}
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: llama.cpp-examples-monitor-state-${{ github.run_id }}

      - name: Decide targets
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          INPUT_REPO: ${{ inputs.target_repo }}
          INPUT_REF: ${{ inputs.target_ref }}
          GH_TOKEN: ${{ github.token }}
          SUP_CHANGED: ${{ steps.monitor-supported.outputs.changed }}
          REL_CHANGED: ${{ steps.monitor-release.outputs.changed }}
          MASTER_SHA: ${{ steps.monitor-supported.outputs.master_sha }}
          RELEASE_SHA: ${{ steps.monitor-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          AUTH_HEADER="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            repo="${INPUT_REPO:-$UPSTREAM_REPO}"
            ref="${INPUT_REF:-master}"
            sha=$(curl -fsSL --retry 3 \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              "$GH_API/repos/${repo}/commits/${ref}" | jq -r '.sha // empty')
            if [ -z "$sha" ]; then
              echo "failed to resolve ${repo}@${ref}" >&2
              exit 1
            fi
            targets=$(jq -cn --arg repo "$repo" --arg ref "$sha" \
              '[{target_repo:$repo,target_ref:$ref,reason:"manual"}]')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "trigger=workflow_dispatch" >> "$GITHUB_OUTPUT"
            {
              echo "targets<<EOF"
              echo "$targets"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "force run repo=$repo sha=$sha"
            exit 0
          fi
          targets='[]'
          if [ "${SUP_CHANGED:-}" = "true" ] && [ "${REL_CHANGED:-}" = "true" ]; then
            if [ "$MASTER_SHA" = "$RELEASE_SHA" ]; then
              targets=$(jq -cn --arg repo "$UPSTREAM_REPO" --arg ref "$MASTER_SHA" \
                '[{target_repo:$repo,target_ref:$ref,reason:"supported,release"}]')
            else
              targets=$(jq -cn --arg repo "$UPSTREAM_REPO" --arg m "$MASTER_SHA" --arg r "$RELEASE_SHA" \
                '[{target_repo:$repo,target_ref:$m,reason:"supported"},{target_repo:$repo,target_ref:$r,reason:"release"}]')
            fi
          elif [ "${SUP_CHANGED:-}" = "true" ]; then
            targets=$(jq -cn --arg repo "$UPSTREAM_REPO" --arg ref "$MASTER_SHA" \
              '[{target_repo:$repo,target_ref:$ref,reason:"supported"}]')
          elif [ "${REL_CHANGED:-}" = "true" ]; then
            targets=$(jq -cn --arg repo "$UPSTREAM_REPO" --arg ref "$RELEASE_SHA" \
              '[{target_repo:$repo,target_ref:$ref,reason:"release"}]')
          fi
          if [ "$targets" != "[]" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "trigger=${EVENT_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "targets<<EOF"
            echo "$targets"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "targets=$targets"

  manifest-check:
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      supported_matrix: ${{ steps.check.outputs.supported_matrix }}
      has_supported: ${{ steps.check.outputs.has_supported }}
      run_matrix: ${{ steps.check.outputs.run_matrix }}
      has_run_matrix: ${{ steps.check.outputs.has_run_matrix }}
      diffusion_matrix: ${{ steps.check.outputs.diffusion_matrix }}
      has_diffusion: ${{ steps.check.outputs.has_diffusion }}
      dream_target_repo: ${{ steps.check.outputs.dream_target_repo }}
      dream_target_ref: ${{ steps.check.outputs.dream_target_ref }}
      dream_image: ${{ steps.check.outputs.dream_image }}
      dream_runner: ${{ steps.check.outputs.dream_runner }}
      dream_device_options: ${{ steps.check.outputs.dream_device_options }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Check examples manifest
        id: check
        env:
          TARGETS: ${{ needs.monitor.outputs.targets }}
          TRIGGER: ${{ needs.monitor.outputs.trigger }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install -q pyyaml
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          targets = json.loads(os.environ['TARGETS'])
          trigger = os.environ['TRIGGER']
          all_entries = []
          run_entries = []
          diffusion_entries = []

          def checkout(repo, ref, dest):
              dest_path = Path(dest)
              if dest_path.exists():
                  subprocess.run(['rm', '-rf', str(dest_path)], check=True)
              dest_path.mkdir(parents=True)
              subprocess.run(['git', 'init'], cwd=dest_path, check=True)
              origin = f'https://github.com/{repo}.git'
              subprocess.run(
                  ['git', 'remote', 'add', 'origin', origin],
                  cwd=dest_path, check=True)
              subprocess.run(
                  ['git', 'fetch', '--depth', '1', 'origin', ref],
                  cwd=dest_path, check=True)
              subprocess.run(
                  ['git', 'checkout', '--detach', 'FETCH_HEAD'],
                  cwd=dest_path, check=True)

          for target in targets:
              repo = target['target_repo']
              ref = target['target_ref']
              reason = target['reason']
              checkout(repo, ref, 'target')
              if len(targets) == 1:
                  result_path = 'manifest_check_result.json'
              else:
                  result_path = f'manifest_check_result-{reason}.json'
              env = os.environ.copy()
              env.pop('GITHUB_OUTPUT', None)
              proc = subprocess.run(
                  [
                      sys.executable,
                      'workflows/scripts/check_examples_manifest.py',
                      '--target-root', 'target',
                      '--manifest',
                      'workflows/projects/llama.cpp/examples_manifest.yaml',
                      '--result-json', result_path,
                      '--target-repo', repo,
                      '--target-ref', ref,
                      '--trigger', trigger,
                  ],
                  env=env,
                  check=False,
              )
              if proc.returncode != 0:
                  raise SystemExit(proc.returncode)
              result = json.loads(
                  Path(result_path).read_text(encoding='utf-8'))
              for item in result['supported']:
                  npu = item['npu_devices']
                  options = ' '.join(
                      f'--device=/dev/davinci{index}'
                      for index in npu.split(','))
                  entry = dict(item)
                  entry['device_options'] = options
                  entry['overlay_args'] = item.get('overlay_args') or []
                  exec_path = item.get('exec')
                  if exec_path:
                      entry['exec'] = exec_path.strip()
                  entry['target_repo'] = repo
                  entry['target_ref'] = ref
                  entry['reason'] = reason
                  all_entries.append(entry)
                  if item['path'] == 'examples/diffusion':
                      diffusion_entries.append(entry)
                  else:
                      run_entries.append(entry)

          output_path = os.environ['GITHUB_OUTPUT']
          with open(output_path, 'a', encoding='utf-8') as handle:
              def write_matrix(name, entries):
                  handle.write(f'{name}<<EOF\n')
                  handle.write(json.dumps(entries, ensure_ascii=False))
                  handle.write('\nEOF\n')

              write_matrix('supported_matrix', all_entries)
              write_matrix('run_matrix', run_entries)
              write_matrix('diffusion_matrix', diffusion_entries)
              handle.write(
                  'has_supported={}\n'.format(
                      'true' if all_entries else 'false'))
              handle.write(
                  'has_run_matrix={}\n'.format(
                      'true' if run_entries else 'false'))
              handle.write(
                  'has_diffusion={}\n'.format(
                      'true' if diffusion_entries else 'false'))
              if diffusion_entries:
                  first = diffusion_entries[0]
                  handle.write(
                      f'dream_target_repo={first["target_repo"]}\n')
                  handle.write(
                      f'dream_target_ref={first["target_ref"]}\n')
                  handle.write(f'dream_image={first["image"]}\n')
                  handle.write(f'dream_runner={first["runner"]}\n')
                  handle.write(
                      f'dream_device_options={first["device_options"]}\n')
          PY

      - name: Validate manifest check result
        run: |
          set -euo pipefail
          python3 -m pip install -q check-jsonschema
          files=()
          for file in \
            manifest_check_result.json \
            manifest_check_result-supported.json \
            manifest_check_result-release.json
          do
            if [[ -f "$file" ]]; then
              files+=("$file")
            fi
          done
          if ((${#files[@]} == 0)); then
            echo "no manifest check result files" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            check-jsonschema \
              --schemafile workflows/schemas/manifest_check_result.schema.json \
              "$file"
          done

      - name: Upload manifest check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-manifest-check
          if-no-files-found: ignore
          path: |
            manifest_check_result.json
            manifest_check_result-supported.json
            manifest_check_result-release.json

  # Dream GGUF is ~8GB. Only examples/diffusion needs it. GitHub Actions
  # `needs` is per-job, not per matrix row, so diffusion is split out and
  # only that job waits here. HF weights stay in NFS if convert fails.
  prepare-dream-gguf:
    needs: [monitor, manifest-check]
    if: needs.manifest-check.outputs.has_diffusion == 'true'
    runs-on: ${{ needs.manifest-check.outputs.dream_runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      TARGET_ROOT: ${{ github.workspace }}/target
      PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TIMEOUT: "120"
    container:
      image: ${{ needs.manifest-check.outputs.dream_image }}
      options: >-
        --shm-size=64g
        ${{ needs.manifest-check.outputs.dream_device_options }}
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/root/.cache/cosdt-ci-test:/root/.cache/cosdt-ci-test
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.manifest-check.outputs.dream_target_repo }}
          ref: ${{ needs.manifest-check.outputs.dream_target_ref }}
          path: target

      - name: Prepare Dream GGUF
        run: bash workflows/projects/llama.cpp/scripts/prepare_dream_gguf.sh

  # Skipped when the remaining matrix is empty (an empty matrix fails the run).
  run-example:
    name: run-example (${{ matrix.example.path }} @ ${{ matrix.example.target_ref }})
    needs: [monitor, manifest-check]
    if: needs.manifest-check.outputs.has_run_matrix == 'true'
    runs-on: ${{ matrix.example.runner }}
    timeout-minutes: ${{ matrix.example.timeout_minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.run_matrix) }}
    env:
      ASCEND_RT_VISIBLE_DEVICES: ${{ matrix.example.npu_devices }}
      PROJECT_ROOT: ${{ github.workspace }}/workflows/projects/llama.cpp
      TARGET_ROOT: ${{ github.workspace }}/target
      FIXTURE_DIR: ${{ github.workspace }}/workflows/projects/llama.cpp/fixtures
      PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TIMEOUT: "120"
    container:
      image: ${{ matrix.example.image }}
      # Card mounts come from npu_devices via matrix.example.device_options.
      # Card selection also uses ASCEND_RT_VISIBLE_DEVICES (manifest npu_devices).
      # SFS Turbo is on the host at /root/.cache; bind it so later jobs can
      # reuse the Dream GGUF (harmless for examples that do not read it).
      options: >-
        --shm-size=64g
        ${{ matrix.example.device_options }}
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/root/.cache/cosdt-ci-test:/root/.cache/cosdt-ci-test
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.example.target_repo }}
          ref: ${{ matrix.example.target_ref }}
          path: target

      - name: Source CANN and check NPU
        run: |
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info

      # Installs the project and any profile-specific deps. Each project
      # implements projects/llama.cpp/scripts/setup_example.sh; $1 is the
      # manifest profile. Unknown profiles must fail before installing.
      - name: Setup example environment
        env:
          PROFILE: ${{ matrix.example.profile }}
          EXEC: ${{ matrix.example.exec }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
        run: bash "$PROJECT_ROOT/scripts/setup_example.sh" "$PROFILE"

      - name: Run example
        env:
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXEC: ${{ matrix.example.exec }}
          PROFILE: ${{ matrix.example.profile }}
          OVERLAY_ARGS: ${{ toJSON(matrix.example.overlay_args) }}
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p "$GITHUB_WORKSPACE/output"
          CI_OUTPUT_DIR="$GITHUB_WORKSPACE/output" \
            bash "$PROJECT_ROOT/scripts/run_example.sh" "$EXAMPLE_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/train.log"

  # Same display name as run-example so publish-result Jobs API lookup still
  # matches. Only this job waits on prepare-dream-gguf.
  run-diffusion:
    name: run-example (${{ matrix.example.path }} @ ${{ matrix.example.target_ref }})
    needs: [monitor, manifest-check, prepare-dream-gguf]
    if: needs.manifest-check.outputs.has_diffusion == 'true'
    runs-on: ${{ matrix.example.runner }}
    timeout-minutes: ${{ matrix.example.timeout_minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.diffusion_matrix) }}
    env:
      ASCEND_RT_VISIBLE_DEVICES: ${{ matrix.example.npu_devices }}
      PROJECT_ROOT: ${{ github.workspace }}/workflows/projects/llama.cpp
      TARGET_ROOT: ${{ github.workspace }}/target
      FIXTURE_DIR: ${{ github.workspace }}/workflows/projects/llama.cpp/fixtures
      PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TIMEOUT: "120"
    container:
      image: ${{ matrix.example.image }}
      options: >-
        --shm-size=64g
        ${{ matrix.example.device_options }}
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/root/.cache/cosdt-ci-test:/root/.cache/cosdt-ci-test
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.example.target_repo }}
          ref: ${{ matrix.example.target_ref }}
          path: target

      - name: Source CANN and check NPU
        run: |
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info

      - name: Setup example environment
        env:
          PROFILE: ${{ matrix.example.profile }}
          EXEC: ${{ matrix.example.exec }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
        run: bash "$PROJECT_ROOT/scripts/setup_example.sh" "$PROFILE"

      - name: Run example
        env:
          EXAMPLE_PATH: ${{ matrix.example.path }}
          EXEC: ${{ matrix.example.exec }}
          PROFILE: ${{ matrix.example.profile }}
          OVERLAY_ARGS: ${{ toJSON(matrix.example.overlay_args) }}
        run: |
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p "$GITHUB_WORKSPACE/output"
          CI_OUTPUT_DIR="$GITHUB_WORKSPACE/output" \
            bash "$PROJECT_ROOT/scripts/run_example.sh" "$EXAMPLE_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/train.log"

  validate-results:
    name: publish-result (${{ matrix.example.path }} @ ${{ matrix.example.target_ref }})
    needs: [monitor, manifest-check, run-example, run-diffusion]
    if: always() && needs.manifest-check.outputs.has_supported == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.supported_matrix) }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Write result JSON
        env:
          TARGET_REPO: ${{ matrix.example.target_repo }}
          TARGET_REF: ${{ matrix.example.target_ref }}
          TRIGGER: ${{ needs.monitor.outputs.trigger }}
          REASON: ${{ matrix.example.reason }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
          IMAGE: ${{ matrix.example.image }}
          EXPECTED_JOB_NAME: run-example (${{ matrix.example.path }} @ ${{ matrix.example.target_ref }})
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" |
              jq -r --arg name "$EXPECTED_JOB_NAME" \
                '.jobs[] | select(.name == $name) | .conclusion'
          )"
          if [ -z "$conclusion" ]; then
            echo "could not find completed job: $EXPECTED_JOB_NAME"
            exit 1
          fi
          case "$conclusion" in
            success|cancelled)
              job_status="$conclusion"
              ;;
            *)
              job_status="failure"
              ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/output"
          export JOB_STATUS="$job_status"
          python3 - <<'EOF'
          import json
          import os

          result = {
              'trigger': os.environ['TRIGGER'],
              'target_repo': os.environ['TARGET_REPO'],
              'target_ref': os.environ['TARGET_REF'],
              'path': os.environ['EXAMPLE_PATH'],
              'image': os.environ['IMAGE'],
              'job_status': os.environ['JOB_STATUS'],
              'reason': os.environ['REASON'],
          }
          out = os.path.join(os.environ['GITHUB_WORKSPACE'], 'output', 'result.json')
          with open(out, 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          EOF

      - name: Validate result.json
        run: |
          set -euo pipefail
          python3 -m pip install -q check-jsonschema
          check-jsonschema --schemafile workflows/schemas/result.schema.json \
            output/result.json

      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-examples-${{ github.run_id }}-${{ strategy.job-index }}
          if-no-files-found: error
          path: output/result.json
