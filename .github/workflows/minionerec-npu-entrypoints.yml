# MiniOneRec entry-point audit - project thin trigger.
#
# Companion to minionerec-quick-start.yml. The quick start only executes
# SFT + constrained-decoding evaluation; this run imports every other entry
# script (GPR variants, RL pair, SASRec, RQ preprocessing) on the NPU to
# prove the npu_support shim resolves from each script's own working
# directory and that module-level torch.cuda use still works under
# transfer_to_npu.
#
# Scope: clone + pip + import only -- no model, no dataset, no training.
# Expected runtime is a few minutes, so this is cheap enough to re-run for
# any change that touches entry scripts or npu_support.py.
#
# torch stack matches the quick start (torch 2.9.0 + torch_npu 2.9.0.post2,
# CANN 9.1.0 pairing). `rl.py` additionally needs trl/scikit-learn and the
# rq/ scripts need polars/openai, all installed by the audit doc itself.

name: minionerec-npu-entrypoints

concurrency:
  group: ${{ github.event_name == 'schedule' && 'minionerec-npu-entrypoints-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minionerec-npu-entrypoints:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: minionerec
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
      timeout_minutes: 60
      upstream_repo: yzeyu71/MiniOneRec
      fixed_ref: npu-support
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/minionerec/docs/NPU-entrypoints.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/minionerec/docs/NPU-entrypoints.md
      test_command: python -m unittest tests.test_npu_entrypoints -v 2>&1
