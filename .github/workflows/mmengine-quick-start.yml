# mmengine quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# Cache keys (quick-start-monitor-state-mmengine_*) and artifact names are
# derived from project=mmengine, not from the workflow name.
#
# No device mounts and no bind mounts: MMEngine is a pure framework, so
# there is no model hub cache to persist (the doc's toy model / dataset
# are generated locally, deterministic, and cost nothing to rebuild).
# The self-hosted NPU runner (`linux-aarch64-a2-1`, 1-card) auto-passes
# `/dev/davinci*` into the container via the cluster device-plugin, so
# container_options stays empty for device binds.

name: mmengine-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'mmengine-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Weekly: '40 3 * * 1' fires at 03:40 UTC every Monday (11:40
    # 北京时间). MMEngine releases on its own schedule (roughly every
    # few months), so a weekly audit is more than enough to catch an
    # upstream release and still leaves the NPU runner free for the
    # daily projects.
    - cron: '40 3 * * 1'
  workflow_dispatch:
  # PR trigger: docs/tests changes get a guard run. paths filter avoids
  # burning the self-hosted NPU runner on unrelated PRs. `pull_request`
  # (not `pull_request_target`): contents: read is enough, no
  # write-token risk. {0} in doc_url is filled with the PR head SHA so
  # the PR-version of the doc is tested; fork PRs 404 on doc fetch and
  # are accepted (content lands on this repo post-merge).
  pull_request:
    branches: [main]
    paths:
      - 'projects/mmengine/**'
      - '.github/workflows/mmengine-quick-start.yml'

permissions:
  contents: read

jobs:
  mmengine-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-mmengine_*),
      # artifacts (mmengine-quick-start-<run_id>) and the test working
      # dir (workflows/projects/mmengine).
      project: mmengine
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # 60 min ceiling: the run clones mmengine at the latest release
      # tag, installs it editable + from PyPI, swaps opencv-python for
      # opencv-python-headless, then runs 17 NPU smokes (two of them
      # full Runner trainings). No model downloads, so the whole thing
      # is dominated by dependency resolution.
      timeout_minutes: 60
      upstream_repo: open-mmlab/mmengine
      # Contents API URL (NOT raw.githubusercontent.com): raw is
      # firewalled off the NPU runner, and the engine's monitor
      # already sends the Contents API auth headers. `?ref=${{ github.sha }}`
      # is load-bearing: without it the Contents API defaults to the repo
      # default branch (`main`) and a dispatch on this branch would
      # silently test main's doc.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/mmengine/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/mmengine/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/mmengine; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep (CANN source, CUDA exclusion list, uv install, setuptools
      # pin, torch stack probe) lives in the test subclass's
      # prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
