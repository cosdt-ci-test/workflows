# mooncake quick start guard - project thin trigger.
#
# The shared quick-start template owns monitoring, cache state, result
# validation, and artifact publishing. Project-specific environment setup
# and document execution live in projects/mooncake/tests.

name: mooncake-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'mooncake-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '50 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mooncake-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: mooncake
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/etc/hccn.conf:/etc/hccn.conf:ro
      timeout_minutes: 240
      upstream_repo: kvcache-ai/Mooncake
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/mooncake/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/mooncake/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
