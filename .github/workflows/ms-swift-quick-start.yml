name: ms-swift-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'ms-swift-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  schedule:
    # Tight 5-minute cadence for local testing only - GitHub caps
    # schedule at 5 min minimum. Production is '0 */6 * * *'
    # (every 6 hours); switch back before merging.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_IMAGE: &ci_image swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
  UPSTREAM_REPO: modelscope/ms-swift
  MONITORED_DOC_URL: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/ms-swift/docs/Quick-start-Ascend.md
  GH_API: https://api.github.com

jobs:
  # Restore the previous run's monitor state on a GitHub-hosted
  # ubuntu-latest runner, then ship the four tracked fields as job
  # outputs to monitor-and-test (which runs on a self-hosted NPU
  # runner that can't reach the cache blob storage and can't be
  # trusted to compute the same cache version hash because of
  # platform / compression differences). Doing the restore here
  # keeps save (publish-and-persist, also ubuntu-latest) and
  # restore on the same runner type, so the cache version hash
  # is consistent across write and read.
  restore-cache:
    name: restore monitor state from cache
    runs-on: ubuntu-latest
    outputs:
      cache_last_release_id: ${{ steps.read-monitor.outputs.cache_last_release_id }}
      cache_doc_hash:        ${{ steps.read-monitor.outputs.cache_doc_hash }}
      cache_test_result:     ${{ steps.read-monitor.outputs.cache_test_result }}
      cache_test_error:      ${{ steps.read-monitor.outputs.cache_test_error }}
    steps:
      - name: Restore monitor state
        uses: actions/cache/restore@v6
        with:
          path: .monitor-state
          # Stable key + restore-keys prefix so we always pull the
          # most recent entry, regardless of the current run_id.
          key: cache-not-used-restore-keys-only
          restore-keys: monitor-state-ms-swift-

      # .monitor-state/.monitor is a bash-sourceable key=value file
      # (last_release_id='...', doc_hash='...', test_result='...',
      # test_error='...'). Source it and re-emit each field as a
      # step output so monitor-and-test can ship them through env
      # to the materialize step below - cleaner than passing the
      # raw file content as one big string output. A cold cache
      # (no entry restored) means no outputs are written; the
      # downstream `needs.X.outputs.Y` expressions evaluate to an
      # empty string in that case, which the materialize step
      # handles by writing empty values into .monitor.
      - id: read-monitor
        run: |
          set -euo pipefail
          if [ -f .monitor-state/.monitor ]; then
            . .monitor-state/.monitor
            [ -n "${last_release_id:-}" ] && echo "cache_last_release_id=$last_release_id" >> "$GITHUB_OUTPUT"
            [ -n "${doc_hash:-}" ]        && echo "cache_doc_hash=$doc_hash" >> "$GITHUB_OUTPUT"
            [ -n "${test_result:-}" ]    && echo "cache_test_result=$test_result" >> "$GITHUB_OUTPUT"
            [ -n "${test_error:-}" ]     && echo "cache_test_error=$test_error" >> "$GITHUB_OUTPUT"
            echo "monitor state restored: cache_last_release_id='$last_release_id' cache_doc_hash='$doc_hash' cache_test_result='$test_result' cache_test_error='$test_error'"
          else
            echo "no cache entry restored - cold start (empty monitor state)"
          fi

  monitor-and-test:
    name: monitor + test on change
    needs: restore-cache
    runs-on: [linux-aarch64-a2-1]
    timeout-minutes: 180
    # Each monitor field ships as its own job output; record-monitor-
    # outcome is the single writer, publish-and-persist reconstructs
    # .monitor-state/ + calls actions/cache/save. The NPU runner
    # cannot reach GitHub's cache blob storage (firewalled), so we
    # route persistence through job outputs to the ubuntu-latest job.
    outputs:
      result_json:             ${{ steps.write-result.outputs.result_json }}
      trigger:                 ${{ steps.write-result.outputs.trigger }}
      reason:                  ${{ steps.record-monitor-outcome.outputs.reason }}
      job_status:              ${{ steps.write-result.outputs.job_status }}
      need_to_test:            ${{ steps.decide.outputs.need_to_test }}
      monitor_last_release_id: ${{ steps.record-monitor-outcome.outputs.monitor_last_release_id }}
      monitor_doc_hash:        ${{ steps.record-monitor-outcome.outputs.monitor_doc_hash }}
      monitor_test_result:     ${{ steps.record-monitor-outcome.outputs.monitor_test_result }}
      monitor_test_error:      ${{ steps.record-monitor-outcome.outputs.monitor_test_error }}
    defaults:
      run:
        shell: bash
    container:
      image: *ci_image
      options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/modelscope:/root/.cache/modelscope
    env:
      # Cluster-internal nginx PyPI cache fronts every package
      # (PEP 517 build deps + NPU wheels), so installs don't fall
      # back to external mirrors the runner can't reach.
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: "unsafe-best-match"
      UV_INSECURE_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      UV_HTTP_TIMEOUT: "120"
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_TIMEOUT: "120"
    steps:
      - name: Print context and source CANN
        run: |
          echo "=========================================="
          echo "Trigger:    ${{ github.event_name }}"
          echo "Runner:     ${{ runner.name }}"
          echo "=========================================="
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info || true

      - name: Checkout workflows (provides the test code and doc)
        uses: actions/checkout@v6
        with:
          path: workflows
          fetch-depth: 1

      # ===== Materialize monitor state from upstream job =====
      # restore-cache ran on ubuntu-latest, read .monitor-state/.monitor
      # from cache, and shipped each tracked field as a job output.
      # Reconstruct the same bash-sourceable key=value file here so
      # the monitor step below can `.` it as if it had been restored
      # locally. Cold cache means upstream outputs are empty strings,
      # which yields a file with all four values empty - the monitor
      # step handles that with its own lower-case defaults before
      # sourcing.
      - name: Materialize monitor state file
        env:
          RESTORED_LAST_RELEASE_ID: ${{ needs.restore-cache.outputs.cache_last_release_id }}
          RESTORED_DOC_HASH:        ${{ needs.restore-cache.outputs.cache_doc_hash }}
          RESTORED_TEST_RESULT:     ${{ needs.restore-cache.outputs.cache_test_result }}
          RESTORED_TEST_ERROR:      ${{ needs.restore-cache.outputs.cache_test_error }}
        run: |
          set -euo pipefail
          mkdir -p .monitor-state
          {
            echo "last_release_id='$RESTORED_LAST_RELEASE_ID'"
            echo "doc_hash='$RESTORED_DOC_HASH'"
            echo "test_result='$RESTORED_TEST_RESULT'"
            echo "test_error='$RESTORED_TEST_ERROR'"
          } > .monitor-state/.monitor
          echo "materialized .monitor-state/.monitor:"
          cat .monitor-state/.monitor

      # Two monitors feed the decide step (release > doc by priority).
      # Each step sources its cache file, decides in-memory against
      # local vars only, then writes its decision to /tmp/.decision
      # (read by decide). A failure outcome from a previous cycle
      # forces a retry even if the signal hasn't changed; a success
      # from record-monitor-outcome clears that flag.
      - name: Monitor upstream release and doc
        id: monitor
        # Monitor only runs on schedule - it maintains the cache state
        # (.monitor-state/.monitor) by comparing the latest release /
        # doc hash against the cached previous-cycle values. On
        # workflow_dispatch we don't want to mutate that state:
        # dispatch is a one-shot read-only path that just decides
        # "test the latest release now" without overwriting the
        # schedule's retry chain. The dispatch branch in `decide`
        # below fetches the latest release tag independently.
        # if: github.event_name == 'schedule'
        env:
          DOC_URL: ${{ env.MONITORED_DOC_URL }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          DECISION_FILE="/tmp/.decision"
          LOCAL_MONITOR="/tmp/.monitor"
          # Single merged cache file. Release and doc signals travel
          # together: they're sourced / written as one unit and the
          # decide step sees whichever side fired via REASON.
          MONITOR_FILE="$STATE_DIR/.monitor"

          # Default all four lowercase vars (matching the file's vars
          # and the `if` reads below) before sourcing so set -u is
          # safe when the cache is cold and MONITOR_FILE doesn't
          # exist yet. test_result / test_error cover both release
          # and doc signals - we don't need to track which side
          # failed because a retry re-runs the same upstream commit
          # either way, and the side that triggered the next cycle
          # is in REASON.
          last_release_id=""
          doc_hash=""
          test_result=""
          test_error=""
          if [ -f "$MONITOR_FILE" ]; then
            echo "MONITOR_FILE exist"
            . "$MONITOR_FILE"
          fi
          LAST_RELEASE_ID="$last_release_id"
          DOC_HASH="$doc_hash"
          TEST_RESULT="$test_result"
          TEST_ERROR="$test_error"
          echo "monitor cache: release(id=$LAST_RELEASE_ID) doc(hash=$DOC_HASH) test(result=$TEST_RESULT error=$TEST_ERROR)"

          # ----- release signal -----
          curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/releases/latest" -o /tmp/release.json
          CURRENT_RELEASE_ID=$(jq -r '.id // empty' /tmp/release.json)
          CURRENT_RELEASE_TAG=$(jq -r '.tag_name // empty' /tmp/release.json)

          NEED_TO_TEST="false"
          REF=""
          REASON=""
          SKIP_DOC="false"
          if [ -n "$CURRENT_RELEASE_ID" ] && [ "$LAST_RELEASE_ID" != "$CURRENT_RELEASE_ID" ]; then
            LAST_RELEASE_ID="$CURRENT_RELEASE_ID"
            NEED_TO_TEST="true"
            REF="$CURRENT_RELEASE_TAG"
            REASON="release"
            SKIP_DOC="true"
          fi

          # ----- doc signal (only if release didn't fire) -----
          if [ "$SKIP_DOC" = "false" ]; then
            CURRENT_DOC_HASH=$(curl -fsSL --retry 3 "$DOC_URL" | sha256sum | cut -d' ' -f1)
            if [ "$DOC_HASH" != "$CURRENT_DOC_HASH" ]; then
              DOC_HASH="$CURRENT_DOC_HASH"
              NEED_TO_TEST="true"
              REF="$CURRENT_RELEASE_TAG"
              REASON="doc"
            fi
          fi

          # ----- retry signal (lowest priority) -----
          # Triggered when neither release nor doc signal changed but
          # the previous cycle's outcome was failure. REASON stays
          # 'release' / 'doc' / empty above; this only sets 'retry'.
          if [ "$NEED_TO_TEST" = "false" ] && [ "$TEST_RESULT" = "failure" ]; then
            NEED_TO_TEST="true"
            REF="$CURRENT_RELEASE_TAG"
            REASON="retry"
          fi

          # Values are single-quoted so literals like 'none' and any
          # shell-meta chars round-trip safely when record-monitor-
          # outcome sources this file via `.`.
          {
            echo "last_release_id='$LAST_RELEASE_ID'"
            echo "doc_hash='$DOC_HASH'"
            echo "test_result='$TEST_RESULT'"
            echo "test_error='$TEST_ERROR'"
          } > "$LOCAL_MONITOR"
          echo "monitor state: release(id=$LAST_RELEASE_ID) doc(hash=$DOC_HASH) test(result=$TEST_RESULT error=$TEST_ERROR)"

          {
            echo "need_to_test='$NEED_TO_TEST'"
            echo "ref='$REF'"
            echo "reason='$REASON'"
          } > "$DECISION_FILE"
          echo "monitor decision: release_tag=$REF need_to_test=$NEED_TO_TEST reason=$REASON"

      # Picks the higher-priority monitor (release > doc) for test_ref.
      # Schedule: source /tmp/.decision - need_to_test reflects whether
      # the upstream signal actually changed since last run.
      # workflow_dispatch: force need_to_test=true regardless of cache
      # state, but use the same release ref the monitor step just
      # resolved (NOT a hardcoded 'main') so dispatch always tests the
      # most recent upstream release. Only test_ref crosses the
      # $GITHUB_OUTPUT boundary here - every other monitor output stays
      # in /tmp/.decision until record-monitor-outcome sources it.
      - name: Decide which ref to test
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          DECISION_FILE="/tmp/.decision"

          # Default all three decision keys (lowercase - same name as
          # the /tmp/.decision file's vars and the `if` reads below)
          # before either branch so `set -u` is safe: dispatch
          # overwrites; schedule sources /tmp/.decision when present,
          # else falls through with the defaults (no monitor fired ->
          # need_to_test stays "false").
          need_to_test="false"
          reason=""
          ref=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            need_to_test="true"
            reason="manual"
            ref=$(curl -fsSL --max-time 30 "$GH_API/repos/${{ env.UPSTREAM_REPO }}/releases/latest" \
                   | jq -r '.tag_name // empty')
            [ -n "$ref" ] || { echo "ERROR: failed to resolve latest upstream release tag"; exit 1; }
            echo "monitor decision (manual override): ref=$ref need_to_test=true reason=manual"
          elif [ -f $DECISION_FILE ]; then
            . $DECISION_FILE
          fi

          if [ "$need_to_test" = "true" ]; then
            echo "need_to_test=true" >> "$GITHUB_OUTPUT"
            echo "test_ref=$ref" >> "$GITHUB_OUTPUT"
            echo "Monitor fired: reason=$reason ref=$ref"

            SHA=$(curl -fsSL "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/$ref" \
              | jq -r '.sha // empty')
            [ -z "$SHA" ] && { echo "failed to resolve $ref"; exit 1; }
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "Upstream commit: $SHA"
          else
            echo "No upstream changes - skipping install + test"
          fi

      - name: Run quick start test
        id: test
        if: steps.decide.outputs.need_to_test == 'true'
        env:
          # Only the three vars test_quick_start_ascend.py actually
          # reads; UPSTREAM_REPO / MONITORED_DOC_URL propagate from
          # jobs.env and REASON is purely diagnostic.
          SWIFT_NPU_E2E:   '1'
          UPSTREAM_REF:    ${{ steps.decide.outputs.test_ref }}
          UPSTREAM_COMMIT: ${{ steps.decide.outputs.sha }}
        run: |
          set -euo pipefail
          # CANN env only lives in the shell that sourced it; re-source
          # here so swift sft / swift infer see ASCEND_HOME etc.
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          # Block CUDA wheels so a transitive dep can't silently pull
          # nvidia-* into an NPU run. torch / torch_npu are NOT
          # constrained here: the torch_stack_probe below decides
          # whether to reuse the image's pre-installed torch or
          # install from the cluster cache. Pinning torch here would
          # force pip to redo the wheel lookup, which 064a5d7 / 7136ed1
          # tried and failed when aliyun's mirror was reachable but
          # the cluster cache was not authoritative.
          cat >/tmp/ms_swift_npu_constraints.txt <<'EOF'
          modelscope==1.37.0
          cuda-toolkit<0
          cuda-python<0
          cuda-bindings<0
          cuda-core<0
          cuda-pathfinder<0
          flashinfer-python<0
          nvidia-cublas<0
          nvidia-cuda-runtime<0
          nvidia-cuda-nvrtc<0
          nvidia-cuda-cupti<0
          nvidia-cudnn<0
          nvidia-cudnn-frontend<0
          nvidia-cufft<0
          nvidia-curand<0
          nvidia-cusolver<0
          nvidia-cusparse<0
          nvidia-cutlass-dsl<0
          nvidia-cutlass-dsl-libs-base<0
          nvidia-cutlass-dsl-libs-core<0
          nvidia-cutlass-dsl-libs-cu12<0
          nvidia-ml-py<0
          nvidia-nccl<0
          nvidia-nvjitlink<0
          nvidia-nvtx<0
          nvidia-cublas-cu12<0
          nvidia-cuda-nvdisasm<0
          nvidia-cuda-runtime-cu12<0
          nvidia-cuda-nvrtc-cu12<0
          nvidia-cuda-cupti-cu12<0
          nvidia-cudnn-cu12<0
          nvidia-cufft-cu12<0
          nvidia-curand-cu12<0
          nvidia-cusolver-cu12<0
          nvidia-cusparse-cu12<0
          nvidia-cusparselt-cu12<0
          nvidia-nccl-cu12<0
          nvidia-nvjitlink-cu12<0
          nvidia-nvtx-cu12<0
          EOF
          export PIP_CONSTRAINT=/tmp/ms_swift_npu_constraints.txt
          export UV_CONSTRAINT=/tmp/ms_swift_npu_constraints.txt
          # uv handles PEP 517 build deps more reliably than pip and
          # the test's setUpClass invokes `uv pip install ...`.
          python -m pip install uv
          # The pinned CANN 9.1.0 / py3.12 image ships torch 2.9.0 +
          # torch_npu 2.9.0.post2 pre-installed, so probe first and
          # skip the install when the image's torch stack matches.
          # The fall-through path is hit only when the image is rebuilt
          # without a torch stack or bumped to a different torch line.
          # We don't pin torch here by default because hard-pinning
          # torch==2.9.0+cpu on a workflow that doesn't need to
          # reinstall torch tends to trigger PyPI simple-page lookups
          # under the +cpu local version label, which the cluster
          # cache does not serve.
          #
          # Note: torch.__version__ surfaces as '2.9.0+cpu' via the
          # PEP 440 local version label regardless of device - the
          # '+cpu' names the libtorch build variant, not the runtime.
          # Actual compute goes through torch_npu (CANN backend);
          # ms-swift moves the model with .to('npu:0').
          if python -c "
          import torch, torch_npu
          raise SystemExit(0 if torch.__version__.startswith('2.9.0') \
              and torch_npu.__version__.startswith('2.9.0') else 1)
          " 2>/dev/null; then
            echo "reusing image torch stack (torch $(python -c 'import torch; print(torch.__version__)'), torch_npu $(python -c 'import torch_npu; print(torch_npu.__version__)'))"
          else
            echo "installing torch==2.9.0 torch_npu==2.9.0.post2"
            python -m pip install \
                --index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
                --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi \
                --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
                torch==2.9.0 torch_npu==2.9.0.post2
          fi
          python -m pip install "transformers<5.0" "peft<0.19"
          # vLLM-Ascend setup removed: vllm-ascend 0.18.0 (and the
          # matching 0.22.1rc1 line) both have unresolved dep conflicts
          # in this runner's reachable mirror set - the 0.18 wheel
          # Requires-Dist pins triton-ascend==3.2.0, but the
          # huaweicloud ascend mirror only publishes 3.2.1 / 3.2.2.
          # Quick-start therefore tests the transformers / torch_npu
          # infer backend only; vLLM-Ascend setup is in NPU-support.md.
          # The doc owns the source install step (its '## install
          # ms-swift' block runs git clone + uv pip install -e . for
          # the exact <UPSTREAM_REF>); we just run the doc itself as
          # a unittest - every shell block becomes one or more cases.
          cd workflows/projects/ms-swift
          # python -m unittest tests.test_quick_start_ascend -v 2>&1

      # ===== Record outcome =====
      # Single gate: 'schedule && need_to_test == "true"', matching
      # the Persist step downstream. decide only emits need_to_test
      # when a monitor fired (release/doc change) or a previous-cycle
      # failure flag forces a retry, so a missing output means "no
      # monitor fired this cycle" -> nothing new to record. dispatch
      # is excluded: it's a one-shot read-only path and must not
      # touch the cache or its failure-flag state. The failure path
      # (test failed) still runs through this gate because
      # need_to_test is set before test.conclusion is known, so the
      # failure flag this step writes into .monitor-state/ is what
      # makes the next schedule cycle know to retry.
      - name: Record monitor outcome
        id: record-monitor-outcome
        # DEBUG: gate disabled to simulate schedule-only path. Re-enable before merging.
        # if: |
        #   github.event_name == 'schedule' &&
        #   steps.decide.outputs.need_to_test == 'true'
        if: steps.decide.outputs.need_to_test == 'true'
        env:
          # REASON / REF / TEST_REF come from /tmp/.decision (written
          # by decide), not from any step's $GITHUB_OUTPUT - that's the
          # point of the split: monitor outputs only surface here.
          CONCLUSION: ${{ steps.test.conclusion }}
        run: |
          set -euo pipefail
          DECISION_FILE="/tmp/.decision"
          LOCAL_MONITOR="/tmp/.monitor"

          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          MONITOR_FILE="$STATE_DIR/.monitor"

          # Default all expected keys before sourcing so a missing /
          # partial decision file leaves every variable defined;
          # otherwise set -u trips on the later reads.
          changed="false"
          reason=""
          ref=""

          if [ -f $DECISION_FILE ]; then
            . $DECISION_FILE
          fi
          CHANGED="$changed"
          REASON="$reason"
          REF="$ref"

          # ----- Map test conclusion to outcome -----
          case "$CONCLUSION" in
            success)
              RESULT="success"
              ERROR="none"
              ;;
            failure)
              RESULT="failure"
              ERROR="test failed"
              ;;
            skipped)
              RESULT="failure"
              ERROR="prior step failed before test could run"
              ;;
            cancelled)
              RESULT="failure"
              ERROR="job cancelled"
              ;;
            *)
              RESULT="failure"
              ERROR="unknown conclusion (${CONCLUSION})"
              ;;
          esac

          # Source the merged monitor file (cache + /tmp/.monitor), then
          # update test_result / test_error for any cycle that fired
          # (REASON non-empty - 'release' / 'doc' / 'retry'). A retry
          # doesn't need to know which side previously failed because
          # the next cycle re-tests the same upstream commit either
          # way; the new RESULT/ERROR overwrites the failure flag.
          # If REASON is empty we leave test_result / test_error
          # unchanged so a still-pending failure keeps triggering a
          # retry next cycle.

          last_release_id=""
          doc_hash=""
          test_result=""
          test_error=""
          if [ -f "$MONITOR_FILE" ]; then
            . "$MONITOR_FILE"
          fi
          if [ -f $LOCAL_MONITOR ]; then
            . $LOCAL_MONITOR
          fi

          echo "outcome for ${REASON}: result=${RESULT} error=${ERROR}"
          test_result="$RESULT"
          test_error="$ERROR"

          # ----- Write the merged cache file -----
          {
            echo "last_release_id='$last_release_id'"
            echo "doc_hash='$doc_hash'"
            echo "test_result='$test_result'"
            echo "test_error='$test_error'"
          } > "$MONITOR_FILE"

          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          {
            echo "monitor_last_release_id=$last_release_id"
            echo "monitor_doc_hash=$doc_hash"
            echo "monitor_test_result=$test_result"
            echo "monitor_test_error=$test_error"
          } >> "$GITHUB_OUTPUT"
          echo "shipped monitor state: release(id=$last_release_id) doc(hash=$doc_hash) test(result=$test_result error=$test_error)"

      # Write result.json + summarize. Gate matches record-monitor-outcome:
      # dispatch always writes (manual run produces a result); schedule
      # writes only when need_to_test=true, so a no-signal schedule
      # cycle never emits target_ref="" (which the schema's
      # minLength: 1 rejects). The summary reads back the merged
      # monitor cache file record-monitor-outcome just wrote so the
      # 'Last failure' line surfaces for THIS run, not the cycle before.
      - name: Write result and summarize
        id: write-result
        if: steps.decide.outputs.need_to_test == 'true'
        env:
          # Route upstream step outputs through env so jq / printf
          # parameter-expand them; values containing shell-meta chars
          # never get re-parsed by bash.
          TRIGGER:         ${{ github.event_name }}
          REASON:          ${{ steps.record-monitor-outcome.outputs.reason }}
          TARGET_REPO:     'modelscope/ms-swift'
          TARGET_REF:      ${{ steps.decide.outputs.test_ref }}
          IMAGE:           ${{ env.CI_IMAGE }}
          JOB_STATUS:      ${{ job.status }}
          UPSTREAM_SHA:    ${{ steps.decide.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p output

          # 7 fields: 6 required by schemas/result.schema.json + 'reason'.
          # Tests-ran is implied by reason non-empty; upstream ref/commit
          # are derivable from reason + the API; Actions run object
          # carries created_at.
          jq -n \
            --arg trigger          "$TRIGGER" \
            --arg reason           "$REASON" \
            --arg target_repo      "$TARGET_REPO" \
            --arg target_ref       "$TARGET_REF" \
            --arg path             "projects/ms-swift/docs/Quick-start-Ascend.md" \
            --arg image            "$IMAGE" \
            --arg job_status       "$JOB_STATUS" \
            '{
              trigger:     $trigger,
              reason:      $reason,
              target_repo: $target_repo,
              target_ref:  $target_ref,
              path:        $path,
              image:       $image,
              job_status:  $job_status
            }' > output/result.json
          echo "wrote $(wc -c < output/result.json) bytes:"
          cat output/result.json
          # Ship result.json across jobs via job-level outputs (channel 2).
          # The NPU runner can't reach GitHub's artifact blob storage,
          # so upload-artifact lives in publish-and-persist on ubuntu-latest.
          printf 'result_json=%s\n' "$(jq -c . output/result.json)" \
            >> "$GITHUB_OUTPUT"
          {
            printf 'trigger=%s\n'    "$TRIGGER"
            printf 'job_status=%s\n' "$JOB_STATUS"
          } >> "$GITHUB_OUTPUT"

          # ----- Summarize -----
          echo "============================================================"
          echo "QUICK START TEST SUMMARY"
          echo "  Upstream repo:    ${{ env.UPSTREAM_REPO }}"
          echo "  Upstream ref:     $TARGET_REF"
          echo "  Upstream commit:  $UPSTREAM_SHA"
          echo "  Trigger reason:   $REASON"
          echo "------------------------------------------------------------"
          # Default _r/_e empty so set -u stays safe when the monitor
          # file is missing or half-written. test_result / test_error
          # cover both release and doc (single shared flag), so we
          # read them directly - no REASON-based dispatch needed.
          STATE_DIR=".monitor-state"
          MONITOR_FILE="$STATE_DIR/.monitor"
          _r=""
          _e=""
          if [ -f "$MONITOR_FILE" ]; then
            . "$MONITOR_FILE"
            _r="$test_result"; _e="$test_error"
            echo "reading cache: $MONITOR_FILE => result=${_r} error=${_e}"
            if [ "$_r" = "failure" ] && [ "$_e" != "none" ]; then
              echo "  Last failure:     $_e"
            fi
          fi
          echo "============================================================"

  # The NPU runner can't reach GitHub's blob / cache storage, so
  # result.json + .monitor-state/ ship as job outputs and this job
  # does the actual upload + cache save + schema validation here.
  publish-and-persist:
    name: publish result.json + persist monitor state
    needs: monitor-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      # schemas/result.schema.json lives in this repo, and this job
      # runs on a fresh ubuntu-latest runner - no workflows checkout
      # of its own.
      - name: Checkout workflows (provides schemas/result.schema.json)
        uses: actions/checkout@v6
        with:
          path: workflows
          fetch-depth: 1

      - name: Materialize result.json
        env:
          RESULT_JSON: ${{ needs.monitor-and-test.outputs.result_json }}
        run: |
          set -euo pipefail
          mkdir -p output
          # Empty result_json means upstream skipped - exit cleanly so
          # the workflow conclusion is driven by monitor-and-test alone.
          if [ -z "$RESULT_JSON" ]; then
            echo "no result_json from monitor-and-test; nothing to publish"
            exit 0
          fi
          printf '%s\n' "$RESULT_JSON" > output/result.json
          echo "materialized $(wc -c < output/result.json) bytes:"
          cat output/result.json

      - name: Validate result.json against schema
        if: always()
        run: |
          if [ ! -s output/result.json ]; then
            echo "result.json is empty; skipping schema validation"
            exit 0
          fi
          python3 -m pip install -q check-jsonschema
          check-jsonschema \
            --schemafile workflows/schemas/result.schema.json output/result.json

      - name: Upload result.json
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ms-swift-quick-start-${{ github.run_id }}
          path: output/result.json
          if-no-files-found: warn

      # Persist monitor state. The 6 cache fields arrive as one job output
      # each (set by record-monitor-outcome); reconstruct the merged files
      # here on ubuntu-latest, which CAN reach cache blob storage (the
      # NPU runner could not - hence this split).
      #
      # 'schedule' gate: dispatch is a one-shot read-only path and
      # must not touch the cache. The previous-cycle state in
      # .monitor-state/ belongs to schedule, and dispatch overriding
      # it with a manual ref's outcome would clobber the failure
      # flag the retry chain depends on. Schedule + need_to_test is
      # the only path that Persists: when the schedule cycle ran
      # the test, its outcome (success or failure) becomes the new
      # cache state.
      #
      # Run-id suffix on the cache key: actions/cache refuses to
      # overwrite an existing entry with the same key, so a static
      # key would make every save after the first a silent no-op.
      - name: Restore monitor state to disk
        # DEBUG: schedule half of gate disabled to simulate schedule-only
        # path. Re-enable both before merging - dispatch touching the
        # cache would clobber the schedule retry chain.
        # if: github.event_name == 'schedule' && needs.monitor-and-test.outputs.need_to_test == 'true'
        if: needs.monitor-and-test.outputs.need_to_test == 'true'
        env:
          monitor_last_release_id: ${{ needs.monitor-and-test.outputs.monitor_last_release_id }}
          monitor_doc_hash:        ${{ needs.monitor-and-test.outputs.monitor_doc_hash }}
          monitor_test_result:     ${{ needs.monitor-and-test.outputs.monitor_test_result }}
          monitor_test_error:      ${{ needs.monitor-and-test.outputs.monitor_test_error }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          MONITOR_FILE="$STATE_DIR/.monitor"
          {
            echo "last_release_id='$monitor_last_release_id'"
            echo "doc_hash='$monitor_doc_hash'"
            echo "test_result='$monitor_test_result'"
            echo "test_error='$monitor_test_error'"
          } > "$MONITOR_FILE"
          echo "  wrote $MONITOR_FILE (from monitor-and-test outputs):"
          cat "$MONITOR_FILE"

      - name: Persist monitor state to cache
        # DEBUG: schedule half of gate disabled to simulate schedule-only
        # path. Re-enable both before merging - dispatch persisting would
        # overwrite cache entries the schedule retry chain depends on.
        # if: github.event_name == 'schedule' && needs.monitor-and-test.outputs.need_to_test == 'true'
        if: needs.monitor-and-test.outputs.need_to_test == 'true'
        # run-id suffix because actions/cache/save refuses to overwrite
        # an existing entry with the same key (it errors with
        # 'Cache already exists'). The next Restore's find-key step
        # queries the Cache API for the most recent entry under this
        # prefix and uses its returned key as exact-match.
        uses: actions/cache/save@v6
        with:
          path: .monitor-state
          key: monitor-state-ms-swift-${{ github.run_id }}
          # enableCrossOsArchive: true keeps process.platform out of
          # the cache version hash. Save runs on ubuntu-latest (x86_64)
          # while Restore runs on linux-aarch64-a2-1 (self-hosted NPU
          # runner); without this the platform salt would still match
          # (both 'linux'), but stripping it makes the version robust
          # to future runner-image changes. compressionMethod still
          # participates - both runners need zstd (or neither) for the
          # restore version hash to align.
          enableCrossOsArchive: true
