name: ms-swift-quick-start

# Quick Start doc test (Ascend / NPU):
#   1. Every 6 hours: lightweight monitor - hash the doc on the
#      TARGET repo and the latest upstream release id. State persists
#      in actions/cache for 30 days.
#   2. If either signal changed (release > doc priority), install
#      ms-swift at that commit and run the e2e doc test on the NPU
#      runner.
#   3. If nothing changed, exit after the monitor (no NPU work).
#
# This workflow is the NPU counterpart to ms-swift-examples.yml on this
# repo: ms-swift-examples.yml runs curated example scripts; this one
# verifies the "Quick Start" doc on the Ascend track. The doc URL is
# read from MONITORED_DOC_URL.
#
# NB: monitoring upstream ms-swift is an intentional exception to the
# repo's "no interaction with modelscope/ms-swift" rule - this workflow's
# whole purpose is to detect upstream changes.

concurrency:
  group: ms-swift-quick-start
  # Don't cancel an in-progress run when a new one arrives. cancel:
  # true would silently kill a long manual dispatch (up to 3 hours)
  # the moment a scheduled cron run fired, and a killed run's
  # 'if: always()' guards still leave the Persist step without
  # a chance to run - we'd lose the cycle's outcome writeback.
  # Letting runs queue (up to whatever the runner pool can hold)
  # is the right call for a doc-test gate; matches examples.yml.
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 */6 * * *'
  # Manual run ALWAYS runs the test (no monitor gate). Override
  # `upstream_ref` to test a specific tag or branch; defaults to
  # `main`. The two trigger paths converge in the `decide` step.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'manual run: ref to test (tag, branch, or main)'
        required: false
        default: 'main'

permissions:
  contents: read

env:
  CI_IMAGE: &ci_image swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
  UPSTREAM_REPO: modelscope/ms-swift
  MONITORED_DOC_URL: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/ms-swift/docs/Quick-start-Ascend.md
  GH_API: https://api.github.com

jobs:
  monitor-and-test:
    name: monitor + test on change
    runs-on: [linux-aarch64-a2-1]
    timeout-minutes: 180
    # Cross-job channel: ship result.json + a few scalars up to the
    # publish-results job via needs.<job>.outputs. The NPU runner's
    # artifact blob storage channel is unreachable (see write-result
    # step), so we use job outputs instead of upload-artifact.
    outputs:
      result_json: ${{ steps.write-result.outputs.result_json }}
      trigger:     ${{ steps.write-result.outputs.trigger }}
      reason:      ${{ steps.write-result.outputs.reason }}
      job_status:  ${{ steps.write-result.outputs.job_status }}
    defaults:
      run:
        shell: bash
    container:
      image: *ci_image
      options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/modelscope:/root/.cache/modelscope
    env:
      # Match upstream citest_npu.yaml: cluster-internal nginx PyPI cache
      # fronts every package (including setuptools/wheel/torch/torch_npu),
      # so PEP 517 build deps and NPU wheels all resolve without falling
      # back to external mirrors.
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: "unsafe-best-match"
      UV_INSECURE_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      UV_HTTP_TIMEOUT: "120"
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_TIMEOUT: "120"
    steps:
      # ===== Setup =====
      # Always runs. Loads CANN, checks NPU, brings this repo's test
      # code + doc into ./workflows so the test step can use them.
      - name: Print context
        run: |
          echo "=========================================="
          echo "Trigger:    ${{ github.event_name }}"
          echo "Runner:     ${{ runner.name }}"
          echo "=========================================="

      - name: Source CANN and check NPU
        run: |
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info || true

      - name: Checkout workflows (provides the test code and doc)
        uses: actions/checkout@v5
        with:
          path: workflows
          fetch-depth: 1

      # ===== Monitor =====
      # Schedule-only. Two monitors (release id, doc hash) compare
      # the current signal against the cached last seen value and
      # emit changed/ref/reason. monitor-release runs first; if it
      # fires, monitor-doc skips itself so doc state stays untouched
      # until the next schedule run picks it up. A failure outcome
      # forces a retry on the next cycle even if the signal hasn't
      # changed; success clears that flag.
      #
      # State lives in .monitor-state/ (actions/cache, 30-day
      # retention, run-id suffix on the key so a real outcome
      # change persists across persists).
      - name: Restore monitor state
        id: cache-restore
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          # Run-id suffix because actions/cache refuses to overwrite an
          # existing entry with the same key - a static key would
          # make every Persist after the first a silent no-op, so
          # a real outcome change (failure -> success on retry)
          # would never propagate. The exact-match key always misses
          # on this run (we never saved under it yet), so restore
          # falls through to restore-keys, which returns the most
          # recent 'monitor-state-ms-swift-*' entry.
          key: monitor-state-ms-swift-${{ github.run_id }}
          restore-keys: |
            monitor-state-ms-swift-

      - name: Monitor upstream latest release id
        id: monitor-release
        # Runs first so monitor-doc (below) can read its `changed`
        # output to decide whether to skip itself this cycle.
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/releases/latest" -o /tmp/release.json
          ID=$(jq -r '.id // empty' /tmp/release.json)
          TAG=$(jq -r '.tag_name // empty' /tmp/release.json)
          # Explicit file-existence check rather than 'cat || echo ""':
          # on cache miss (first deploy, or 30-day retention expiry)
          # actions/cache/restore@v4 does NOT create the .monitor-state/
          # directory, and 'cat' on a missing file under set -euo
          # pipefail would silently exit before the echo runs in some
          # bash versions. The [ -f ] form is unambiguous about the
          # fall-through-to-empty-string contract.
          if [ -f "$STATE_DIR/.last_release_id" ]; then
            OLD_ID=$(cat "$STATE_DIR/.last_release_id")
          else
            OLD_ID=""
          fi
          # The outcome file is a two-line key=value blob (result / error);
          # source it so we can use $result for the retry decision.
          # Default $result / $error to '' before the source so a
          # half-written file (e.g. container killed mid-write) leaves
          # both variables defined - without this, set -u trips on any
          # later read of $error after the source assigns only $result.
          result=""
          error=""
          if [ -f "$STATE_DIR/.release_outcome" ]; then
            . "$STATE_DIR/.release_outcome"
          fi
          if [ -n "$ID" ] && [ "$OLD_ID" != "$ID" ]; then
            echo "$ID" > "$STATE_DIR/.last_release_id"
            {
              echo "result=success"
              echo "error=none"
            } > "$STATE_DIR/.release_outcome"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "reason=release" >> "$GITHUB_OUTPUT"
          elif [ "$result" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "reason=release-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_id=$ID tag=$TAG result=$result"

      - name: Monitor doc hash
        id: monitor-doc
        # Skip when release also fired this cycle - release takes
        # priority, doc state must stay untouched so the next schedule
        # run picks it up cleanly.
        if: github.event_name == 'schedule' && steps.monitor-release.outputs.changed != 'true'
        env:
          DOC_URL: ${{ env.MONITORED_DOC_URL }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          echo "Monitoring: $DOC_URL"
          NEW=$(curl -fsSL --retry 3 "$DOC_URL" | sha256sum | cut -d' ' -f1)
          if [ -f "$STATE_DIR/.doc_hash" ]; then
            OLD=$(cat "$STATE_DIR/.doc_hash")
          else
            OLD=""
          fi
          # The outcome file is a two-line key=value blob (result / error);
          # source it so we can use $result for the retry decision.
          # Default $result / $error to '' before the source so a
          # half-written file (e.g. container killed mid-write) leaves
          # both variables defined - without this, set -u trips on any
          # later read of $error after the source assigns only $result.
          result=""
          error=""
          if [ -f "$STATE_DIR/.doc_outcome" ]; then
            . "$STATE_DIR/.doc_outcome"
          fi
          if [ "$OLD" != "$NEW" ]; then
            echo "$NEW" > "$STATE_DIR/.doc_hash"
            {
              echo "result=success"
              echo "error=none"
            } > "$STATE_DIR/.doc_outcome"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=doc" >> "$GITHUB_OUTPUT"
          elif [ "$result" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=doc-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "doc_hash=$NEW result=$result"

      # ===== Test =====
      # Runs only when decide.outputs.changed == true. The decide step
      # is the single funnel: schedule picks release > doc by priority,
      # manual always uses inputs.upstream_ref. The test step itself
      # installs ms-swift at the resolved commit and walks every shell
      # block in the doc. Record outcome persists success/failure back
      # into .monitor-state for the next cycle.
      - name: Decide which ref to test
        id: decide
        env:
          # Plumb inputs.* and step outputs through env so bash sees them
          # as parameter expansions, not as inline literal text - a
          # crafted ref like 'main $(curl evil)' would otherwise be
          # command-substituted by bash when used inside double quotes.
          INPUT_REF:        ${{ inputs.upstream_ref }}
          RELEASE_CHANGED:  ${{ steps.monitor-release.outputs.changed }}
          RELEASE_REASON:   ${{ steps.monitor-release.outputs.reason }}
          RELEASE_REF:      ${{ steps.monitor-release.outputs.ref }}
          DOC_CHANGED:      ${{ steps.monitor-doc.outputs.changed }}
          DOC_REASON:       ${{ steps.monitor-doc.outputs.reason }}
          DOC_REF:          ${{ steps.monitor-doc.outputs.ref }}
          # github.event_name is GitHub-internal (schedule /
          # workflow_dispatch), not user-controlled, but env the
          # value here for consistency with the other branches of
          # this step - all step inputs and outputs now arrive via
          # env so bash sees them as parameter expansions, never
          # as inline literal text.
          EVENT_NAME:       ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual path.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
            # Quoted env-var expansion - $INPUT_REF is treated as a
            # single value, not re-parsed by bash.
            echo "test_ref=${INPUT_REF:-main}" >> "$GITHUB_OUTPUT"
          else
            # Monitor path. Priority: release > doc. When both signals
            # changed this cycle, only the release test runs (and the
            # monitor-doc step skipped itself, leaving doc state
            # untouched for the next schedule run to pick up).
            CHANGED="false"
            REASON=""
            REF=""
            if [ "$RELEASE_CHANGED" = "true" ]; then
              CHANGED="true"
              REASON="$RELEASE_REASON"
              REF="$RELEASE_REF"
            elif [ "$DOC_CHANGED" = "true" ]; then
              CHANGED="true"
              REASON="$DOC_REASON"
              REF="$DOC_REF"
            fi
            echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "test_ref=$REF" >> "$GITHUB_OUTPUT"
            if [ "$CHANGED" != "true" ]; then
              echo "No upstream changes - skipping install + test"
            fi
          fi

      - name: Resolve upstream commit SHA
        id: upstream-commit
        if: steps.decide.outputs.changed == 'true'
        env:
          # test_ref comes from inputs.upstream_ref via decide step;
          # plumb through env so a malicious ref like
          # 'main $(curl evil)' is parameter-expanded, not command-
          # substituted by bash when interpolated into the curl URL.
          TEST_REF: ${{ steps.decide.outputs.test_ref }}
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/$TEST_REF" \
            | jq -r '.sha // empty')
          [ -z "$SHA" ] && { echo "failed to resolve $TEST_REF"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $SHA"

      - name: Run quick start test
        id: test
        if: steps.decide.outputs.changed == 'true'
        env:
          # Only the three env vars test_quick_start_ascend.py reads
          # via os.environ. UPSTREAM_REPO, REASON, MONITORED_DOC_URL
          # were previously declared here too but the test never
          # touched them - UPSTREAM_REPO and MONITORED_DOC_URL
          # propagate from jobs.env; REASON is purely diagnostic.
          SWIFT_NPU_E2E:   '1'
          UPSTREAM_REF:    ${{ steps.decide.outputs.test_ref }}
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
        run: |
          set -euo pipefail
          # CANN env only lives in the shell that sourced it; re-source
          # here so swift sft / swift infer see ASCEND_HOME etc.
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          # ----- NPU runtime setup (matches upstream ci_container_test.sh) -----
          # 1. Block CUDA wheels so a transitive dep can't silently pull
          #    nvidia-* into an NPU run. The cuda-* / nvidia-* <0 backstop
          #    stops ms-swift's own requirements/npu.txt or a transitive
          #    dep from dragging in a CUDA runtime the runner can't reach.
          #    torch / torch_npu are NOT constrained here: torch_stack_probe
          #    below decides whether to reuse the image's pre-installed torch
          #    or install torch==2.9.0 from the cluster cache. Pinning torch
          #    to a specific version in this file would force pip to redo
          #    the wheel lookup the same way 064a5d7 / 7136ed1 tried and
          #    failed when aliyun's pytorch-wheels/cpu/ mirror was reachable
          #    but the cluster cache was not authoritative.
          cat >/tmp/ms_swift_npu_constraints.txt <<'EOF'
          modelscope==1.37.0
          cuda-toolkit<0
          cuda-python<0
          cuda-bindings<0
          cuda-core<0
          cuda-pathfinder<0
          flashinfer-python<0
          nvidia-cublas<0
          nvidia-cuda-runtime<0
          nvidia-cuda-nvrtc<0
          nvidia-cuda-cupti<0
          nvidia-cudnn<0
          nvidia-cudnn-frontend<0
          nvidia-cufft<0
          nvidia-curand<0
          nvidia-cusolver<0
          nvidia-cusparse<0
          nvidia-cutlass-dsl<0
          nvidia-cutlass-dsl-libs-base<0
          nvidia-cutlass-dsl-libs-core<0
          nvidia-cutlass-dsl-libs-cu12<0
          nvidia-ml-py<0
          nvidia-nccl<0
          nvidia-nvjitlink<0
          nvidia-nvtx<0
          nvidia-cublas-cu12<0
          nvidia-cuda-nvdisasm<0
          nvidia-cuda-runtime-cu12<0
          nvidia-cuda-nvrtc-cu12<0
          nvidia-cuda-cupti-cu12<0
          nvidia-cudnn-cu12<0
          nvidia-cufft-cu12<0
          nvidia-curand-cu12<0
          nvidia-cusolver-cu12<0
          nvidia-cusparse-cu12<0
          nvidia-cusparselt-cu12<0
          nvidia-nccl-cu12<0
          nvidia-nvjitlink-cu12<0
          nvidia-nvtx-cu12<0
          EOF
          export PIP_CONSTRAINT=/tmp/ms_swift_npu_constraints.txt
          export UV_CONSTRAINT=/tmp/ms_swift_npu_constraints.txt
          # 2. uv handles PEP 517 build deps more reliably than pip and
          #    the test's setUpClass invokes `uv pip install ...`. The
          #    internal nginx cache fronts PyPI so this resolves cleanly.
          python -m pip install uv
          # 3. ensure_torch_stack: the pinned CANN 9.1.0 / py3.12 image
          #    used here (swr.cn-south-1.myhuaweicloud.com/ascendhub/
          #    cann:9.1.0-910b-ubuntu22.04-py3.12) ships torch 2.9.0
          #    with torch_npu 2.9.0.post2 pre-installed, so we probe
          #    first and skip the install when the image's torch stack
          #    already matches. The fall-through install path is hit
          #    only if the image is rebuilt without a torch stack or
          #    someone bumps the CI image to a different torch line -
          #    in either case we install torch==2.9.0 +
          #    torch_npu==2.9.0.post2 from the cluster cache and fall
          #    back to the ascend huaweicloud mirror. We don't pin
          #    torch here by default (only when the image lacks it)
          #    because hard-pinning torch==2.9.0+cpu on a workflow
          #    that doesn't need to reinstall torch tends to trigger
          #    PyPI simple-page lookups under the +cpu local version
          #    label, which the cluster cache does not serve.
          #
          #    Note: torch.__version__ surfaces as '2.9.0+cpu' via
          #    the PEP 440 local version label regardless of the
          #    underlying device - the '+cpu' here names the libtorch
          #    build variant, not the runtime compute device. Actual
          #    NPU compute goes through torch_npu (CANN backend);
          #    ms-swift moves the model with .to('npu:0').
          if python -c "
          import torch, torch_npu
          raise SystemExit(0 if torch.__version__.startswith('2.9.0') \
              and torch_npu.__version__.startswith('2.9.0') else 1)
          " 2>/dev/null; then
            echo "reusing image torch stack (torch $(python -c 'import torch; print(torch.__version__)'), torch_npu $(python -c 'import torch_npu; print(torch_npu.__version__)'))"
          else
            echo "installing torch==2.9.0 torch_npu==2.9.0.post2"
            python -m pip install \
                --index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
                --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi \
                --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
                torch==2.9.0 torch_npu==2.9.0.post2
          fi
          # 4. Pin transformers / peft (matches the doc's <5.0 / <0.19 caps).
          python -m pip install "transformers<5.0" "peft<0.19"
          # 5. vLLM-Ascend setup removed - vllm-ascend 0.18.0 (and the
          #    matching 0.22.1rc1 line) both have unresolved dependency
          #    conflicts in this runner's reachable mirror set (the
          #    0.18 wheel Requires-Dist pins triton-ascend==3.2.0, but
          #    the huaweicloud ascend mirror only publishes 3.2.1 /
          #    3.2.2). Quick-start therefore tests the transformers /
          #    torch_npu infer backend only; vLLM-Ascend setup is
          #    covered by NPU-support.md.
          # The doc owns the source install step (its '## install ms-swift'
          # block runs git clone + uv pip install -e . for the exact
          # <UPSTREAM_REF>). After that, run the doc itself as a unittest
          # - every shell block becomes one or more test cases.
          cd workflows/projects/ms-swift
          python -m unittest tests.test_quick_start_ascend -v 2>&1

      - name: Record outcome
        id: record-outcome
        if: |
          always() &&
          github.event_name == 'schedule' &&
          steps.decide.outputs.changed == 'true'
        env:
          # Both values are GitHub-controlled (decide step writes
          # reason itself; test.conclusion is the GitHub job
          # conclusion). Neither is user-controlled, so there's
          # no injection risk - but env keeps the whole workflow
          # consistent: every step input/output arrives as a
          # quoted parameter expansion, never as inline literal
          # text.
          REASON:     ${{ steps.decide.outputs.reason }}
          CONCLUSION: ${{ steps.test.conclusion }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          # Strip the "-retry" suffix to map back to the base monitor.
          BASE="${REASON%-retry}"
          # Map the test step's conclusion to an outcome, written as a
          # two-line key=value file:
          #
          #   result=<success|failure>
          #   error=<message|none>
          #
          # Consumers `source` the file to get $result / $error as shell
          # variables, then check `$result` for retry decisions and
          # surface `$error` for the "Last failure:" log line.
          case "$CONCLUSION" in
            success)
              RESULT="success"
              ERROR="none"
              ;;
            failure)
              RESULT="failure"
              ERROR="test failed"
              ;;
            skipped)
              RESULT="failure"
              ERROR="prior step failed before test could run"
              ;;
            cancelled)
              RESULT="failure"
              ERROR="job cancelled"
              ;;
            *)
              RESULT="failure"
              ERROR="unknown conclusion (${CONCLUSION})"
              ;;
          esac
          {
            echo "result=${RESULT}"
            echo "error=${ERROR}"
          } > "${STATE_DIR}/.${BASE}_outcome"
          echo "outcome for ${BASE}: result=${RESULT} error=${ERROR}"

      - name: Persist monitor state
        # Runs after record-outcome so the cache entry contains the
        # truthful outcome of THIS cycle's test. 'always()' guarantees
        # we still upload even when the test step itself failed (so a
        # failure flag persists for retry on the next schedule run).
        # 'schedule' gating keeps manual dispatch from touching the
        # cache. The whole directory is uploaded in one shot - the
        # files record-outcome didn't touch are byte-identical to
        # what cache had, so the upload is a no-op for them.
        #
        # Run-id suffix is required: actions/cache refuses to overwrite
        # an existing entry with the same key, so a static key would
        # make every Persist after the first a silent no-op (see
        # Restore monitor state for the matching suffix + restore-keys).
        if: github.event_name == 'schedule' && always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: monitor-state-ms-swift-${{ github.run_id }}
          retention-days: 30

      # Write result.json. The NPU runner can't reach GitHub's artifact
      # blob storage (upload-artifact stalls indefinitely), so we
      # serialize the file into a job output and let publish-results
      # (ubuntu-latest) do the actual upload.
      - name: Write result.json
        id: write-result
        if: always()
        env:
          TRIGGER:         ${{ github.event_name }}
          REASON:          ${{ steps.decide.outputs.reason }}
          TARGET_REPO:     ${{ vars.TARGET_REPO || 'cosdt-ci-test/ms-swift' }}
          TARGET_REF:      ${{ vars.TARGET_REF || 'main' }}
          IMAGE:           ${{ env.CI_IMAGE }}
          JOB_STATUS:      ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p output
          # 7 fields: 6 required by schemas/result.schema.json + 'reason'
          # (which monitor signal fired; derivable from decide.outputs.reason).
          # Tests-ran is implied by reason non-empty (changed=true); the
          # exact upstream ref/commit are derivable via the GitHub API
          # from reason + path; created_at is on the Actions run object.
          jq -n \
            --arg trigger          "$TRIGGER" \
            --arg reason           "$REASON" \
            --arg target_repo      "$TARGET_REPO" \
            --arg target_ref       "$TARGET_REF" \
            --arg path             "projects/ms-swift/docs/Quick-start-Ascend.md" \
            --arg image            "$IMAGE" \
            --arg job_status       "$JOB_STATUS" \
            '{
              trigger:     $trigger,
              reason:      $reason,
              target_repo: $target_repo,
              target_ref:  $target_ref,
              path:        $path,
              image:       $image,
              job_status:  $job_status
            }' > output/result.json
          echo "wrote $(wc -c < output/result.json) bytes:"
          cat output/result.json
          # Ship result.json across jobs via job-level outputs (channel 2).
          # We do NOT call upload-artifact on this runner - its artifact
          # blob storage channel is unreachable. The result_json output is
          # read in the publish-results job below and uploaded there.
          # jq -c . gives a one-line, expression-safe JSON string.
          printf 'result_json=%s\n' "$(jq -c . output/result.json)" \
            >> "$GITHUB_OUTPUT"
          {
            printf 'trigger=%s\n'    "$TRIGGER"
            printf 'reason=%s\n'     "$REASON"
            printf 'job_status=%s\n' "$JOB_STATUS"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize test result
        if: always()
        env:
          # Plumb step outputs through env so echo expansion never
          # command-substitutes a crafted value.
          TEST_REF:      ${{ steps.decide.outputs.test_ref }}
          UPSTREAM_SHA:  ${{ steps.upstream-commit.outputs.sha }}
          TRIGGER_RSN:   ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "QUICK START TEST SUMMARY"
          echo "  Upstream repo:    ${{ env.UPSTREAM_REPO }}"
          echo "  Upstream ref:     $TEST_REF"
          echo "  Upstream commit:  $UPSTREAM_SHA"
          echo "  Trigger reason:   $TRIGGER_RSN"
          echo "------------------------------------------------------------"
          # Surface the failure reason for this run's test, which the
          # record-outcome step (run earlier in this job) just wrote
          # to the same outcome file. Reading here means the printed
          # 'Last failure:' line is for the run the reader is
          # looking at, not the cycle before it - so a retry reader
          # sees why *this* run's test failed without having to
          # cross-reference the previous workflow run.
          #
          # The outcome file is a two-line key=value blob
          # (result / error). Default both before source for
          # set -u safety: a half-written file from a
          # container-killed record-outcome might leave $error
          # unset, and this step reads both $result and $error.
          OUTCOME_FILE=".monitor-state/.${TRIGGER_RSN%-retry}_outcome"
          result=""
          error=""
          if [ -f "$OUTCOME_FILE" ]; then
            . "$OUTCOME_FILE"
            if [ "$result" = "failure" ] && [ "$error" != "none" ]; then
              echo "  Last failure:     $error"
            fi
          fi
          echo "============================================================"

  # Result.json is produced on the NPU runner (where upload-artifact is
  # unreachable) and shipped via monitor-and-test.outputs.result_json.
  # This job runs on ubuntu-latest and does the actual upload + schema
  # validation, which are the only steps that need network egress to
  # GitHub's artifact blob storage.
  publish-results:
    name: publish result.json
    needs: monitor-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Validate result.json against the schema in this repo, so
      # the publish-results job needs the schemas/ tree to be on
      # disk. The job runs on ubuntu-latest (not the NPU runner
      # where the doc test ran) and ships result.json via job
      # outputs, so it doesn't get the workflows checkout that
      # comes with monitor-and-test's checkout step.
      - name: Checkout workflows (provides schemas/result.schema.json)
        uses: actions/checkout@v5
        with:
          path: workflows
          fetch-depth: 1

      - name: Materialize result.json
        env:
          RESULT_JSON: ${{ needs.monitor-and-test.outputs.result_json }}
        run: |
          set -euo pipefail
          mkdir -p output
          # Defensive: if result_json came back empty (e.g. all upstream
          # monitor steps skipped, decide.outputs.changed was false, AND
          # write-result did not run for some reason) we still want the
          # publish job to exit cleanly so the workflow conclusion is
          # driven by monitor-and-test alone.
          if [ -z "$RESULT_JSON" ]; then
            echo "no result_json from monitor-and-test; nothing to publish"
            exit 0
          fi
          printf '%s\n' "$RESULT_JSON" > output/result.json
          echo "materialized $(wc -c < output/result.json) bytes:"
          cat output/result.json

      - name: Validate result.json against schema
        if: always()
        run: |
          if [ ! -s output/result.json ]; then
            echo "result.json is empty; skipping schema validation"
            exit 0
          fi
          python3 -m pip install -q check-jsonschema
          check-jsonschema \
            --schemafile workflows/schemas/result.schema.json output/result.json

      - name: Upload result.json
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ms-swift-quick-start-${{ github.run_id }}
          path: output/result.json
          if-no-files-found: warn
          retention-days: 90
