name: ms-swift-quick-start

# Quick Start doc test (Ascend / NPU):
#   1. Every 6 hours: lightweight monitor - hash the doc on the
#      TARGET repo, the latest upstream release, and the upstream
#      main HEAD SHA. State persists in actions/cache for 30 days.
#   2. If any of those signals changed, install ms-swift from the
#      new commit and run the e2e doc test on the NPU runner.
#   3. If nothing changed, exit after the monitor (no NPU work).
#
# This workflow is the NPU counterpart to ms-swift-examples.yml on this repo:
# ms-swift-examples.yml runs curated example scripts; this one verifies the
# "Quick Start" doc on the Ascend track. The doc URL is read from
# MONITORED_DOC_URL (defaults to the Quick-start-Ascend.md on the
# TARGET repo's default branch).
#
# NB: monitoring upstream ms-swift release/commit is an intentional
# exception to the repo's "no interaction with modelscope/ms-swift"
# rule - this workflow's whole purpose is to detect upstream changes.

concurrency:
  group: ms-swift-quick-start
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */6 * * *'
  # Manual run ALWAYS runs the test (no monitor gate). Override
  # `upstream_ref` to test a specific tag or branch; defaults to
  # `main`. The two trigger paths converge in the `decide` step.
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'manual run: ref to test (tag, branch, or main)'
        required: false
        default: 'main'

permissions:
  contents: read

env:
  CI_IMAGE: &ci_image swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
  UPSTREAM_REPO: modelscope/ms-swift
  MONITORED_DOC_URL: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/ms-swift/docs/Quick-start-Ascend.md
  GH_API: https://api.github.com

jobs:
  monitor-and-test:
    name: monitor + test on change
    runs-on: [linux-aarch64-a2-1]
    timeout-minutes: 180
    # Cross-job channel: ship result.json + a few scalars up to the
    # publish-results job via needs.<job>.outputs. The NPU runner's
    # artifact blob storage channel is unreachable (see write-result
    # step), so we use job outputs instead of upload-artifact.
    outputs:
      result_json: ${{ steps.write-result.outputs.result_json }}
      trigger:     ${{ steps.write-result.outputs.trigger }}
      reason:      ${{ steps.write-result.outputs.reason }}
      job_status:  ${{ steps.write-result.outputs.job_status }}
      tests_ran:   ${{ steps.write-result.outputs.tests_ran }}
    defaults:
      run:
        shell: bash
    container:
      image: *ci_image
      options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/modelscope:/root/.cache/modelscope
    env:
      # Match upstream citest_npu.yaml: cluster-internal nginx PyPI cache
      # fronts every package (including setuptools/wheel/torch/torch_npu),
      # so PEP 517 build deps and NPU wheels all resolve without falling
      # back to external mirrors.
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: "unsafe-best-match"
      UV_INSECURE_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      UV_HTTP_TIMEOUT: "120"
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      PIP_TIMEOUT: "120"
    steps:
      # ===== Setup =====
      # Always runs. Loads CANN, checks NPU, brings this repo's test
      # code + doc into ./workflows so the test step can use them.
      - name: Print context
        run: |
          echo "=========================================="
          echo "Trigger:    ${{ github.event_name }}"
          echo "Runner:     ${{ runner.name }}"
          echo "=========================================="

      - name: Source CANN and check NPU
        run: |
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info || true

      - name: Checkout workflows (provides the test code and doc)
        uses: actions/checkout@v4
        with:
          path: workflows
          fetch-depth: 1

      # ===== Monitor =====
      # Schedule-only. Three monitors (doc hash / release tag / main
      # HEAD) each compare the current signal against the cached last
      # seen value, and emit changed/ref/reason. A failure outcome
      # forces a retry on the next cycle even if the signal hasn't
      # changed; success clears that flag. State lives in
      # .monitor-state/ (actions/cache, 30-day retention).
      - name: Restore monitor state
        id: cache-restore
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          # Per-run key: always miss, so we fall through to restore-keys
          # (prefix match against the most recent successful save).
          key: monitor-state-ms-swift-${{ github.run_id }}
          restore-keys: |
            monitor-state-ms-swift-

      - name: Monitor doc hash
        id: monitor-doc
        if: github.event_name == 'schedule'
        env:
          DOC_URL: ${{ env.MONITORED_DOC_URL }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          echo "Monitoring: $DOC_URL"
          NEW=$(curl -fsSL --retry 3 "$DOC_URL" | sha256sum | cut -d' ' -f1)
          OLD=$(cat "$STATE_DIR/.doc_hash" 2>/dev/null || echo "")
          OUTCOME=$(cat "$STATE_DIR/.doc_outcome" 2>/dev/null || echo "")
          if [ "$OLD" != "$NEW" ]; then
            echo "$NEW" > "$STATE_DIR/.doc_hash"
            echo "success" > "$STATE_DIR/.doc_outcome"  # signal changed: clear retry flag
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=doc" >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=doc-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "doc_hash=$NEW outcome=$OUTCOME"

      - name: Monitor upstream latest release tag
        id: monitor-release
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/releases/latest" -o /tmp/release.json
          TAG=$(jq -r '.tag_name // empty' /tmp/release.json)
          OLD=$(cat "$STATE_DIR/.last_release_tag" 2>/dev/null || echo "")
          OUTCOME=$(cat "$STATE_DIR/.release_outcome" 2>/dev/null || echo "")
          if [ -n "$TAG" ] && [ "$OLD" != "$TAG" ]; then
            echo "$TAG" > "$STATE_DIR/.last_release_tag"
            echo "success" > "$STATE_DIR/.release_outcome"  # signal changed: clear retry flag
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "reason=release" >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "reason=release-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=$TAG outcome=$OUTCOME"

      - name: Monitor upstream main HEAD
        id: monitor-commit
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          SHA=$(curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/main" | jq -r '.sha // empty')
          OLD=$(cat "$STATE_DIR/.last_tested_sha" 2>/dev/null || echo "")
          OUTCOME=$(cat "$STATE_DIR/.commit_outcome" 2>/dev/null || echo "")
          if [ -n "$SHA" ] && [ "$OLD" != "$SHA" ]; then
            echo "$SHA" > "$STATE_DIR/.last_tested_sha"
            echo "success" > "$STATE_DIR/.commit_outcome"  # signal changed: clear retry flag
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=commit" >> "$GITHUB_OUTPUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=commit-retry" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "main_sha=$SHA outcome=$OUTCOME"

      - name: Persist monitor state
        if: github.event_name == 'schedule' && always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: monitor-state-ms-swift-${{ github.run_id }}
          retention-days: 30

      # ===== Test =====
      # Runs only when decide.outputs.changed == true. The decide step
      # is the single funnel: schedule picks doc/release/commit by
      # priority, manual always uses inputs.upstream_ref. The test step
      # itself installs ms-swift from the upstream git SHA and walks
      # every shell block in the doc. Record outcome persists the
      # success/failure back into .monitor-state for the next cycle.
      - name: Decide which ref to test
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual path.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual" >> "$GITHUB_OUTPUT"
            echo "test_ref=${{ inputs.upstream_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            # Monitor path. Priority: doc > release > commit. A retry
            # reason (e.g. "doc-retry") carries the same priority as
            # its base reason.
            CHANGED="false"
            REASON=""
            REF=""
            if [ "${{ steps.monitor-doc.outputs.changed }}" = "true" ]; then
              CHANGED="true"
              REASON="${{ steps.monitor-doc.outputs.reason }}"
              REF="${{ steps.monitor-doc.outputs.ref }}"
            elif [ "${{ steps.monitor-release.outputs.changed }}" = "true" ]; then
              CHANGED="true"
              REASON="${{ steps.monitor-release.outputs.reason }}"
              REF="${{ steps.monitor-release.outputs.ref }}"
            elif [ "${{ steps.monitor-commit.outputs.changed }}" = "true" ]; then
              CHANGED="true"
              REASON="${{ steps.monitor-commit.outputs.reason }}"
              REF="${{ steps.monitor-commit.outputs.ref }}"
            fi
            echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            echo "test_ref=$REF" >> "$GITHUB_OUTPUT"
            if [ "$CHANGED" != "true" ]; then
              echo "No upstream changes - skipping install + test"
            fi
          fi

      - name: Resolve upstream commit SHA
        id: upstream-commit
        if: steps.decide.outputs.changed == 'true'
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/${{ steps.decide.outputs.test_ref }}" \
            | jq -r '.sha // empty')
          [ -z "$SHA" ] && { echo "failed to resolve ${{ steps.decide.outputs.test_ref }}"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $SHA"

      - name: Run quick start test
        id: test
        if: steps.decide.outputs.changed == 'true'
        env:
          SWIFT_NPU_E2E: '1'
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_REF: ${{ steps.decide.outputs.test_ref }}
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
          REASON: ${{ steps.decide.outputs.reason }}
          MONITORED_DOC_URL: ${{ env.MONITORED_DOC_URL }}
        run: |
          # CANN env only lives in the shell that sourced it; re-source
          # here so swift sft / swift infer see ASCEND_HOME etc.
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          # ----- NPU runtime setup (matches upstream ci_container_test.sh) -----
          # 1. Pin torch / torch_npu / modelscope and block CUDA wheels so a
          #    transitive dep can't silently pull nvidia-* into an NPU run.
          #    Keep this in lockstep with projects/ms-swift/constraints-npu.txt
          #    on main (torch 2.9 / torch_npu 2.9.0.post6 / vllm 0.18 /
          #    vllm-ascend 0.18 - vllm 0.18 declares torch==2.10 + nvidia-*
          #    wheels, hence the cuda-* / nvidia-* <0 backstop).
          cat >/tmp/ms_swift_npu_constraints.txt <<'EOF'
          torch==2.9.0
          torch_npu==2.9.0.post6
          modelscope==1.37.0
          cuda-toolkit<0
          cuda-python<0
          cuda-bindings<0
          cuda-core<0
          cuda-pathfinder<0
          flashinfer-python<0
          nvidia-cublas<0
          nvidia-cuda-runtime<0
          nvidia-cuda-nvrtc<0
          nvidia-cuda-cupti<0
          nvidia-cudnn<0
          nvidia-cudnn-frontend<0
          nvidia-cufft<0
          nvidia-curand<0
          nvidia-cusolver<0
          nvidia-cusparse<0
          nvidia-cutlass-dsl<0
          nvidia-cutlass-dsl-libs-base<0
          nvidia-cutlass-dsl-libs-core<0
          nvidia-cutlass-dsl-libs-cu12<0
          nvidia-ml-py<0
          nvidia-nccl<0
          nvidia-nvjitlink<0
          nvidia-nvtx<0
          nvidia-cublas-cu12<0
          nvidia-cuda-nvdisasm<0
          nvidia-cuda-runtime-cu12<0
          nvidia-cuda-nvrtc-cu12<0
          nvidia-cuda-cupti-cu12<0
          nvidia-cudnn-cu12<0
          nvidia-cufft-cu12<0
          nvidia-curand-cu12<0
          nvidia-cusolver-cu12<0
          nvidia-cusparse-cu12<0
          nvidia-cusparselt-cu12<0
          nvidia-nccl-cu12<0
          nvidia-nvjitlink-cu12<0
          nvidia-nvtx-cu12<0
          EOF
          export PIP_CONSTRAINT=/tmp/ms_swift_npu_constraints.txt
          export UV_CONSTRAINT=/tmp/ms_swift_npu_constraints.txt
          # 2. uv handles PEP 517 build deps more reliably than pip and
          #    the test's setUpClass invokes `uv pip install ...`. The
          #    internal nginx cache fronts PyPI so this resolves cleanly.
          python -m pip install uv
          # 3. Force-reinstall torch + torch_npu so we get the real NPU
          #    build, not whatever the CANN image happens to ship. Pinned
          #    to the CANN 9.x / py3.12 line so torch_npu's wheel matches
          #    the new runtime; mirrors main's setup_example.sh so the
          #    quick-start and examples tracks run the same torch stack.
          python -m pip install --force-reinstall --no-deps \
              --index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
              --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi \
              --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
              torch==2.9.0 torch_npu==2.9.0.post6
          # 4. Pin transformers / peft (matches the doc's <5.0 / <0.19 caps).
          python -m pip install "transformers<5.0" "peft<0.19"
          # 5. Install vllm + vllm-ascend so block 6's `--infer_backend vllm`
          #    path resolves. Versions mirror main's setup_example.sh on
          #    the CANN 9.1 / torch 2.9 stack:
          #
          #      Ascend HDK    9.1.0
          #      CANN          9.1.0
          #      torch         2.9.0
          #      torch_npu     2.9.0.post6
          #      vllm          0.18.0
          #      vllm-ascend   0.18.0
          #
          #    vllm-ascend 0.18 only ships a cp310/cp311 manylinux_2_24
          #    aarch64 wheel + a sdist, so install setuptools_scm + wheel
          #    up front and use --no-build-isolation so the sdist can build
          #    under py3.12. The constraints file pins every nvidia-*<0 +
          #    cuda-toolkit<0 so vllm 0.18's transitive nvidia-* deps are
          #    blocked. triton-ascend 3.2.0 is vllm-ascend 0.18's pinned
          #    build dep and lives on the huaweicloud ascend index.
          python -m pip install setuptools_scm wheel
          python -m pip install --no-build-isolation \
              --index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
              --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi \
              --find-links https://repo.huaweicloud.com/ascend/repos/pypi/triton-ascend/ \
              --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
              triton-ascend==3.2.0
          python -m pip install --no-deps \
              --index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
              --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi \
              --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
              vllm==0.18.0
          python -m pip install --no-deps \
              --index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple \
              --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi \
              --trusted-host cache-service.nginx-pypi-cache.svc.cluster.local \
              vllm-ascend==0.18.0
          # The doc owns the source install step (its '## install ms-swift'
          # block runs git clone + uv pip install -e . for the exact
          # <UPSTREAM_REF>). After that, run the doc itself as a unittest
          # - every shell block becomes one or more test cases.
          cd workflows/projects/ms-swift
          python -m unittest tests.test_quick_start_ascend -v 2>&1

      - name: Record outcome
        id: record-outcome
        if: |
          always() &&
          github.event_name == 'schedule' &&
          steps.decide.outputs.changed == 'true'
        run: |
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          REASON="${{ steps.decide.outputs.reason }}"
          # Strip the "-retry" suffix to map back to the base monitor.
          BASE="${REASON%-retry}"
          # Map the test step's conclusion to an outcome:
          #   success   -> success  (test passed)
          #   failure   -> failure  (test ran and failed)
          #   skipped/* -> failure  (a prior step broke before test ran;
          #                          treat as failure so the next cycle
          #                          retries; record the cause separately)
          CONCLUSION="${{ steps.test.conclusion }}"
          case "$CONCLUSION" in
            success)
              OUT="success"
              REASON_TEXT=""
              ;;
            failure)
              OUT="failure"
              REASON_TEXT="test failed"
              ;;
            skipped)
              OUT="failure"
              REASON_TEXT="prior step failed before test could run"
              ;;
            cancelled)
              OUT="failure"
              REASON_TEXT="job cancelled"
              ;;
            *)
              OUT="failure"
              REASON_TEXT="unknown conclusion: ${CONCLUSION}"
              ;;
          esac
          echo "${OUT}" > "${STATE_DIR}/.${BASE}_outcome"
          if [ -n "$REASON_TEXT" ]; then
            echo "${REASON_TEXT}" > "${STATE_DIR}/.${BASE}_failure_reason"
          else
            : > "${STATE_DIR}/.${BASE}_failure_reason"
          fi
          echo "outcome for ${BASE}: ${OUT} (test conclusion: ${CONCLUSION}, reason: ${REASON_TEXT})"

      # Write a small machine-readable summary so external monitors can pull
      # per-run outcomes via /actions/runs/{run_id}/artifacts. Captures the
      # metadata that's already on the GH Actions graph (trigger, reason,
      # upstream ref/commit, runner image) plus the GitHub job conclusion;
      # we deliberately do NOT mine the log here because log shape changes
      # would force every consumer to follow along.
      #
      # Why this step also emits job-level outputs (and the file is NOT
      # uploaded here): the linux-aarch64-a2-1 self-hosted NPU runner
      # cannot reach GitHub's artifact blob storage, regardless of file
      # size - upload-artifact stalls waiting for an ack that never comes.
      # So we serialize result.json into a job output and let the
      # publish-results job (ubuntu-latest, downstream) do the upload.
      - name: Write result.json
        id: write-result
        if: always()
        env:
          TRIGGER:         ${{ github.event_name }}
          REASON:          ${{ steps.decide.outputs.reason }}
          UPSTREAM_REPO:   ${{ env.UPSTREAM_REPO }}
          UPSTREAM_REF:    ${{ steps.decide.outputs.test_ref }}
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
          TARGET_REPO:     ${{ vars.TARGET_REPO || 'cosdt-ci-test/ms-swift' }}
          TARGET_REF:      ${{ vars.TARGET_REF || 'main' }}
          IMAGE:           ${{ env.CI_IMAGE }}
          JOB_STATUS:      ${{ job.status }}
          CHANGED:         ${{ steps.decide.outputs.changed }}
        run: |
          mkdir -p output
          if [ "$TRIGGER" = "workflow_dispatch" ] || [ "$CHANGED" = "true" ]; then
            tests_ran=true
          else
            tests_ran=false
          fi
          jq -n \
            --arg workflow         "ms-swift-quick-start" \
            --arg trigger          "$TRIGGER" \
            --arg reason           "$REASON" \
            --arg upstream_repo    "$UPSTREAM_REPO" \
            --arg upstream_ref     "$UPSTREAM_REF" \
            --arg upstream_commit  "$UPSTREAM_COMMIT" \
            --arg target_repo      "$TARGET_REPO" \
            --arg target_ref       "$TARGET_REF" \
            --arg image            "$IMAGE" \
            --arg job_status       "$JOB_STATUS" \
            --argjson tests_ran    "$tests_ran" \
            --arg created_at       "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              workflow:        $workflow,
              trigger:         $trigger,
              reason:          $reason,
              upstream_repo:   $upstream_repo,
              upstream_ref:    $upstream_ref,
              upstream_commit: $upstream_commit,
              target_repo:     $target_repo,
              target_ref:      $target_ref,
              image:           $image,
              tests_ran:       $tests_ran,
              job_status:      $job_status,
              created_at:      $created_at
            }' > output/result.json
          echo "wrote $(wc -c < output/result.json) bytes:"
          cat output/result.json
          # Ship result.json across jobs via job-level outputs (channel 2).
          # We do NOT call upload-artifact on this runner - its artifact
          # blob storage channel is unreachable. The result_json output is
          # read in the publish-results job below and uploaded there.
          # jq -c . gives a one-line, expression-safe JSON string.
          printf 'result_json=%s\n' "$(jq -c . output/result.json)" \
            >> "$GITHUB_OUTPUT"
          {
            printf 'trigger=%s\n'    "$TRIGGER"
            printf 'reason=%s\n'     "$REASON"
            printf 'job_status=%s\n' "$JOB_STATUS"
            printf 'tests_ran=%s\n'  "$tests_ran"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize test result
        if: always()
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "============================================================"
          echo "QUICK START TEST SUMMARY"
          echo "  Upstream repo:    ${{ env.UPSTREAM_REPO }}"
          echo "  Upstream ref:     ${{ steps.decide.outputs.test_ref }}"
          echo "  Upstream commit:  ${{ steps.upstream-commit.outputs.sha }}"
          echo "  Trigger reason:   ${{ steps.decide.outputs.reason }}"
          echo "------------------------------------------------------------"
          # Surface the last-known failure reason (from the prior run's
          # outcome record) so a retry run is self-explanatory.
          REASON_FILE=".monitor-state/.${REASON%-retry}_failure_reason"
          if [ -s "$REASON_FILE" ]; then
            echo "  Last failure:     $(cat "$REASON_FILE")"
          fi
          echo "============================================================"

  # Result.json is produced on the NPU runner (where upload-artifact is
  # unreachable) and shipped via monitor-and-test.outputs.result_json.
  # This job runs on ubuntu-latest and does the actual upload + schema
  # validation, which are the only steps that need network egress to
  # GitHub's artifact blob storage.
  publish-results:
    name: publish result.json
    needs: monitor-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Materialize result.json
        env:
          RESULT_JSON: ${{ needs.monitor-and-test.outputs.result_json }}
        run: |
          mkdir -p output
          # Defensive: if result_json came back empty (e.g. all upstream
          # monitor steps skipped, decide.outputs.changed was false, AND
          # write-result did not run for some reason) we still want the
          # publish job to exit cleanly so the workflow conclusion is
          # driven by monitor-and-test alone.
          if [ -z "$RESULT_JSON" ]; then
            echo "no result_json from monitor-and-test; nothing to publish"
            exit 0
          fi
          printf '%s\n' "$RESULT_JSON" > output/result.json
          echo "materialized $(wc -c < output/result.json) bytes:"
          cat output/result.json

      - name: Validate result.json against schema
        if: always()
        run: |
          if [ ! -s output/result.json ]; then
            echo "result.json is empty; skipping schema validation"
            exit 0
          fi
          python3 -m pip install -q check-jsonschema
          check-jsonschema \
            --schemafile schemas/result.schema.json output/result.json

      - name: Upload result.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ms-swift-quick-start-${{ github.run_id }}
          path: output/result.json
          if-no-files-found: warn
          retention-days: 90
