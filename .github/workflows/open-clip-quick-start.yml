# open_clip Ascend quick-start guard. The shared template owns release/doc
# monitoring, retry state, result validation, and artifact publication.
name: open-clip-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'open-clip-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: open_clip
      machine_type: a2
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/huggingface/open-clip:/root/.cache/huggingface
      timeout_minutes: 90
      upstream_repo: mlfoundations/open_clip
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/open_clip/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/open_clip/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: open_clip
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg.
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/huggingface/open-clip:/root/.cache/huggingface
      timeout_minutes: 90
      upstream_repo: mlfoundations/open_clip
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/open_clip/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/open_clip/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: open_clip
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
