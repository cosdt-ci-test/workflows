# opencv quick start guard (zero-patch variant) - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, runner, container image + options, upstream repo,
# monitored doc, and the test entry command. The guard loop, cache
# I/O, state relay and publishing all live in the engine. See the
# engine's `workflow_call.inputs` block for the full input contract.
#
# Why a separate project namespace instead of reusing `opencv`:
#   * the engine namespaces the monitor-state cache by `with.project`,
#     and the two guards watch *different* docs (5.x-with-patches vs
#     4.14.0-zero-patch) - sharing the namespace would make each
#     doc's hash overwrite the other's and both would re-run forever;
#   * `scripts/examples_check.py` rejects two thin workflows with the
#     same `with.project`;
#   * the two builds install to different prefixes
#     (/usr/local/opencv-cann vs /usr/local/opencv-cann-414) so they
#     can share one self-hosted runner without clobbering each other.

name: opencv-quick-start-nopatch

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  group: ${{ github.event_name == 'schedule' && 'opencv-quick-start-nopatch-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # schedule:
  # Every 6 hours, same cadence as the main opencv guard. The
  # monitored doc pins OpenCV 4.14.0 (fixed_ref below), so the
  # upstream-change trigger is not the interesting signal - the
  # doc-hash trigger is: any edit to the doc re-runs the whole
  # build + inference chain.
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (quick-start-monitor-state-opencv-nopatch_*),
      # artifacts (opencv-nopatch-quick-start-<run_id>) and the test
      # working dir (workflows/projects/opencv-nopatch).
      project: opencv-nopatch
      machine_type: a2
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-4"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      # OpenCV source build needs ~6 GB free disk; --privileged lets
      # cmake's IPPICV download helper write into /tmp without sandbox
      # surprises, --shm-size=64g keeps make from hitting /dev/shm
      # pressure during parallel compile. CANN-side devices mounted
      # explicitly so cmake's `find_package(Ascend)` can dlopen acl
      # libraries on the configure phase for header discovery.
      container_options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
      # Doc body does: apt-get install build deps (aliyun mirror) +
      # git clone opencv @ 4.14.0 + CANN library bridge (3 symlinks
      # into <CANN>/lib64) + cmake -DWITH_CANN=ON configure
      # (BUILD_LIST = 6 modules) + cmake --build --target install
      # (Release -O3, no source patch) + Python binding smoke +
      # videoio smoke (MJPG round-trip) + MobileNetV2 ONNX NPU forward
      # (classic DNN engine, 4.14's default; first GE graph build can
      # take ~1-2 min cold). 240 min leaves room for the build chain +
      # first-time DNN samples / IPPICV / ACL graph cache pulls.
      timeout_minutes: 240
      upstream_repo: opencv/opencv
      # The doc pins the OpenCV version itself (4.14.0, no <ref>
      # placeholder), so the engine monitors that tag's commit instead
      # of the latest release - "latest release" would fire on every
      # 5.x tag while the doc keeps testing 4.14.0.
      fixed_ref: 4.14.0
      # `?ref=${{ github.sha }}` so test fetches THIS branch's doc, not main.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/opencv/docs/Quick-start-Ascend-NoPatch.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/opencv/docs/Quick-start-Ascend-NoPatch.md
      # cwd is workflows/projects/opencv-nopatch; env contract
      # (MONITORED_DOC_URL / UPSTREAM_REF / NPU_READY) is injected by
      # the engine. All project env prep and installs live in the test
      # subclass's prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend_nopatch -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: opencv-nopatch
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg.
      test_runner: '["linux-aarch64-a3-800i-4"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
      timeout_minutes: 240
      upstream_repo: opencv/opencv
      fixed_ref: 4.14.0
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/opencv/docs/Quick-start-Ascend-NoPatch.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/opencv/docs/Quick-start-Ascend-NoPatch.md
      test_command: python -m unittest tests.test_quick_start_ascend_nopatch -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: opencv-nopatch
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
