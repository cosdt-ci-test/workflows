# Guard two existing upstream Ray NPU tests. The manifest supplies runner,
# devices, image, timeout and setup profile for each matrix entry.
name: ray-examples

on:
  # Enable after the first successful workflow_dispatch run.
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target_repo:
        description: Target Ray repository to checkout and test
        required: true
        default: ray-project/ray
        type: string
      target_ref:
        description: Branch, tag, or SHA in the target repository
        required: true
        default: master
        type: string

concurrency:
  group: ray-examples
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  UPSTREAM_REPO: ray-project/ray
  GH_API: https://api.github.com

jobs:
  monitor:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      trigger: ${{ steps.decide.outputs.trigger }}
      reason: ${{ steps.decide.outputs.reason }}
      target_repo: ${{ steps.decide.outputs.target_repo }}
      target_ref: ${{ steps.decide.outputs.target_ref }}
    steps:
      - name: Restore monitor state
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: ray-examples-monitor-state-${{ github.run_id }}
          restore-keys: |
            ray-examples-monitor-state-

      - name: Monitor upstream NPU tests
        id: monitor-tests
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          write_outputs() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          STATE_DIR=.monitor-state
          mkdir -p "$STATE_DIR"
          AUTH_HEADER="Authorization: Bearer ${GH_TOKEN}"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          paths=(
            python/ray/tests/accelerators/test_npu.py
            python/ray/train/tests/test_torch_device_manager.py
          )
          payload=""
          for path in "${paths[@]}"; do
            sha=$(curl -fsSL --retry 3 \
              -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
              "$GH_API/repos/$UPSTREAM_REPO/commits?sha=master&path=$path&per_page=1" \
              | jq -r '.[0].sha // "MISSING"')
            payload+="${path}"$'\t'"${sha}"$'\n'
          done
          digest=$(printf '%s' "$payload" | sha256sum | cut -d' ' -f1)
          master_sha=$(curl -fsSL --retry 3 \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" \
            "$GH_API/repos/$UPSTREAM_REPO/commits/master" | jq -r '.sha // empty')
          [ -n "$master_sha" ] || { echo "failed to resolve master" >&2; exit 1; }
          old=$(cat "$STATE_DIR/.tests_hash" 2>/dev/null || true)
          outcome=$(cat "$STATE_DIR/.tests_outcome" 2>/dev/null || true)
          if [ "$old" != "$digest" ]; then
            echo "$digest" > "$STATE_DIR/.tests_hash"
            echo success > "$STATE_DIR/.tests_outcome"
            write_outputs changed=true "ref=$master_sha" reason=tests
          elif [ "$outcome" = failure ]; then
            write_outputs changed=true "ref=$master_sha" reason=tests-retry
          else
            write_outputs changed=false
          fi
          printf '%s' "$payload"
          echo "tests_hash=$digest outcome=$outcome master_sha=$master_sha"

      - name: Monitor upstream latest release tag
        id: monitor-release
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          write_outputs() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          STATE_DIR=.monitor-state
          mkdir -p "$STATE_DIR"
          tag=$(curl -fsSL --retry 3 \
            "$GH_API/repos/$UPSTREAM_REPO/releases/latest" | jq -r '.tag_name // empty')
          old=$(cat "$STATE_DIR/.last_release_tag" 2>/dev/null || true)
          outcome=$(cat "$STATE_DIR/.release_outcome" 2>/dev/null || true)
          if [ -n "$tag" ] && [ "$old" != "$tag" ]; then
            echo "$tag" > "$STATE_DIR/.last_release_tag"
            echo success > "$STATE_DIR/.release_outcome"
            write_outputs changed=true "ref=$tag" reason=release
          elif [ "$outcome" = failure ]; then
            write_outputs changed=true "ref=$tag" reason=release-retry
          else
            write_outputs changed=false
          fi
          echo "release_tag=$tag outcome=$outcome"

      - name: Monitor upstream master HEAD
        id: monitor-commit
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          write_outputs() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          STATE_DIR=.monitor-state
          mkdir -p "$STATE_DIR"
          sha=$(curl -fsSL --retry 3 \
            "$GH_API/repos/$UPSTREAM_REPO/commits/master" | jq -r '.sha // empty')
          old=$(cat "$STATE_DIR/.last_tested_sha" 2>/dev/null || true)
          outcome=$(cat "$STATE_DIR/.commit_outcome" 2>/dev/null || true)
          if [ -n "$sha" ] && [ "$old" != "$sha" ]; then
            echo "$sha" > "$STATE_DIR/.last_tested_sha"
            echo success > "$STATE_DIR/.commit_outcome"
            write_outputs changed=true "ref=$sha" reason=commit
          elif [ "$outcome" = failure ]; then
            write_outputs changed=true "ref=$sha" reason=commit-retry
          else
            write_outputs changed=false
          fi
          echo "master_sha=$sha outcome=$outcome"

      - name: Persist monitor state
        if: github.event_name == 'schedule' && always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: ray-examples-monitor-state-${{ github.run_id }}

      - name: Decide target
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPO: ${{ inputs.target_repo }}
          INPUT_REF: ${{ inputs.target_ref }}
          TESTS_CHANGED: ${{ steps.monitor-tests.outputs.changed }}
          TESTS_REASON: ${{ steps.monitor-tests.outputs.reason }}
          TESTS_REF: ${{ steps.monitor-tests.outputs.ref }}
          RELEASE_CHANGED: ${{ steps.monitor-release.outputs.changed }}
          RELEASE_REASON: ${{ steps.monitor-release.outputs.reason }}
          RELEASE_REF: ${{ steps.monitor-release.outputs.ref }}
          COMMIT_CHANGED: ${{ steps.monitor-commit.outputs.changed }}
          COMMIT_REASON: ${{ steps.monitor-commit.outputs.reason }}
          COMMIT_REF: ${{ steps.monitor-commit.outputs.ref }}
        run: |
          set -euo pipefail
          write_outputs() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            write_outputs \
              changed=true \
              trigger=workflow_dispatch \
              reason=manual \
              "target_repo=${INPUT_REPO:-$UPSTREAM_REPO}" \
              "target_ref=${INPUT_REF:-master}"
            exit 0
          fi

          changed=false
          reason=""
          ref=""
          if [ "$TESTS_CHANGED" = true ]; then
            changed=true; reason="$TESTS_REASON"; ref="$TESTS_REF"
          elif [ "$RELEASE_CHANGED" = true ]; then
            changed=true; reason="$RELEASE_REASON"; ref="$RELEASE_REF"
          elif [ "$COMMIT_CHANGED" = true ]; then
            changed=true; reason="$COMMIT_REASON"; ref="$COMMIT_REF"
          fi
          write_outputs \
            "changed=$changed" \
            trigger=schedule \
            "reason=$reason" \
            "target_repo=$UPSTREAM_REPO" \
            "target_ref=$ref"

  manifest-check:
    needs: monitor
    if: needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      supported_matrix: ${{ steps.check.outputs.supported_matrix }}
      has_supported: ${{ steps.check.outputs.has_supported }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.monitor.outputs.target_repo }}
          ref: ${{ needs.monitor.outputs.target_ref }}
          path: target
          fetch-depth: 1

      - name: Check explicit upstream test manifest
        id: check
        env:
          TARGET_REPO: ${{ needs.monitor.outputs.target_repo }}
          TARGET_REF: ${{ needs.monitor.outputs.target_ref }}
          TRIGGER: ${{ needs.monitor.outputs.trigger }}
        run: |
          python3 -m pip install -q pyyaml
          python3 workflows/projects/ray/scripts/check_manifest.py \
            --target-root target \
            --manifest workflows/projects/ray/examples_manifest.yaml \
            --result-json manifest_check_result.json \
            --target-repo "$TARGET_REPO" \
            --target-ref "$TARGET_REF" \
            --trigger "$TRIGGER"

      - name: Validate manifest check result
        run: |
          python3 -m pip install -q check-jsonschema
          check-jsonschema \
            --schemafile workflows/schemas/manifest_check_result.schema.json \
            manifest_check_result.json

      - name: Upload manifest check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ray-manifest-check
          if-no-files-found: ignore
          path: manifest_check_result.json

  run-example:
    name: run-example (${{ matrix.example.path }})
    needs: [monitor, manifest-check]
    if: needs.manifest-check.outputs.has_supported == 'true'
    runs-on: ${{ matrix.example.runner }}
    timeout-minutes: ${{ matrix.example.timeout_minutes }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.supported_matrix) }}
    env:
      ASCEND_RT_VISIBLE_DEVICES: ${{ matrix.example.npu_devices }}
      PROJECT_ROOT: ${{ github.workspace }}/workflows/projects/ray
      TARGET_ROOT: ${{ github.workspace }}/target
      PIP_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      PIP_TRUSTED_HOST: cache-service.nginx-pypi-cache.svc.cluster.local
      PIP_EXTRA_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TIMEOUT: '120'
    container:
      image: ${{ matrix.example.image }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.monitor.outputs.target_repo }}
          ref: ${{ needs.monitor.outputs.target_ref }}
          path: target
          fetch-depth: 1

      - name: Source CANN and check NPU
        run: |
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info

      - name: Setup test environment
        env:
          PROFILE: ${{ matrix.example.profile }}
        run: bash "$PROJECT_ROOT/scripts/setup_example.sh" "$PROFILE"

      - name: Run upstream test
        env:
          EXAMPLE_PATH: ${{ matrix.example.path }}
          OVERLAY_ARGS: ${{ toJSON(matrix.example.overlay_args) }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          CI_OUTPUT_DIR="$GITHUB_WORKSPACE/output" \
            bash "$PROJECT_ROOT/scripts/run_example.sh" "$EXAMPLE_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/output/test.log"

  publish-result:
    name: publish-result (${{ matrix.example.path }})
    needs: [monitor, manifest-check, run-example]
    if: always() && needs.manifest-check.outputs.has_supported == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.manifest-check.outputs.supported_matrix) }}
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Write result JSON
        env:
          TARGET_REPO: ${{ needs.monitor.outputs.target_repo }}
          TARGET_REF: ${{ needs.monitor.outputs.target_ref }}
          TRIGGER: ${{ needs.monitor.outputs.trigger }}
          EXAMPLE_PATH: ${{ matrix.example.path }}
          IMAGE: ${{ matrix.example.image }}
          EXPECTED_JOB_NAME: run-example (${{ matrix.example.path }})
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusion="$(
            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" |
              jq -r --arg name "$EXPECTED_JOB_NAME" \
                '.jobs[] | select(.name == $name) | .conclusion'
          )"
          [ -n "$conclusion" ] || { echo "job not found: $EXPECTED_JOB_NAME" >&2; exit 1; }
          case "$conclusion" in
            success|cancelled) job_status="$conclusion" ;;
            *) job_status=failure ;;
          esac
          mkdir -p output
          export JOB_STATUS="$job_status"
          python3 - <<'PY'
          import json
          import os

          result = {
              "trigger": os.environ["TRIGGER"],
              "target_repo": os.environ["TARGET_REPO"],
              "target_ref": os.environ["TARGET_REF"],
              "path": os.environ["EXAMPLE_PATH"],
              "image": os.environ["IMAGE"],
              "job_status": os.environ["JOB_STATUS"],
          }
          with open("output/result.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2)
              handle.write("\n")
          PY

      - name: Validate result JSON
        run: |
          python3 -m pip install -q check-jsonschema
          check-jsonschema \
            --schemafile workflows/schemas/result.schema.json \
            output/result.json

      - name: Upload result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ray-examples-${{ github.run_id }}-${{ strategy.job-index }}
          if-no-files-found: error
          path: output/result.json

  record-outcome:
    needs: [monitor, manifest-check, run-example]
    if: >-
      always() && github.event_name == 'schedule' &&
      needs.monitor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Restore monitor state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: ray-examples-monitor-state-${{ github.run_id }}-post
          restore-keys: |
            ray-examples-monitor-state-

      - name: Record outcome
        env:
          REASON: ${{ needs.monitor.outputs.reason }}
          RUN_RESULT: ${{ needs.run-example.result }}
          MANIFEST_RESULT: ${{ needs.manifest-check.result }}
          HAS_SUPPORTED: ${{ needs.manifest-check.outputs.has_supported }}
        run: |
          set -euo pipefail
          STATE_DIR=.monitor-state
          mkdir -p "$STATE_DIR"
          base="${REASON%-retry}"
          if [ "$RUN_RESULT" = success ]; then
            outcome=success
            reason_text=""
          elif [ "$RUN_RESULT" = skipped ] && [ "$MANIFEST_RESULT" = success ] \
            && [ "$HAS_SUPPORTED" = false ]; then
            outcome=success
            reason_text=""
          else
            outcome=failure
            reason_text="run-example: ${RUN_RESULT}, manifest-check: ${MANIFEST_RESULT}"
          fi
          echo "$outcome" > "$STATE_DIR/.${base}_outcome"
          printf '%s\n' "$reason_text" > "$STATE_DIR/.${base}_failure_reason"
          echo "outcome for $base: $outcome (${reason_text:-ok})"

      - name: Persist monitor state
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: ray-examples-monitor-state-${{ github.run_id }}-post
