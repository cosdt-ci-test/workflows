# TensorDict examples guard: the project-specific trigger for examples-template.
name: tensordict-examples

on:
  # Daily at 00:45 UTC (08:45 Beijing).
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty selects the latest release)
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.event_name == 'schedule' && 'tensordict-examples-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  tensordict-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      project: tensordict
      upstream_repo: pytorch/tensordict
      target_ref: ${{ inputs.target_ref }}
      max_parallel: 4
