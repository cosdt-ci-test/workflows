# torchtitan quick start guard - project thin trigger.

name: torchtitan-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'torchtitan-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: torchtitan
      machine_type: a2
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/torchtitan:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: pytorch/torchtitan
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/torchtitan/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/torchtitan/docs/Quick-start-Ascend.md
      # The doc test first (it installs torchtitan into the environment), then
      # the override equivalence checks -- unittest runs the named modules in
      # the given order, so the second module sees the installed torchtitan.
      test_command: python -m unittest tests.test_quick_start_ascend tests.test_npu_overrides -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: torchtitan
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg.
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-a3-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/torchtitan:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: pytorch/torchtitan
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/torchtitan/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/torchtitan/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend tests.test_npu_overrides -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: torchtitan
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3