# trl quick start guard - project thin trigger.
#
# Calls the common engine .github/workflows/quick-start-template.yml;
# this file only declares what varies per project: concurrency,
# runner, container image + options, upstream repo, monitored doc,
# and the test entry command. The guard loop, cache I/O, state relay
# and publishing all live in the engine.
#
# Engine-fixed behaviours this trigger relies on (declared in the
# engine, NOT here):
#   * cache key prefix: monitor-state-trl-  (from inputs.project)
#   * artifact name:    trl-quick-start-<run_id>
#   * result.json is written by the engine and validated against
#     schemas/result.schema.json before upload.
#
# NOTE: only workflow_dispatch is enabled for now (per spec: same
# onboarding rhythm as llama.cpp / whisper.cpp). Once the pipeline
# runs green and stable, re-enable the schedule block below
# (copy the peft-quick-start.yml cron: '0 */3 * * *') to start the
# periodic monitor loop. Until then, the engine's schedule-only steps
# (monitor / record-monitor-outcome / cache save) simply never run.

name: trl-quick-start

concurrency:
  # format() is load-bearing: a '||' between 'manual-' and
  # github.run_id would short-circuit on the truthy literal and
  # every dispatch would share one 'manual-' group.
  # The schedule branch is kept (even though schedule is not enabled
  # yet) so re-enabling the cron later needs no concurrency change.
  group: ${{ github.event_name == 'schedule' && 'trl-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  # cancel-in-progress: false because (1) a schedule run cancelled
  # mid-way loses its outcome writeback - the outcome is what makes
  # the retry mechanism work, and the 'if: always()' guard isn't
  # enough when the container is being torn down; (2) dispatch runs
  # already live in unique groups so there's nothing to cancel.
  cancel-in-progress: false

on:
  # schedule: deliberately NOT enabled yet - see the header note.
  # Enable with e.g. `- cron: '0 */3 * * *'` once the pipeline is
  # proven stable on manual runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trl-quick-start:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      # Namespaces cache keys (monitor-state-trl-*), artifacts
      # (trl-quick-start-<run_id>) and the test working dir
      # (workflows/projects/trl).
      project: trl
      # Self-hosted NPU runner for the test job only; the engine pins
      # the cache I/O jobs (restore-cache / publish-and-persist) to
      # GitHub-hosted ubuntu-latest.
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/modelscope/trl:/root/.cache/modelscope
      timeout_minutes: 180
      upstream_repo: huggingface/trl
      # Doc under guard: projects/trl/docs/Quick-start-Ascend.md in
      # this repo (raw URL for hashing/fetching, blob URL for the
      # human-clickable link recorded in result.json).
      doc_url: https://raw.githubusercontent.com/cosdt-ci-test/workflows/main/projects/trl/docs/Quick-start-Ascend.md
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/main/projects/trl/docs/Quick-start-Ascend.md
      # cwd is workflows/projects/trl; env contract (MONITORED_DOC_URL /
      # UPSTREAM_REF / NPU_READY) is injected by the engine. All project
      # env prep and installs live in the test subclass's
      # prepare_environment hook.
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1
