name: unsloth-npu-example
run-name: Unsloth NPU / ${{ inputs.scenario }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Test scenario
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - standard-gc
          - unsloth-gc
          - checkpoint-resume
          - merge-16bit
          - dpo
          - full-finetune
          - continued-pretrain
          - inference-extended
          - grpo
          - vllm-ascend
          - grpo-vllm-ascend
          - packing
          - packing-bfd
          - long-context
          - ddp-2
          - fsdp2-2

permissions:
  contents: read

concurrency:
  group: unsloth-npu-example-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qwen3-lora:
    if: inputs.scenario != 'ddp-2' && inputs.scenario != 'fsdp2-2' && inputs.scenario != 'vllm-ascend' && inputs.scenario != 'grpo-vllm-ascend'
    runs-on: linux-aarch64-a2-1
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12
      options: >-
        --privileged --shm-size=16g
        --device=/dev/davinci0
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/pip:/root/.cache/pip
        --volume=/data/ci-cache/modelscope/unsloth:/root/.cache/modelscope
    env:
      TEST_SCENARIO: ${{ inputs.scenario }}
      ASCEND_RT_VISIBLE_DEVICES: '0'
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_DEFAULT_TIMEOUT: '120'
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: '1'
      MODELSCOPE_CACHE: /root/.cache/modelscope
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
      UNSLOTH_REF: 4089c57a82c13fcb96c4b9d71b67e32a75808763
      ZOO_REF: 97153adb58d7f703aca65b44e86b289b58516cbf
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Unsloth
        uses: actions/checkout@v6
        with:
          repository: unslothai/unsloth
          ref: ${{ env.UNSLOTH_REF }}
          path: upstream/unsloth
      - name: Checkout Unsloth Zoo
        uses: actions/checkout@v6
        with:
          repository: unslothai/unsloth-zoo
          ref: ${{ env.ZOO_REF }}
          path: upstream/unsloth-zoo
      - name: Install NPU stack and example dependencies
        run: |
          set -eo pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p output
          exec > >(tee output/install.log) 2>&1
          npu-smi info
          python -m pip install torch==2.9.0 torch_npu==2.9.0.post2 --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi
          python -m pip install triton-ascend==3.2.2 --extra-index-url https://triton-ascend.osinfra.cn/pypi/simple
          python -m pip install packaging
          python projects/unsloth/install_dependencies.py
          python -m pip install --no-deps ./upstream/unsloth-zoo ./upstream/unsloth
          python -m pip freeze > output/packages.txt
          cat output/packages.txt
          python -c "import torch, torch_npu, triton.backends.ascend; assert torch.npu.is_available(); print(torch.__version__, torch_npu.__version__, torch.npu.get_device_name(0))"
      - name: Run selected Unsloth NPU scenario
        run: |
          set -eo pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          if [[ "$TEST_SCENARIO" == "checkpoint-resume" ]]; then
            python projects/unsloth/qwen3_checkpoint_resume.py --phase train 2>&1 | tee output/resume-train.log
            python projects/unsloth/qwen3_checkpoint_resume.py --phase resume 2>&1 | tee output/resume.log
          elif [[ "$TEST_SCENARIO" == "merge-16bit" ]]; then
            python projects/unsloth/qwen3_merge_16bit.py --phase train 2>&1 | tee output/merge-16bit-train.log
            python projects/unsloth/qwen3_merge_16bit.py --phase reload 2>&1 | tee output/merge-16bit-reload.log
          elif [[ "$TEST_SCENARIO" == "dpo" ]]; then
            python projects/unsloth/qwen3_dpo_smoke.py 2>&1 | tee output/dpo.log
          elif [[ "$TEST_SCENARIO" == "full-finetune" ]]; then
            python projects/unsloth/qwen3_full_finetune.py --phase train 2>&1 | tee output/full-finetune-train.log
            python projects/unsloth/qwen3_full_finetune.py --phase reload 2>&1 | tee output/full-finetune-reload.log
          elif [[ "$TEST_SCENARIO" == "continued-pretrain" ]]; then
            python projects/unsloth/qwen3_continued_pretrain.py 2>&1 | tee output/continued-pretrain.log
          elif [[ "$TEST_SCENARIO" == "inference-extended" ]]; then
            python projects/unsloth/qwen3_inference_extended.py 2>&1 | tee output/inference-extended.log
          elif [[ "$TEST_SCENARIO" == "grpo" ]]; then
            python projects/unsloth/qwen3_grpo_smoke.py 2>&1 | tee output/grpo.log
          else
            python projects/unsloth/qwen3_lora_smoke.py 2>&1 | tee output/example.log
          fi
      - name: Record exact outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p output
          python projects/unsloth/report.py
          # Raw install/example logs remain in the Actions log. These runners
          # cannot reliably reach artifact blob storage; print the result too.
          cat output/result.json

  qwen3-lora-2card:
    if: inputs.scenario == 'ddp-2' || inputs.scenario == 'fsdp2-2'
    runs-on: linux-aarch64-a2-2
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:9.1.0-910b-ubuntu22.04-py3.12
      options: >-
        --privileged --shm-size=32g
        --device=/dev/davinci0 --device=/dev/davinci1
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/pip:/root/.cache/pip
        --volume=/data/ci-cache/modelscope/unsloth:/root/.cache/modelscope
    env:
      TEST_SCENARIO: ${{ inputs.scenario }}
      ASCEND_RT_VISIBLE_DEVICES: '0,1'
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_DEFAULT_TIMEOUT: '120'
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: '1'
      MODELSCOPE_CACHE: /root/.cache/modelscope
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
      HCCL_CONNECT_TIMEOUT: '120'
      UNSLOTH_REF: 4089c57a82c13fcb96c4b9d71b67e32a75808763
      ZOO_REF: 97153adb58d7f703aca65b44e86b289b58516cbf
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Unsloth
        uses: actions/checkout@v6
        with:
          repository: unslothai/unsloth
          ref: ${{ env.UNSLOTH_REF }}
          path: upstream/unsloth
      - name: Checkout Unsloth Zoo
        uses: actions/checkout@v6
        with:
          repository: unslothai/unsloth-zoo
          ref: ${{ env.ZOO_REF }}
          path: upstream/unsloth-zoo
      - name: Install two-card NPU stack and dependencies
        run: |
          set -eo pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p output
          exec > >(tee output/install-ddp.log) 2>&1
          npu-smi info
          python -m pip install torch==2.9.0 torch_npu==2.9.0.post2 --extra-index-url https://repo.huaweicloud.com/ascend/repos/pypi
          python -m pip install triton-ascend==3.2.2 --extra-index-url https://triton-ascend.osinfra.cn/pypi/simple
          python -m pip install packaging
          python projects/unsloth/install_dependencies.py
          python -m pip install --no-deps ./upstream/unsloth-zoo ./upstream/unsloth
          python -m pip freeze > output/packages.txt
          cat output/packages.txt
          python -c "import torch, torch_npu, triton.backends.ascend; assert torch.npu.is_available(); print(torch.__version__, torch_npu.__version__, torch.npu.device_count(), [torch.npu.get_device_name(i) for i in range(torch.npu.device_count())])"
          python -c "from modelscope import snapshot_download; print(snapshot_download('Qwen/Qwen3-0.6B'))"
      - name: Run selected two-card scenario
        run: |
          set -eo pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          if [[ "$TEST_SCENARIO" == "ddp-2" ]]; then
            python -m torch.distributed.run --standalone --nproc_per_node=2 --master_port=29601 projects/unsloth/qwen3_ddp_2card.py 2>&1 | tee output/ddp-2.log
          else
            python -m torch.distributed.run --standalone --nproc_per_node=2 --master_port=29601 projects/unsloth/qwen3_fsdp2_2card.py --phase train 2>&1 | tee output/fsdp2-train.log
            python -m torch.distributed.run --standalone --nproc_per_node=2 --master_port=29601 projects/unsloth/qwen3_fsdp2_2card.py --phase resume 2>&1 | tee output/fsdp2-resume.log
          fi
      - name: Record exact outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p output
          python projects/unsloth/report.py
          cat output/result.json

  qwen3-vllm-ascend:
    if: inputs.scenario == 'vllm-ascend' || inputs.scenario == 'grpo-vllm-ascend'
    runs-on: linux-aarch64-a2-1
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend/vllm-ascend:v0.23.0
      options: >-
        --privileged --shm-size=16g
        --device=/dev/davinci0
        --device=/dev/davinci_manager --device=/dev/devmm_svm --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
        --volume=/data/ci-cache/pip:/root/.cache/pip
        --volume=/data/ci-cache/modelscope/unsloth:/root/.cache/modelscope
    env:
      TEST_SCENARIO: ${{ inputs.scenario }}
      ASCEND_RT_VISIBLE_DEVICES: '0'
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_DEFAULT_TIMEOUT: '120'
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: '1'
      MODELSCOPE_CACHE: /root/.cache/modelscope
      PYTHONUNBUFFERED: '1'
      TOKENIZERS_PARALLELISM: 'false'
      UNSLOTH_VLLM_STANDBY: '0'
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      UNSLOTH_REF: 4089c57a82c13fcb96c4b9d71b67e32a75808763
      ZOO_REF: 97153adb58d7f703aca65b44e86b289b58516cbf
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Unsloth
        uses: actions/checkout@v6
        with:
          repository: unslothai/unsloth
          ref: ${{ env.UNSLOTH_REF }}
          path: upstream/unsloth
      - name: Checkout Unsloth Zoo
        uses: actions/checkout@v6
        with:
          repository: unslothai/unsloth-zoo
          ref: ${{ env.ZOO_REF }}
          path: upstream/unsloth-zoo
      - name: Run selected Unsloth vLLM scenario
        run: |
          set -eo pipefail
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          mkdir -p output
          npu-smi info
          if [[ "$TEST_SCENARIO" == "vllm-ascend" ]]; then
            python projects/unsloth/qwen3_vllm_ascend.py --phase native 2>&1 | tee output/vllm-native.log
          fi
          python projects/unsloth/install_dependencies.py --vllm-image
          python -m pip install --no-deps ./upstream/unsloth-zoo ./upstream/unsloth
          python -m pip freeze | tee output/packages.txt
          if [[ "$TEST_SCENARIO" == "grpo-vllm-ascend" ]]; then
            python projects/unsloth/qwen3_grpo_smoke.py 2>&1 | tee output/grpo-vllm-ascend.log
          else
            python projects/unsloth/qwen3_vllm_ascend.py --phase unsloth 2>&1 | tee output/vllm-unsloth.log
          fi
      - name: Record exact outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p output
          python projects/unsloth/report.py
          cat output/result.json
