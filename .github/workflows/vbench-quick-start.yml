# human_action from the official VBench README. All project adaptation lives
# in projects/vbench/patches and is checked/applied by the executable document.
name: vbench-quick-start

concurrency:
  group: vbench-quick-start
  cancel-in-progress: false

on:
  # Enable after the first successful NPU workflow_dispatch run.
  # schedule:
  #   - cron: '40 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: vbench
      machine_type: a2
      test_runner: '["linux-aarch64-a2-1"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/vbench:/root/.cache/vbench
      timeout_minutes: 180
      upstream_repo: Vchitect/VBench
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/vbench/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/vbench/docs/Quick-start-Ascend.md
      test_command: python -u -m unittest tests.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: vbench
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg.
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/vbench:/root/.cache/vbench
      timeout_minutes: 180
      upstream_repo: Vchitect/VBench
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/vbench/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/vbench/docs/Quick-start-Ascend.md
      test_command: python -u -m unittest tests.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: vbench
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
