# xDiT quick start guard - project thin trigger.
# 2-card runner (linux-aarch64-a2-2); test class exposes both via ASCEND_RT_VISIBLE_DEVICES=0,1.
# ModelScope hub cache bind-mounted from host to persist ~28 GB SD3 download across runs.

name: xdit-quick-start

concurrency:
  group: ${{ github.event_name == 'schedule' && 'xdit-quick-start-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

on:
  # schedule 已具备绿灯基线，可按节奏恢复
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qs-a2:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: xdit
      machine_type: a2
      test_runner: '["linux-aarch64-a2-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/xdit:/root/.cache/modelscope:z
      # Doc body: torch stack install -> xfuser PyPI -> NPU verify -> single-card SD3
      # -> PNG check -> 2-card Ulysses SDPA. 90 min covers cold download (~28 GB).
      timeout_minutes: 120
      upstream_repo: xdit-project/xDiT
      # Contents API URL with ref pin; same pattern as other projects.
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/xdit/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/xdit/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  qs-a3:
    uses: ./.github/workflows/quick-start-template.yml
    with:
      project: xdit
      machine_type: a3
      # Atlas 900 A3 (Ascend 910C) leg.
      test_runner: '["linux-aarch64-a3-800i-2"]'
      image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-a3-ubuntu22.04-py3.12
      container_options: >-
        --volume=/data/ci-cache/modelscope/xdit:/root/.cache/modelscope:z
      timeout_minutes: 120
      upstream_repo: xdit-project/xDiT
      doc_url: https://api.github.com/repos/cosdt-ci-test/workflows/contents/projects/xdit/docs/Quick-start-Ascend.md?ref=${{ github.sha }}
      doc_path: https://github.com/cosdt-ci-test/workflows/blob/${{ github.sha }}/projects/xdit/docs/Quick-start-Ascend.md
      test_command: python -m unittest tests.test_quick_start_ascend -v 2>&1

  merge:
    needs: [qs-a2, qs-a3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows (provides the merge action)
        uses: actions/checkout@v6
      - name: Merge per-machine results into one artifact
        uses: ./.github/actions/merge-quick-start-results
        with:
          project: xdit
          result_a2: ${{ needs.qs-a2.outputs.result_json }}
          result_a3: ${{ needs.qs-a3.outputs.result_json }}
          name_a2: qs-a2
          name_a3: qs-a3
