# xllm examples guard - project thin trigger.
#
# Calls the common engine .github/workflows/examples-template.yml;
# this file only declares what varies per project: schedule,
# concurrency, upstream repo, dispatch input forwarding, and matrix
# parallelism. The guard loop (release-only monitor / manifest-check /
# run-example matrix / validate-results / save-monitor-state) lives in
# the engine. See docs/examples-guard-engine.md for the design.
#
# Migration notes (from the legacy standalone workflow):
# - No container options: the self-hosted NPU runner
#   (linux-aarch64-a2-1) auto-passes /dev/davinci* via the cluster
#   device-plugin (same convention as torchtune / tensordict / areal),
#   and xllm's official release image carries the Ascend userspace it
#   needs. The legacy --device/--volume driver mounts and
#   --shm-size=64g were dropped with it (the examples are
#   single-process inference scripts, no multi-worker dataloaders).
# - No modelscope cache bind-mount: the example model
#   (Qwen/Qwen2-7B-Instruct) is planted by the cache-seed workflow
#   (cache-seed/xllm/ms_seeds.yaml) into the shared runner cache;
#   setup_example.sh resolves it and exports XLLM_MODEL_PATH, which
#   the manifest overlay_args reference as --model ${XLLM_MODEL_PATH}.
# - No submodules on the target checkout: they are C++ build deps
#   (third_party/*); xllm itself is pre-installed in the release
#   image, so the examples only need the Python scripts.

name: xllm-examples

concurrency:
  # schedule runs serialize; each manual run gets its own group so a
  # dispatch is never blocked behind a scheduled run.
  group: ${{ github.event_name == 'schedule' && 'xllm-examples-schedule' || format('manual-{0}', github.run_id) }}
  # false: a run cancelled mid-way loses its outcome writeback, and the
  # outcome is what drives the next cycle's retry.
  cancel-in-progress: false

on:
  # Bring-up phase: keep the schedule disabled until a few manual
  # rounds are green (same policy as torchtune / speculators).
  # Re-enable:
  # schedule:
  #   - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to test (empty = latest upstream release; falls back to main on API failure)
        required: false
        default: ''
        type: string

# Engine jobs query the GitHub Job API (validate-results); called
# workflows run with the caller's GITHUB_TOKEN permissions.
permissions:
  actions: read
  contents: read

jobs:
  xllm-examples:
    uses: ./.github/workflows/examples-template.yml
    with:
      # Namespaces cache keys (examples-monitor-state-xllm_*),
      # artifact names and the scheduling paths under
      # projects/xllm.
      project: xllm
      upstream_repo: xLLM-AI/xllm
      target_ref: ${{ inputs.target_ref }}
      max_parallel: 4
