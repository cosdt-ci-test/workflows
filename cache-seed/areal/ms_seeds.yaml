# AReaL 例程资产的 ModelScope plant spec（由 cache-seed workflow 的
# scripts/ms_seed.py 执行）。每个 profile 的主模型都在这里；setup_example.sh
# 不再下载，只从共享缓存的 refs/main 解析 ${AREAL_MODEL_PATH}。
#
# profile -> model 映射见 projects/areal/scripts/setup_example.sh 的 case：
#   areal-vlm-grpo / areal-clevr-sft        : Qwen2.5-VL-3B-Instruct
