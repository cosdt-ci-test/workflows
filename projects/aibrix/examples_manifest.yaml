version: 1
scan:
  root: deployment
  include_extensions: ['.sh']
  max_depth: 3
supported:
  - path: deployment/local/run-local.sh
    profile: local_gateway
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 45
unsupported:
  # Stop helper for local mode. Not a workload.
  - deployment/local/stop-local.sh
  # Docker Compose standalone stack. No Ascend device, not the NPU path.
  - deployment/standalone/start.sh
  - deployment/standalone/scripts/test-api.sh
  - deployment/standalone/scripts/health-check.sh
