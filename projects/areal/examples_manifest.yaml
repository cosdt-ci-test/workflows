  # geometry3k_grpo_mt.py 的官方 NPU 启动器（export USE_OPTIMIZED_MODEL=0 +
  # 同 config 转发 "$@"）——可跑，补一条实测；run_example.sh 按扩展名分发
  # .sh → bash。launcher 自带 scheduler.type=local，其余参数经 "$@" 透传，
  # 配方同已验证的 mt 条目。
  - path: examples/multi_turn_vlm/run_geometry3k_grpo_mt_npu.sh
    profile: areal-vlm-mt-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - +rollout.setup_timeout=1800
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.reward_norm.mean_level=null
      - actor.adv_norm.mean_level=null
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.n_samples=1
      - gconfig.max_new_tokens=64
      - max_turns=2
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
  # CLEVR 计数 SFT：与 clevr grpo 同数据；SFT 特有成本是 loader 第二次 map
  # （逐条完整 VLM processor，上游 FIXME 病态慢，单进程），数据走默认 data
  # service → setup_timeout=7200 兜底、timeout 300 实测定量。换 Qwen2.5-VL-3B
  # （上游为旧代 Qwen2-VL-7B，复用 areal-vlm-grpo profile）。
  - path: examples/vlm/clevr_count_70k_sft.py
    profile: areal-vlm-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/vlm/clevr_count_70k_sft.yaml
      - +scheduler.type=local
      - cluster.n_gpus_per_node=2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=7200
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 300
