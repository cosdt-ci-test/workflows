version: 1
scan:
  root: examples
  include_extensions: ['.py', '.sh']
  # files-only 模型（docs/examples-guard-engine.md §2.7）。2026-10-08 起与
  # diffusers 对齐收口：原 scan.exclude 的 36 条规则全部迁入
  # unsupported 段（上游自测 / scaffolding / tir / terminal_bench / search_agent
  # 等实现模块，带分组注释与理由），scan 只保留 root + include_extensions 两个键。
  # 对账口径：ascend-v1.0.5 树 101 个 .py/.sh = supported(13) + unsupported(88)。
  # 注意 main 线（v2.1.0=114、当前 main=131）与本分支树不同，勿混用口径。

# NPU 支持在 ascend-v1.0.5 分支（非 main），需专用镜像
# ghcr.io/hwvanici/areal_npu:v1.0.5-a2。
# 国内源：ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
# 通用配方：
# - 双卡 colocate：rollout vllm:d1p1t2 + actor fsdp:d2p1t1；offload 解
#   optimizer-state OOM，disk 权重同步解共卡 xccl 建不起 HCCL 组（EI0015）。
# - weight_update_mode：yaml 没写的用 + 新增，已写 xccl 的用 ++ 覆盖。
# - scheduler.type=null 的 yaml（math 系）必须补 scheduler.type=local。
# - norm：reward=group + adv=batch 实测可过；reward/adv 为 batch 级的需加
#   mean_level=null（HCCL 不支持 float64 allreduce）。
# - setup_timeout=600 兜底数据集在线冷下载（HF_ENDPOINT=hf-mirror.com）。
# - rollout.setup_timeout 默认仅 300s，vLLM-Ascend 多模态 server 预热（mm
#   processor warmup + tokenizer 深拷贝）在慢机上会超，RL 条目统一
#   +rollout.setup_timeout=1800 兜底。
supported:
  # Qwen2.5-VL-3B Geometry3K GRPO（双卡，2026-09-27 实测跑通）
  - path: examples/vlm/geometry3k_grpo.py
    profile: areal-vlm-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/vlm_npu/qwen2_5_vl_3b_geometry3k_grpo.yaml
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
  
  # Qwen3-VL-2B 多轮 tool-calling GRPO（双卡，实测跑通）。max_tokens_per_mb
  # 同时是 workflow 的 max_tokens_per_traj，勿低于 1024（图片视觉 token 会超）。
  - path: examples/multi_turn_vlm/geometry3k_grpo_mt.py
    profile: areal-vlm-mt-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/multi_turn_vlm/qwen3_vl_2b_geometry3k_grpo_mt.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.reward_norm.mean_level=null
      - actor.adv_norm.mean_level=null
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.n_samples=1
      - gconfig.max_new_tokens=64
      - max_turns=2
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
  # GSM8K GRPO（上游 NPU 专用配置 gsm8k_grpo_npu.yaml，实测跑通）
  - path: examples/math/gsm8k_rl.py
    profile: areal-math-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/math/gsm8k_grpo_npu.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - ++actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
  # GSM8K SFT（实测跑通）：纯 FSDP 无 rollout，不需 offload/disk
  - path: examples/math/gsm8k_sft.py
    profile: areal-math-sft
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/math/gsm8k_sft.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - actor.backend=fsdp:d2p1t1
      - actor.path=${AREAL_MODEL_PATH}
      - train_dataset.batch_size=4
      - valid_dataset.batch_size=4
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
  # AIME RL（实测跑通）：上游无 aime 配置，setup 从 gsm8k_grpo_npu.yaml
  # 派生（MathArena 数据转本地 parquet，经 AREAL_AIME_CONFIG 传入）
  - path: examples/math/aime_rl.py
    profile: areal-math-aime
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config ${AREAL_AIME_CONFIG}
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - ++actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_tokens=4096
      - gconfig.max_new_tokens=512
      - gconfig.n_samples=1
      - train_dataset.max_length=4096
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +total_train_steps=1
    timeout_minutes: 60
  # BoBa GRPO（实测跑通）：脚本按本地 jsonl 加载，setup 预下载
  # AReaL-boba-106k.jsonl（AREAL_BOBA_DATA）
  - path: examples/math/boba_grpo.py
    profile: areal-math-boba
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/math/boba_grpo.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - ++actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - actor.ppo_n_minibatches=1
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - rollout.enable_rollout_tracing=false
      - perf_tracer.enabled=false
      - train_dataset.path=${AREAL_BOBA_DATA}
      - train_dataset.batch_size=2
      - +total_train_steps=1
      - ++actor.scheduling_spec.0.env_vars.TASK_QUEUE_ENABLE=1
    timeout_minutes: 60
  # Countdown GRPO：数据由 setup 现场生成（countdown.py --num_samples 32
  # --eval_size 8），对上 yaml 默认 train_dataset.path
  - path: examples/countdown/train.py
    profile: areal-countdown-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/countdown/train_config.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - +rollout.setup_timeout=1800
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - +total_train_steps=1
    timeout_minutes: 60
  # GSM8K 多轮自我纠错 GRPO（实测跑通）：复用 areal-math-grpo profile
  - path: examples/multi_turn_math/gsm8k_rl_mt.py
    profile: areal-math-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/multi_turn_math/gsm8k_grpo_mt.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
  # Geometry3K VLM SFT（2026-09-28 实测跑通）：原配置 27B/megatron 16 卡，
  # 换 2B + fsdp 看 VLM SFT 管线；yaml scheduling_spec 为 null，数据主进程
  # 加载，无需 setup_timeout
  - path: examples/vlm/geometry3k_sft.py
    profile: areal-vlm-sft
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/vlm_npu/qwen3_6_27b_geometry3k_sft.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +total_train_steps=1
    timeout_minutes: 60
  # CLEVR 计数 GRPO：与 geometry3k 同构，复用 areal-vlm-grpo profile。重数据
  # 条目：10.4GB 下载 + 7 万图单进程预处理（上游 FIXME 极慢），故
  # setup_timeout 3600 / timeout 180，HF cache ~30GB
  - path: examples/vlm/clevr_count_70k_grpo.py
    profile: areal-vlm-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/vlm/clevr_count_70k_grpo.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - +rollout.setup_timeout=1800
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=3600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 180
  # TIR 工具集成推理 GRPO（独有覆盖面：带内工具调用 + 本地 python/calculator，
  # Daytona 只是可选后端）；torl 数据只有 GitHub 一个来源且 job 容器不可达
  # （ModelScope 404、无 HF 镜像），6MB parquet 以 fixture 入库，setup 预放
  # /tmp/areal/torl_data/ 并建 _SUCCESS 跳过 loader 自带下载
  - path: examples/tir/train_tir.py
    profile: areal-tir-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/tir/tir_math_config.yaml
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - +rollout.setup_timeout=1800
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=128
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
      - vllm.max_model_len=4096
    timeout_minutes: 60
  # Scaffolding 框架 RLVR（独有覆盖面，Qwen2.5-1.5B）：旧版 SPMD yaml 按
  # docstring 迁移（+scheduler/+backend）；behav_imp_weight_cap 是已删除
  # legacy 键，必须 ~ 删掉否则 to_structured_cfg 报错；相对导入需 python -m
  # 启动（run_example.sh 已处理）；yaml 已写 weight_update_mode: disk。
  # worker 硬编码 model="default"（TRT-LLM 约定，workflow.py:102）而 vLLM 按
  # 模型路径名服务→404→loss weight 0 断言死；vLLMConfig 无 served_model_name
  # 透传，修法=setup 第 9 步建 TARGET_ROOT/default 软链 + vllm.model=default
  # （vLLM 以 --model 原始字符串为 served name）。
  - path: examples/scaffolding/gsm8k_rlvr_scaffolding.py
    profile: areal-scaffold-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/scaffolding/gsm8k_rlvr_scaffolding.yaml
      - +scheduler.type=local
      - cluster.n_gpus_per_node=2
      - +rollout.backend=vllm:d1p1t2
      - +rollout.setup_timeout=1800
      - +actor.backend=fsdp:d2p1t1
      - +ref.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - ~actor.behav_imp_weight_cap
      - actor.path=${AREAL_MODEL_PATH}
      - vllm.model=default
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
  # OpenAI Agents SDK 多 agent handoff GRPO（独有覆盖面）：LLM 调用全走本地
  # vLLM，openai-agents 是 AReaL 声明依赖；gconfig 无 max_new_tokens 键用 +
  - path: examples/openai_agents/train_agents.py
    profile: areal-agents-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/openai_agents/config.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - +rollout.setup_timeout=1800
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - actor.mb_spec.max_tokens_per_mb=1024
      - ref.mb_spec.max_tokens_per_mb=1024
      - vllm.gpu_memory_utilization=0.3
      - +gconfig.max_new_tokens=64
      - gconfig.max_tokens=256
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
    timeout_minutes: 60
unsupported:
  # UPSTREAM_BUG：clevr SFT loader 读错 processor 键名、且不判空。
  # transformers 5.x 起 Qwen-VL 处理器把该字段放在 mm_token_type_ids（Qwen2-VL /
  # Qwen2.5-VL 的 processor model_input_names 都含 mm_token_type_ids，默认
  # return_mm_token_type_ids=True）；token_type_ids 是旧版键名。而
  # areal/dataset/clevr_count_70k.py:110 写的是
  #   example["mm_token_type_ids"] = processed_input.get("token_type_ids", None)
  # → 恒取到 None → areal/utils/data.py:173 collate_samples_to_list 里
  # torch.tensor(None) 报 "Could not infer dtype of NoneType"（dataloader worker 内）。
  # 同仓 areal/dataset/geometry3k.py:148-150 的写法是对的（判 "mm_token_type_ids"
  # in processed_input + 读 mm_token_type_ids）。AReaL 自己钉
  # transformers>=5.0.0,<=5.3.0（pyproject.toml:52），即在它自己的栈上必崩，看护侧
  # 没有对应开关可绕（也不能为单条 profile 降 transformers<5）。上游修法一行（照
  # geometry3k）：
  #   if "mm_token_type_ids" in processed_input:
  #       example["mm_token_type_ids"] = processed_input["mm_token_type_ids"].squeeze(0)
  # 修好后回迁：profile areal-clevr-sft 与 setup 第 10 步（CLEVR 子集）保留未删。
  - examples/vlm/clevr_count_70k_sft.py
  # UPSTREAM_BUG：配置类 AgentRLConfig 定义在入口脚本，跨进程反序列化失败
  - examples/camel/train.py
  # UPSTREAM_BUG：rw_engine.py:52/68 在 train_batch 打包前读 data["cu_seqlens"]，
  # 此时 batch 是 padding 格式（只有 attention_mask），必然 KeyError
  - examples/alignment/hhrlhf_rw.py
  # UPSTREAM_BUG：dpo_pair_logratios 的序列聚合硬编码 fp64（functional.py:698，
  # 为长对精度设计），Ascend 不支持 fp64 计算
  - examples/alignment/hhrlhf_dpo.py
  # CodeAgent 硬依赖 OPENAI + DAYTONA 外部凭据；且仓内无 config yaml
  - examples/code/train.py
  # mopd：actor.path 是未发布 checkpoint 占位符；leetcode 域走 CodeAgent
  # 外部凭据；16 卡 CP4 形态压不小
  - examples/distillation/mopd/mopd_rl.py
  # UPSTREAM_BUG：reward_fn 传函数对象，RPC JSON 序列化失败（应传点路径）
  - examples/vlm_npu/virl39k_grpo.py
  # math_agent 调外部 LLM，需 API key
  - examples/agent_workflow/train.py
  # 常驻服务 demo：需 API key + 交互 stdin，无 pass/fail 终点
  - examples/agent_service/run_agent_service.py
  # 多节点 ray + 带外 user simulator（独立 30B vLLM 服务）+ fork 版
  # tau2-bench + 本地数据
  - examples/tau2/train.py
  # task 环境靠 docker compose，需挂宿主 docker.sock——CI 引擎零挂载；
  # 另需 sglang[srt_npu]/camel_ai/terminal_bench 一串依赖
  - examples/terminal_bench/train.py
  # docstring 自述需 SERPER_KEY_ID（外部搜索 API）+ LLM judge
  - examples/scaffolding/search_scaffolding.py
  # README 要求 SERPER/JINA key，且需先起 72B judge SGLang 服务
  - examples/search_agent/tongyi_deepresearch/train.py
  # online RL：外部流量经 gateway 驱动，无固定终点
  - examples/openclaw/train.py
  # gateway 起后等外部流量（rollout_batch(data=None)），无人交互永久挂起
  - examples/experimental/inference_service/online_rollout.py
