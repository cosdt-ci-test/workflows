  # camel-ai 的 ChatAgent 多轮 GRPO（GSM8K）。两处不同于常规条目：AgentRLConfig
  # 定义在入口脚本，必须以 `python -m examples.camel.train` 启动（run_example.sh
  # 的 camel 分支）——否则 __module__ 为 "__main__"，跨进程序列化找不到该类；
  # camel-ai 非 AReaL 声明依赖，由 setup 的 areal-camel-grpo profile 另装。
  - path: examples/camel/train.py
    profile: areal-camel-grpo
    runner: linux-aarch64-a2-2
    npu_devices: '0,1'
    image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
    overlay_args:
      - --config examples/camel/config.yaml
      - scheduler.type=local
      - cluster.n_gpus_per_node=2
      - rollout.backend=vllm:d1p1t2
      - actor.backend=fsdp:d2p1t1
      - +actor.fsdp.offload_params=true
      - +actor.weight_update_mode=disk
      - actor.path=${AREAL_MODEL_PATH}
      - vllm.gpu_memory_utilization=0.3
      - gconfig.max_new_tokens=64
      - gconfig.n_samples=1
      - train_dataset.batch_size=2
      - valid_dataset.batch_size=2
      - +train_dataset.setup_timeout=600
      - +valid_dataset.setup_timeout=600
      - +total_train_steps=1
      - seed 42
    timeout_minutes: 60
unsupported:
  # clevr SFT：与 geometry3k 同款 VLM 数据集，但 SFT 路径必崩，无 patch 绕不过：
  # 1) loader 读错 processor 键名——areal/dataset/clevr_count_70k.py:110 用
  #    processed_input.get("token_type_ids", None)（旧键），transformers 5.x 已改名
  #    mm_token_type_ids，恒取到 None；
  # 2) SFT 会把样本过 collate_samples_to_list（areal/utils/data.py:172）；该键不是
  #    multi_modal_input* 且值为 None → torch.tensor(None) 报 "Could not infer dtype
  #    of NoneType"（dataloader worker 内）；
  # 3) AReaL 自钉 transformers>=5.0.0,<=5.3.0（pyproject.toml:52），只能改上游 loader
  #    源码（改键名/判空）才通——不打 patch 无法绕。
  # 备注：supported 的 geometry3k_grpo 读同一个错键，但 GRPO 不 collate 数据集样本，
  # 故不受影响。修好后回迁：profile areal-clevr-sft 与 setup 第 10 步保留未删。
  - examples/vlm/clevr_count_70k_sft.py
  # hhrlhf RW：引擎在打包前读 cu_seqlens，必 KeyError，无 patch 绕不过：
  # 1) rw_modeling_collate_fn（areal/trainer/rw_trainer.py:61-73）只产 input_ids +
  #    attention_mask，不含 cu_seqlens（其由 train_batch 内部打包时才生成）；
  # 2) RWEngine._train_rw（areal/trainer/rw/rw_engine.py:50-53）先调 _rw_loss_weight
  #    → x["cu_seqlens"]（:21；:53/:69 还读其 device）→ KeyError；
