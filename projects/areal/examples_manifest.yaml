version: 1
scan:
  root: examples
  include_extensions: ['.py', '.sh']
  exclude:
    - '**/test_*'
    - '**/conftest.py'
    - '**/__init__.py'
    - '**/config.py'                  # 配置模块，非可执行 example
    - '**/configs.py'
    - '**/prompts.py'
    - '**/utils.py'
    - '**/reward_score.py'            # countdown 的奖励实现，被 train.py 调用
    - 'examples/scaffolding/core/**'  # scaffolding 的库实现
    - 'examples/scaffolding/fake_tools.py'
    - 'examples/scaffolding/real_tools.py'
    - 'examples/scaffolding/task.py'
    - 'examples/scaffolding/worker.py'
    - 'examples/scaffolding/workflow.py'
    - 'examples/scaffolding/controllers.py'
    - 'examples/scaffolding/search_reward.py'
    - 'examples/search_agent/tongyi_deepresearch/react_agent.py'
    - 'examples/search_agent/tongyi_deepresearch/tool_search.py'
    - 'examples/search_agent/tongyi_deepresearch/tool_visit.py'
    - 'examples/terminal_bench/agent/**'
    - 'examples/terminal_bench/workflow/**'
    - 'examples/terminal_bench/agent_rl_config.py'
    - 'examples/tir/tools/**'
    - 'examples/tir/tool_manager.py'
    - 'examples/tir/tir_workflow.py'
    - 'examples/tau2/agent.py'
    - 'examples/tau2/utils.py'
    - 'examples/openclaw/_fmt.py'
    - 'examples/openclaw/demo_lifecycle.py'
    - 'examples/openclaw/set_reward.py'
    - 'examples/openclaw/start_session.py'
    - 'examples/agent_service/agent.py'
    - 'examples/multi_turn_vlm/geo3k_env.py'
    - 'examples/docs/debug/cmp_rollout.py'
    - 'examples/sandbox_daytona/reward_example.py'

# AReaL 的 NPU 支持在 ascend-v1.0.5 分支维护（非 main），需要专用镜像
# ghcr.io/hwvanici/areal_npu:v1.0.5-a2（CANN 9.0.1 / torch 2.10 / torch_npu
# 2.10 / vLLM-Ascend / Megatron-Core / MindSpeed / Megatron-Bridge）。
supported:
  # # Qwen2.5-VL-3B Geometry3K GRPO（双卡；1 卡 OOM，2026-09-27 起双卡测试）
  # - path: examples/vlm/geometry3k_grpo.py
  #   profile: areal-vlm-grpo
  #   runner: linux-aarch64-a2-2
  #   npu_devices: '0,1'
  #   image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
  #   overlay_args:
  #     - --config examples/vlm_npu/qwen2_5_vl_3b_geometry3k_grpo.yaml
  #     - cluster.n_gpus_per_node=2
  #     - rollout.backend=vllm:d1p1t2
  #     - actor.backend=fsdp:d2p1t1
  #     # 双卡首测仍保留（1 卡时代为解 OOM 与同卡 HCCL 组问题所加）：
  #     # offload 缓解 3B 全参 GRPO 与 vLLM 共卡的内存压力；d2p1t1 下 actor 与
  #     # rollout worker 仍共占物理卡，xccl 建不起 HCCL 组（EI0015），用 disk。
  #     - +actor.fsdp.offload_params=true
  #     - +actor.weight_update_mode=disk
  #     - actor.path=${AREAL_MODEL_PATH}
  #     - actor.mb_spec.max_tokens_per_mb=1024
  #     - ref.mb_spec.max_tokens_per_mb=1024
  #     - vllm.gpu_memory_utilization=0.3
  #     - gconfig.max_new_tokens=64
  #     - gconfig.n_samples=1
  #     # Online dataset: keep train_dataset.path / valid_dataset.path at the
  #     # YAML default (hiyouga/geometry3k) so AReaL downloads it through
  #     # HF_ENDPOINT (hf-mirror.com). Raise the data-service setup timeout
  #     # for the cold first-time download.
  #     - train_dataset.batch_size=2
  #     - valid_dataset.batch_size=2
  #     - +train_dataset.setup_timeout=600
  #     - +valid_dataset.setup_timeout=600
  #     - +total_train_steps=1
  #   timeout_minutes: 60
  #
  # # Qwen3-VL-2B-Instruct Geometry3K 多轮 tool-calling GRPO（双卡；1 卡 OOM，
  # # 2026-09-27 起双卡测试）。offload + disk + 关 mean 归约与上面 geometry3k
  # # 那条同理保留。env_factory 是字符串点路径（可 JSON 序列化），不同于
  # # virl39k 的函数对象 bug。
  # - path: examples/multi_turn_vlm/geometry3k_grpo_mt.py
  #   profile: areal-vlm-mt-grpo
  #   runner: linux-aarch64-a2-2
  #   npu_devices: '0,1'
  #   image: ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2
  #   overlay_args:
  #     - --config examples/multi_turn_vlm/qwen3_vl_2b_geometry3k_grpo_mt.yaml
  #     - scheduler.type=local
  #     - cluster.n_gpus_per_node=2
  #     - rollout.backend=vllm:d1p1t2
  #     - actor.backend=fsdp:d2p1t1
  #     # 双卡首测仍保留，理由同 geometry3k 那条（optimizer-state OOM + 共卡
  #     # xccl 建不起 HCCL 组）。max_tokens_per_mb 不要低于 1024：它同时是
  #     # workflow 的 max_tokens_per_traj，一张 448x448 图的视觉 token 就可能超过它。
  #     # reward_norm/adv_norm 批级归约走 float64，HCCL 不支持 double allreduce，
  #     # 故关掉 mean 归约（std_level 本就是 null）。
  #     - +actor.fsdp.offload_params=true
  #     - +actor.weight_update_mode=disk
  #     - actor.reward_norm.mean_level=null
  #     - actor.adv_norm.mean_level=null
  #     - actor.path=${AREAL_MODEL_PATH}
  #     - actor.mb_spec.max_tokens_per_mb=1024
  #     - ref.mb_spec.max_tokens_per_mb=1024
  #     - vllm.gpu_memory_utilization=0.3
  #     - gconfig.n_samples=1
  #     - gconfig.max_new_tokens=64
  #     - max_turns=2
  #     # Online dataset: keep the YAML default path (hiyouga/geometry3k); AReaL
  #     # downloads it through HF_ENDPOINT (hf-mirror.com). Raise the
  #     # data-service setup timeout for the cold first-time download.
  #     - train_dataset.batch_size=2
  #     - valid_dataset.batch_size=2
  #     - +train_dataset.setup_timeout=600
  #     - +valid_dataset.setup_timeout=600
  #     - +total_train_steps=1
  #   timeout_minutes: 60
  # # GSM8K GRPO（Qwen2.5-1.5B-Instruct，上游 NPU 专用配置 gsm8k_grpo_npu.yaml）。
  # # math 系 yaml 的 scheduler.type 均为 null，单控制器模式直接 NotImplementedError，
