version: 1
scan:
  root: examples
  include_extensions: ['.py', '.sh']
  # files-only 模式（docs/examples-guard-engine.md §2.7）：scan 只保留
  # root + include_extensions 两个键；实现模块、上游自测等一律进
  # unsupported 段（带分组注释与理由）。
  # 对账口径：release 树（当前 v2.1.0）114 个 .py/.sh =
  # supported(11) + unsupported(103)。

# 看护 release 线（workflow target_ref 留空，由引擎按 latest release
# 解析）。supported 配方用专用镜像 ghcr.io/hwvanici/areal_npu:v1.0.5-a2
# （国内源 ghcr.nju.edu.cn/hwvanici/areal_npu:v1.0.5-a2）；镜像内的
# vllm 栈由 setup_example.sh §1b 换装 0.22.1 线以匹配 v2.x 代码布局。
# 通用配方：
# - 双卡 colocate：rollout vllm:d1p1t2 + actor fsdp:d2p1t1；offload 解
#   optimizer-state OOM，disk 权重同步解共卡 xccl 建不起 HCCL 组（EI0015）。
# - weight_update_mode：yaml 没写的用 + 新增，已写 xccl 的用 ++ 覆盖。
# - scheduler.type=null 的 yaml（math 系）必须补 scheduler.type=local。
# - norm：reward=group + adv=batch 实测可过；reward/adv 为 batch 级的需加
#   mean_level=null（HCCL 不支持 float64 allreduce）。
# - setup_timeout=600 兜底数据集在线冷下载（HF_ENDPOINT=hf-mirror.com）。
# - rollout.setup_timeout 默认仅 300s，vLLM-Ascend 多模态 server 预热（mm
#   processor warmup + tokenizer 深拷贝）在慢机上会超，RL 条目统一
#   +rollout.setup_timeout=1800 兜底。
