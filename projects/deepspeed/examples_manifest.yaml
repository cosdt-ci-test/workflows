version: 1
scan:
  root: training
  include_extensions: ['.sh', '.py']
supported:
  - path: training/HelloDeepSpeed/run_ds.sh
    profile: deepspeed
    runner: linux-aarch64-a2-4
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --num_layers 2
      - --num_heads 2
      - --h_dim 64
      - --ff_dim 128
      - --batch_size 2
      - --num_iterations 10
      - --log_every 5
      - --dtype bf16
    timeout_minutes: 60
unsupported:
  - training/autotuning/hf/bert-base/test_tune.sh
  - training/autotuning/hf/bert-large/test_tune.sh
