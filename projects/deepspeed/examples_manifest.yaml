version: 1
# 主仓 deepspeedai/DeepSpeed 提供被测源码；example 路径相对 deepspeedai/DeepSpeedExamples。
# supported 为当前 NPU CI 看护；unsupported 仅登记尚未接入的 example 入口。
# 库、安装脚本、单元测试、数据准备及结果处理工具不作为 example 登记。
# 扫描无 exclude；同一 example 的启动包装合并到主入口。
scan:
  root: ''
  include_extensions: ['.sh', '.py']
supported:
  # RoBERTa MLM 训练；支持单卡 NPU，2 层模型/10 步验证 ZeRO-1 与 CPU offload。
  - path: training/HelloDeepSpeed/run_ds.sh
    profile: deepspeed
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--num_layers 2'
      - '--num_heads 2'
      - '--h_dim 64'
      - '--ff_dim 128'
      - '--batch_size 2'
      - '--num_iterations 10'
      - '--log_every 5'
      - '--dtype bf16'
    timeout_minutes: 60
  # SFT 训练；支持单卡 NPU，使用本地 OPT-125M 和 8 行数据。
  - path: applications/DeepSpeed-Chat/training/step1_supervised_finetuning
    exec: applications/DeepSpeed-Chat/training/step1_supervised_finetuning/main.py
    profile: ds_chat_sft
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 4'
      - '--per_device_eval_batch_size 4'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--print_loss'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 120
  # 奖励模型训练；支持单卡 NPU，使用本地 OPT-125M 和小型偏好数据。
  - path: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning
    exec: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning/main.py
    profile: ds_chat_rw
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 4'
      - '--per_device_eval_batch_size 4'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 120
  # DPO 偏好训练；支持单卡 NPU，使用本地 OPT-125M 和小批量数据。
  - path: applications/DeepSpeed-Chat/training/step2_dpo_finetuning
    exec: applications/DeepSpeed-Chat/training/step2_dpo_finetuning/main.py
    profile: ds_chat_dpo
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--num_train_epochs 1'
      - '--per_device_train_batch_size 2'
      - '--per_device_eval_batch_size 2'
      - '--max_seq_len 128'
      - '--zero_stage 2'
      - '--dtype bf16'
      - '--beta 0.1'
      - '--deepspeed'
      - '--output_dir ${CI_OUTPUT_DIR}'
    timeout_minutes: 150
  # RLHF 训练；支持单卡 NPU，OPT-125M actor/critic 使用官方 5 步测试模式。
  - path: applications/DeepSpeed-Chat/training/step3_rlhf_finetuning
    exec: applications/DeepSpeed-Chat/training/step3_rlhf_finetuning/main.py
    profile: ds_chat_rlhf
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--actor_model_name_or_path ${OPT_125M_PATH}'
      - '--critic_model_name_or_path ${OPT_125M_PATH}'
      - '--data_path local/jsonfile'
      - '--enable_test_mode'
      - '--test_stop_step 5'
      - '--actor_zero_stage 2'
      - '--critic_zero_stage 2'
      - '--dtype bf16'
      - '--deepspeed'
    timeout_minutes: 180
  # 文本生成；支持 NPU 上的 HF baseline，本地 OPT-125M 绕过 DS kernel 注入。
  - path: inference/huggingface/text-generation/inference-test.py
    profile: ds_infer
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model ${OPT_125M_PATH}'
      - '--hf_baseline'
      - '--dtype float32'
      - '--max_new_tokens 8'
    timeout_minutes: 60
  # CIFAR-10 分类；支持单卡 NPU，上游 launcher 配合 ModelScope 预置数据。
  - path: training/cifar
    exec: training/cifar/run_ds.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 90
  # ZeRO 状态 offload；支持单卡 NPU，使用小模型和合成数据。
  - path: training/offload_states/offload_states.py
    profile: deepspeed
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--hidden_dim 1024'
      - '--nlayers 2'
    timeout_minutes: 60
  # CIFAR MoE 训练；支持两卡 HCCL/EP=2，局部禁用 torch.compile 避开 Triton 依赖。
  - path: training/cifar/run_ds_moe.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 120
  # AutoTP loss 等价性；支持四卡 NPU，Qwen3-0.6B 验证 TP=1/3/4 各 5 步。
  - path: training/autotp_equivalence
    exec: training/autotp_equivalence/train.py
    profile: ds_autotp_equivalence
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${QWEN3_06B_PATH}'
      - '--steps 5'
      - '--seq_len 32'
      - '--micro_batch_size 1'
      - '--log_every 1'
    timeout_minutes: 180

  # HF Trainer AutoTP；八卡 TP=8、本地模型和 fixture，3 步含 2 步预热，已通过 #28。
  - path: training/tensor_parallel/hf_integration/train.py
    profile: ds_hf_autotp
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path ${ALPACA_CI_PATH}'
      - '--output_dir ${CI_OUTPUT_DIR}/hf-autotp'
      - '--max_steps 3'
      - '--model_max_length 128'
      - '--per_device_train_batch_size 1'
      - '--gradient_accumulation_steps 1'
      - '--learning_rate 2e-5'
      - '--warmup_steps 2'
      - '--logging_steps 1'
      - '--eval_strategy no'
      - '--save_strategy no'
      - '--report_to none'
      - '--bf16 True'
      - '--tf32 False'
      - '--gradient_checkpointing False'
      - '--dataloader_pin_memory False'
      - '--dataloader_num_workers 0'
    timeout_minutes: 120
  # CIFAR PR-MoE；两卡 EP=2、残差专家 2/4，eager MoE 已通过 #27。
  - path: training/cifar/run_ds_prmoe.sh
    profile: ds_cifar
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--epochs 1'
      - '--log-interval 50'
      - '--dtype bf16'
      - '--stage 0'
    timeout_minutes: 120
  # 动态 batch/LR；单卡合成序列打包及 2 epoch，已通过 #27。
  - path: training/data_efficiency/variable_batch_size_and_lr/variable_batch_size_and_lr_example.py
    profile: ds_variable_batch
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--pipeline-num-stages 0'
    timeout_minutes: 60
  # ZenFlow offload；两卡 256 维/2 层合成数据，6 次迭代已通过 #27。
  - path: training/DeepSpeed-ZenFlow/benchmark/zf_benchmark.py
    profile: ds_zenflow
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--hidden_dim 256'
      - '--nlayers 2'
      - '--iteration 3'
      - '--dtype torch.bfloat16'
      - '--pin_memory_opts 0'
      - '--topk_ratios 0.1'
      - '--update_intervals 2'
      - '--overlap_steps 0'
    timeout_minutes: 90
  # Wanda 校准剪枝；NPU 本地 OPT-125M/JSONL，4×32 token 校准已通过 #27。
  - path: compression/reasoning_aware_compression/prune.py
    profile: ds_rac_prune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model ${OPT_125M_PATH}'
      - '--device npu'
      - '--dtype float32'
      - '--pruning-method wanda'
      - '--calibration prompt'
      - '--dataset ${RAC_CI_PATH}'
      - '--prompt-column prompt'
      - '--no-chat-template'
      - '--nsamples 4'
      - '--seqlen 32'
      - '--batch-size 1'
      - '--scope all'
      - '--layer-thirds 1'
      - '--sparsity 0.5'
      - '--output ${CI_OUTPUT_DIR}/rac-pruned'
      - '--save-report'
    timeout_minutes: 90

  # SFT 生成评测；单卡先训练小检查点，再对比基础/微调模型，8 token，待实跑。
  - path: applications/DeepSpeed-Chat/training/step1_supervised_finetuning/prompt_eval.py
    profile: ds_chat_prompt_eval
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path_baseline ${OPT_125M_PATH}'
      - '--model_name_or_path_finetune ${CI_OUTPUT_DIR}/prompt-eval-sft'
      - '--max_new_tokens 8'
      - '--language English'
    timeout_minutes: 120
  # 奖励评分 smoke；单卡本地 OPT-125M/初始化评分头，两组偏好 forward，待实跑。
  - path: applications/DeepSpeed-Chat/training/step2_reward_model_finetuning/rw_eval.py
    profile: ds_chat_reward_eval
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--num_padding_at_beginning 1'
    timeout_minutes: 60
  # 固定长度 HF AutoTP；八卡 TP=8/序列 128/3 步，校验 padding 与 label masking，待实跑。
  - path: training/tensor_parallel/hf_integration/train_bench_length.py
    profile: ds_hf_bench_length
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name_or_path ${OPT_125M_PATH}'
      - '--data_path ${ALPACA_CI_PATH}'
      - '--output_dir ${CI_OUTPUT_DIR}/hf-bench-length'
      - '--max_steps 3'
      - '--model_max_length 128'
      - '--per_device_train_batch_size 1'
      - '--gradient_accumulation_steps 1'
      - '--learning_rate 2e-5'
      - '--warmup_steps 2'
      - '--logging_steps 1'
      - '--eval_strategy no'
      - '--save_strategy no'
      - '--report_to none'
      - '--bf16 True'
      - '--tf32 False'
      - '--gradient_checkpointing False'
      - '--dataloader_pin_memory False'
      - '--dataloader_num_workers 0'
    timeout_minutes: 120
  # SuperOffload 入口；两卡 ZeRO-Offload 模式/CPU 参数和优化器卸载，3 步，待实跑。
  - path: training/DeepSpeed-SuperOffload/finetune_zero3.py
    profile: ds_superoffload
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - '--model_name ${OPT_125M_PATH}'
      - '--dataset_name ${ALPACA_DATASET_DIR}'
      - '--lr 0.001'
      - '--batch_size 1'
      - '--num_train_epochs 1'
      - '--max_length 128'
      - '--bench_steps 3'
      - '--warmup_steps 1'
      - '--attn_implementation eager'
      - '--output_dir ${CI_OUTPUT_DIR}/superoffload'
    timeout_minutes: 120

unsupported:
  # BF16 主权重训练对比；torch.cuda 和 CUDA autocast 硬绑定。
  - training/bf16_master_weight/train.py
  # CIFAR/AlexNet 流水线训练；硬绑定 CUDA 设备和 NCCL。
  - training/pipeline_parallelism/train.py
  # SFT/RW/RLHF 全流程编排；上游配方依赖大模型及多 GPU/NCCL。
  - applications/DeepSpeed-Chat/e2e_rlhf.py
  # 交互式文本聊天；pipeline 硬编码 cuda:0，需已训练模型。
  - applications/DeepSpeed-Chat/inference/chatbot.py
  # 交互式视觉聊天；硬绑定 .cuda()，需 Llama-2/视觉模型检查点。
  - applications/DeepSpeed-VisualChat/chat/chat.py
  # 视觉聊天批量评测；硬绑定 .cuda()，需预训练检查点。
  - applications/DeepSpeed-VisualChat/eval/batch_generation.py
  # 视觉聊天训练；硬绑定 CUDA，需 Llama-2、CLIP 和大规模图文数据。
  - applications/DeepSpeed-VisualChat/training/main.py
  # AutoSP 正确性矩阵编排；依赖多卡训练及 loss 校验，尚未适配。
  - benchmarks/autosp/correctness/correctness.sh
  # AutoSP loss 采集；硬编码 Llama-2-7B，需受限模型和多卡环境。
  - benchmarks/autosp/correctness/correctness_run.py
  # 序列并行训练；硬绑定 torch.cuda，默认 Llama-2-7B，尚未适配。
  - benchmarks/autosp/run.py
  # all_gather 吞吐基准；torch.cuda.Event 计时硬绑定 CUDA。
  - benchmarks/communication/all_gather.py
  # all_reduce 吞吐基准；torch.cuda.Event 计时硬绑定 CUDA。
  - benchmarks/communication/all_reduce.py
  # all_to_all 吞吐基准；torch.cuda.Event 计时硬绑定 CUDA。
  - benchmarks/communication/all_to_all.py
  # broadcast 吞吐基准；torch.cuda.Event 计时硬绑定 CUDA。
  - benchmarks/communication/broadcast.py
  # 双 rank 点对点吞吐基准；torch.cuda.Event 计时硬绑定 CUDA。
  - benchmarks/communication/pt2pt.py
  # 多算子通信基准汇总；硬绑定 CUDA 计时，非训练验证。
  - benchmarks/communication/run_all.py
  # 大模型编译吞吐基准；需多机、CUDA 和 Llama/Mixtral 大模型。
  - benchmarks/deepcompile/run_bench_lm.py
  # BERT fill-mask 延迟基准；仅测推理性能，尚未纳入看护。
  - benchmarks/inference/bert-bench.py
  # 推理服务并发压测；依赖外部服务或 MII/vLLM，未接入。
  - benchmarks/inference/deepspeedometer/src/deepspeedometer/benchmark_runner.py
  # GPT 延迟基准；上游扫描 CUDA kernel/graph 和大模型，未适配。
  - benchmarks/inference/gpt-bench.py
  # MII 推理吞吐压测；需 MII/vLLM/AzureML 后端及大模型。
  - benchmarks/inference/mii/run_benchmark.py
  # BERT Triton 延迟基准；硬绑定 torch.cuda/NCCL 与 CUDA kernel。
  - benchmarks/inference/triton-bert-benchmark.py
  # HybridEngine rollout 性能基准；默认 OPT-6.7B，超出 CI 规模。
  - benchmarks/opsd/benchmark_hybrid_engine_rollout.py
  # BERT GLUE 蒸馏压缩；硬绑定 torch.cuda.set_device。
  - compression/bert/run_glue_lkd.py
  # BERT GLUE 剪枝/量化训练；硬绑定 torch.cuda.set_device。
  - compression/bert/run_glue_no_trainer.py
  # CIFAR 通道剪枝训练；model/data.cuda() 硬绑定 CUDA。
  - compression/cifar/train.py
  # GPT-2 ZeroQuant 量化；硬绑定 CUDA 设备，需适配。
  - compression/gpt2/run_clm_no_trainer.py
  # MATH-500 评测；需 lighteval/vLLM 和剪枝后检查点。
  - compression/reasoning_aware_compression/bash_script/eval_math500.sh
  # 推理轨迹采样；默认大规模长文本生成，需裁剪数据和后端适配。
  - compression/reasoning_aware_compression/collect_traces.py
  # NVMe 读取带宽扫描包装；需 NVMe 盘及编译 IO 算子。
  - deepnvme/ds_io/ds_io_read_sweep.sh
  # NVMe 读写带宽扫描；需 NVMe 盘和 GDS/async_io 支持。
  - deepnvme/ds_io/ds_io_sweep.sh
  # NVMe 写入带宽扫描包装；需 NVMe 盘及编译 IO 算子。
  - deepnvme/ds_io/ds_io_write_sweep.sh
  # async_io 加载 CPU 张量；需 NVMe 盘和编译 async_io。
  - deepnvme/file_access/aio_load_cpu_tensor.py
  # async_io 加载 GPU 张量；需 NVMe 盘和编译 async_io。
  - deepnvme/file_access/aio_load_gpu_tensor.py
  # async_io 存储 CPU 张量；需 NVMe 盘和编译 async_io。
  - deepnvme/file_access/aio_store_cpu_tensor.py
  # async_io 存储 GPU 张量；需 NVMe 盘和编译 async_io。
  - deepnvme/file_access/aio_store_gpu_tensor.py
  # GDS 加载 GPU 张量；需 NVMe 盘及 GPUDirect Storage。
  - deepnvme/file_access/gds_load_gpu_tensor.py
  # GDS 存储 GPU 张量；需 NVMe 盘及 GPUDirect Storage。
  - deepnvme/file_access/gds_store_gpu_tensor.py
  # Python 加载 CPU 张量；NVMe IO 演示需专用存储硬件。
  - deepnvme/file_access/py_load_cpu_tensor.py
  # Python 加载 GPU 张量；NVMe IO 演示需专用存储硬件。
  - deepnvme/file_access/py_load_gpu_tensor.py
  # Python 存储 CPU 张量；NVMe IO 演示需专用存储硬件。
  - deepnvme/file_access/py_store_cpu_tensor.py
  # Python 存储 GPU 张量；NVMe IO 演示需专用存储硬件。
  - deepnvme/file_access/py_store_gpu_tensor.py
  # DeepSpeed 检查点存储基准；需 NVMe 盘及 async_io/GDS。
  - deepnvme/model_checkpoint/deepspeed_save_model.py
  # safetensors 检查点存储对比；需 NVMe 盘。
  - deepnvme/model_checkpoint/torch_save_load_model.py
  # torch 检查点存储基准；需 NVMe 盘及 GDS/async_io。
  - deepnvme/model_checkpoint/torch_save_model.py
  # 张量存储基准；需 NVMe 盘及 GDS/async_io。
  - deepnvme/model_checkpoint/torch_save_tensor.py
  # HumanEval 代码生成评测；硬绑定 CUDA，需 MII、7B 模型及评测数据。
  - evaluation/inference/human_eval/run_human_eval.py
  # Wav2Vec2 语音识别；硬编码模型及 LibriSpeech，缺少 CI 缩规模接口。
  - inference/huggingface/automatic-speech-recognition/test-wav2vec2.py
  # BERT fill-mask 推理；默认四卡并含 CUDA graph/Triton 路径，待适配。
  - inference/huggingface/fill-mask/test-bert.py
  # ELECTRA fill-mask 推理；硬编码四卡 TP，无 CLI 缩规模接口。
  - inference/huggingface/fill-mask/test-electra.py
  # RoBERTa fill-mask 推理；硬编码四卡 TP，无 CLI 缩规模接口。
