version: 1
scan:
  root: examples
  # .yaml is not scanned: the files under examples/ are deepspeed/accelerate
  # run configs, not launchable examples. .md/.txt/.json are non-examples.
  include_extensions: ['.py', '.sh']
  # files-only 模型（docs/examples-guard-engine.md §2.7）。exclude 项为目录
  # 路径（递归剪枝）或 glob（`**` 跨目录，匹配相对 target root 的路径），
  # 排除"不是 example 的配套物"：上游自测、helper 模块、入口背后的实现文件。
  # 扫描工具的 exclude 支持随发现 workflow 的 PR 落地；examples 引擎不扫描，
  # 本段当前只是声明。
  exclude:
    - '**/test_*'                    # 上游自测（test_dreambooth*.py 等）
    - '**/conftest.py'
    - '**/__init__.py'
    - '**/utils.py'                  # 单文件 helper
    - '**/utils/**'                  # helper 模块目录
    - '**/profiling_utils.py'
    - '**/discriminator.py'          # train_vqgan.py 的判别器实现
    - examples/research_projects/anytext/ocr_recog/**        # anytext 的 OCR 实现
    - examples/research_projects/promptdiffusion/pipeline_prompt_diffusion.py
    - examples/research_projects/promptdiffusion/promptdiffusioncontrolnet.py
    - examples/research_projects/pixart/pipeline_pixart_alpha_controlnet.py
    - examples/research_projects/gligen/dataset.py
    - examples/research_projects/gligen/make_datasets.py
    - examples/research_projects/rdm/retriever.py
    - examples/research_projects/wuerstchen/text_to_image/modeling_efficient_net_encoder.py
    # helper 模块 / 数据处理 / 被其它脚本调用（NOT_EXAMPLE，不单独 guard）
    - examples/research_projects/anytext/anytext.py
    - examples/research_projects/anytext/anytext_controlnet.py
    - examples/research_projects/lpl/lpl_loss.py
    - examples/research_projects/multi_token_textual_inversion/multi_token_clip.py
    - examples/research_projects/pixart/controlnet_pixart_alpha.py
    - examples/research_projects/promptdiffusion/convert_original_promptdiffusion_to_diffusers.py
    - examples/research_projects/rdm/pipeline_rdm.py
    - examples/server-async/Pipelines.py
    - examples/cosmos/create_prompts_for_gr1_dataset.py
    - examples/cosmos/download_and_preprocess_datasets.sh
    - examples/cosmos3/cosmos_parallel.py
    - examples/dreambooth/convert_to_imagefolder.py   # 纯转换脚本（image+txt -> metadata.jsonl），非 example
    # 非可执行 example：外部服务 / 废弃 shim / 库模块 / HTTP 客户端
    - examples/custom_diffusion/retrieve.py            # clip_retrieval 查外部 knn.laion.ai
    - examples/inference/image_to_image.py             # 废弃 shim（无 __main__）
    - examples/inference/inpainting.py                 # 废弃 shim（无 __main__）
    - examples/model_search/pipeline_easy.py           # 库模块（无 main），调 civitai API
    - examples/server-async/test.py                    # HTTP 客户端，需 serverasync.py 常驻

