  # CogVideoX-5b-I2V LoRA（复用 Disney 数据集；2026-09-21 昇腾机验证可跑）
  # 注意：必须用 THUDM/CogVideoX-5b-I2V（不是 1.5，脚本不处理 1.5 的 ofs 输入）。
  - path: examples/cogvideo/train_cogvideox_image_to_video_lora.py
    profile: diffusers-cogvideo-i2v
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --pretrained_model_name_or_path THUDM/CogVideoX-5b-I2V
      - --instance_data_root ${COGVIDEOX_DATASET_DIR}
      - --caption_column prompt.txt
      - --video_column videos.txt
      - --max_num_frames 9
      - --gradient_checkpointing
      - --enable_slicing --enable_tiling
      - --train_batch_size 1
      - --max_train_steps 1
      - --checkpointing_steps 1
      - --mixed_precision fp16
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 180

