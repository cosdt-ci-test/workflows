version: 1
# Liger-Kernel examples ledger. The tested tree is the release the shared
# engine resolves (linkedin/Liger-Kernel latest release; v0.8.3 at the time
# of writing), and setup installs Liger from that same checkout, so kernel
# source and examples always come from one release.
#
# v0.8.3 already ships an Ascend NPU backend
# (src/liger_kernel/ops/backends/_ascend/, selected by device) plus an
# infer_device()/infer_comm_backend() abstraction that returns "npu"/"hccl".
# Upstream's README pins the NPU stack (torch==2.9.0, torch_npu==2.9.0,
# triton-ascend==3.2.2, CANN==9.1.0) and links Huawei's own Ascend CI
# (Ascend/Ascend-CI/.github/workflows/liger_kernel.yml), whose recipe this
# project's setup_example.sh follows.
#
# supported lists entries whose upstream source, read statically, can run
# unchanged on a single Ascend NPU with CI-sized CLI overrides. Unsupported
# entries each carry a one-line Chinese reason.
scan:
  root: examples
  include_extensions: ['.py', '.sh']

supported:
  # 单卡 HuggingFace Trainer SFT：用 AutoLigerKernelForCausalLM 一行 monkey-patch 应用
  # Liger 内核（SwiGLU/RMSNorm/RoPE/FusedLinearCrossEntropy），trl SFTTrainer 训练；
  # 无 CUDA/FSDP 依赖，设备由 accelerate 自动落 npu；规模靠 --max_steps/--model_name/
  # --dataset/--per_device_train_batch_size 压缩，模型走 ModelScope、数据用仓内 8 行 fixture。
  # --include_num_input_tokens_seen 与 --logging_steps 1 是 example 自带 EfficiencyCallback
  # 的硬性要求（缺任一 on_init_end 直接抛异常）。
  - path: examples/huggingface/training.py
    profile: liger_hf_trainer
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: ['--model_name ${LIGER_MODEL_PATH}', '--dataset ${LIGER_DATASET_PATH}', '--max_steps 3', '--per_device_train_batch_size 2', '--max_seq_length 256', '--eval_strategy no', '--save_strategy no', '--report_to none', '--logging_steps 1', '--include_num_input_tokens_seen', '--use_liger True', '--output_dir ${CI_OUTPUT_DIR}/hf_trainer']
    timeout_minutes: 180
  # 单卡 Medusa 多头重训：冻结 backbone、注入 medusa heads，用 Liger 的
  # fused_linear_cross_entropy 训练多 token 预测头（--medusa_return True 才走 Liger loss）。
  # HfArgumentParser 全参数可覆盖，设备经 callback 的 infer_device() 落 npu，无 CUDA 硬编码。
  # 规模必须压到 1 步：example 自带 callback 的 MFU 分支 _get_gpu_peak_tflops 只认
  # A100/H100/V100，Ascend 上返回 None 会让第 2 步的 TFLOPS 除法崩溃；warmup 步数 2 内
  # 提前 return，故 max_steps 1 安全（改大即触发，属上游代码问题）。
  - path: examples/medusa/train.py
    profile: liger_medusa
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args: ['--model_name_or_path ${LIGER_MODEL_PATH}', '--data_path ${LIGER_FIXTURE_JSON}', '--max_steps 1', '--model_max_length 256', '--per_device_train_batch_size 2', '--eval_strategy no', '--save_strategy no', '--report_to none', '--logging_steps 1', '--include_num_input_tokens_seen', '--medusa_num_heads 2', '--medusa_return True', '--lazy_preprocess False', '--use_liger True', '--output_dir ${CI_OUTPUT_DIR}/medusa']
    timeout_minutes: 180

unsupported:
  - examples/alignment/run_orpo.py  # ORPO 对齐示例：无 argparse，max_steps/batch 全硬编码在源码里无法从 CI 压缩，且模型写死 gated 的 meta-llama/Llama-3.2-1B-Instruct，需改源码才能接入。
  - examples/huggingface/training_multimodal.py  # Qwen2-VL 多模态 SFT：需 Qwen2-VL 权重与 the_cauldron 图文数据，且 SFTTrainer 的 tokenizer/collate 路径在 trl 新版已改签名，暂缓。
  - examples/huggingface/callback.py  # training.py 吞吐/显存回调，被其 import，非独立入口。
  - examples/huggingface/launch_on_modal.py  # Modal 云平台启动器，非 NPU 本地入口。
  - examples/huggingface/run_benchmarks.sh  # 多模型多 batch 的吞吐基准 sweep 脚本，非单次可验证 example。
  - examples/huggingface/run_gemma.sh  # gemma-7b-it 4 卡 FSDP 启动器，属 run_*.sh 家族的大模型变体，非独立 example。
  - examples/huggingface/run_llama.sh  # Meta-Llama-3-8B 4 卡 FSDP 启动器，模型 gated 且非独立 example。
  - examples/huggingface/run_qwen.sh  # Qwen2-7B 4 卡 FSDP 启动器，非独立 example 入口。
  - examples/huggingface/run_qwen2_vl.sh  # Qwen2-VL-7B 4 卡 FSDP 启动器，非独立 example 入口。
  - examples/lightning/training.py  # Lightning Trainer 示例：pl.Trainer(accelerator=infer_device()) 传 "npu"，而 Lightning 只注册 cpu/cuda/mps/xla，且 torch.optim.AdamW(fused=True) 在 NPU 无 _fused_adamw_ 实现，不改源码无法运行。
  - examples/medusa/medusa_util.py  # medusa heads 注入与 forward 改写工具，被 train.py import，非独立入口。
  - examples/medusa/callback.py  # Medusa 显存/吞吐回调，被 train.py import，非独立入口。
  - examples/medusa/scripts/llama3_8b_medusa.sh  # medusa 官方启动器：用 nvidia-smi 统计卡数且走 accelerate FSDP，非独立入口。
  - examples/megatron/run_mode1_monkey_patch.py  # Megatron-Core monkey-patch 示例：需 2 进程 torchrun 且源码硬编码 torch.cuda.set_device / init_process_group("nccl")，单卡 NPU 无法满足。
  - examples/megatron/run_mode2_hand_spec.py  # Megatron-Core 手工 spec 示例：同样硬编码 CUDA/NCCL 与 2 进程 torchrun，非 NPU 可运行入口。
