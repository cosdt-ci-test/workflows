version: 1
scan:
  root: examples
  include_extensions: ['.py']
supported:
  # Load a public FP8 compressed TinyLlama (~1.2 GB) and generate.
  - path: examples/compressed_inference/fp8_compressed_inference.py
    profile: npu_inference
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 90
  # Data-free FP8 PTQ. Upstream loads on CPU; this profile keeps the
  # job on CPU (no torch_npu) so oneshot is the thing being guarded.
  - path: examples/quantization_w8a8_fp8/llama3_example.py
    profile: cpu
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 90
  # GPTQ W8A8 on Gemma-2-2B. Weights come from ModelScope.
  # NPU assert is after dispatch_model + generate.
  - path: examples/quantization_w8a8_int8/gemma2_example.py
    profile: npu_int8
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 180
  # AutoRound W4A16 on public Qwen3-8B with a custom ultrachat slice.
  - path: examples/autoround/quantization_wNa16/qwen3_example_custom_dataset.py
    profile: npu_autoround
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 180
