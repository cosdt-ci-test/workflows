version: 1
# scan.root is samples. That is the in-tree sample tree (cxx, nodejs).
# The CANN gtest lives under onnxruntime/test/providers/cann, outside this
# root. check_examples_manifest only fails if a supported path is missing
# on disk. new_paths from the scan is informational.
scan:
  root: samples
  # mixed + empty marker. Every first-level directory under samples is a
  # unit, even without CMakeLists.txt. Depth-1 .py files are also units.
  unit: mixed
  marker: ''
  max_depth: 1
  include_extensions: ['.py']
supported:
  - path: onnxruntime/test/providers/cann
    profile: cann-gtest
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    # Upstream partition_provider_test_srcs moves test/providers/* out of
    # onnxruntime_test_all. CannExecutionProviderTest lives here.
    exec: build/Linux/Release/onnxruntime_provider_test
    overlay_args:
      - --gtest_filter=CannExecutionProviderTest.*
    timeout_minutes: 300
  - path: samples/cxx
    profile: cmake-consumer
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: samples/cxx/build/onnxruntime_sample_program
    timeout_minutes: 300
unsupported:
  # Node.js sample needs npm. It does not use the CANN EP.
  - samples/nodejs
