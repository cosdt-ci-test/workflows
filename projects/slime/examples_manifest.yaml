version: 1
# 清单以 Ascend/slime-ascend 的 examples/ 为基准；supported 路径也须存在于 THUDM/slime release。
scan:
  root: examples
  include_extensions: ['.sh', '.py']
supported:
  # run-qwen2.5-0.5B-fully_async.sh：全异步训练；有 fork NPU 测试先例，可压缩到四卡 CI。
  - path: examples/fully_async/run-qwen2.5-0.5B-fully_async.sh
    profile: slime_fully_async
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 300
    overlay_args:
      - "--hf-checkpoint ${SLIME_MODEL_PATH}"
      - "--ref-load ${SLIME_TORCH_DIST_PATH}"
      - "--prompt-data ${SLIME_FIXTURE_JSONL}"
      - "--rollout-function-path slime.rollout.fully_async_rollout.generate_rollout_fully_async"
      - "--input-key prompt"
      - "--label-key label"
      - --apply-chat-template
      - "--rm-type deepscaler"
      - "--rollout-temperature 0.8"
      - "--attention-dropout 0.0"
      - "--hidden-dropout 0.0"
      - "--num-rollout 2"
      - "--rollout-batch-size 4"
      - "--global-batch-size 16"
      - "--rollout-max-response-len 1024"
      - "--n-samples-per-prompt 4"
      - "--actor-num-gpus-per-node 1"
      - "--rollout-num-gpus 3"
      - "--sglang-device npu"
      - "--sglang-mem-fraction-static 0.65"
      - "--sglang-cuda-graph-max-bs 16"
      - "--max-tokens-per-gpu 4096"
      - --use-dynamic-batch-size
      - --sequence-parallel
      - --accumulate-allreduce-grads-in-fp32
      - --attention-softmax-in-fp32
      - "--attention-backend flash"
      - --ci-test

  # run-qwen3-8B-opd.sh：SGLang teacher 的 OPD 蒸馏；有 fork NPU 测试先例，可缩至八卡 CI。
  - path: examples/on_policy_distillation/run-qwen3-8B-opd.sh
    profile: slime_opd
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 300
    overlay_args:
      - "--hf-checkpoint ${SLIME_MODEL_PATH}"
      - "--ref-load ${SLIME_TORCH_DIST_PATH}"
      - --use-dist-ckpt
      - "--prompt-data ${SLIME_FIXTURE_JSONL}"
      - "--input-key prompt"
      - "--label-key label"
      - --apply-chat-template
      - "--custom-rm-path slime.rollout.on_policy_distillation.reward_func"
      - "--custom-reward-post-process-path slime.rollout.on_policy_distillation.post_process_rewards"
      - "--rm-url ${SLIME_TEACHER_URL}"
      - --use-opd
      - "--opd-type sglang"
      - "--opd-kl-coef 1.0"
      - "--rollout-temperature 0.8"
      - "--attention-dropout 0.0"
      - "--hidden-dropout 0.0"
      - "--num-rollout 2"
      - "--rollout-batch-size 4"
      - "--n-samples-per-prompt 4"
      - "--global-batch-size 16"
      - "--rollout-max-response-len 1024"
      - "--actor-num-gpus-per-node 4"
      - "--rollout-num-gpus 3"
      - "--sglang-device npu"
      - "--sglang-mem-fraction-static 0.6"
      - "--sglang-cuda-graph-max-bs 16"
      - "--max-tokens-per-gpu 4096"
      - --use-dynamic-batch-size
      - "--megatron-to-hf-mode bridge"
      - --use-flash-attn
      - "--attention-backend flash"
      - --ci-test

  # retool_qwen3_4b_rl.sh：工具调用强化学习；可复刻 CUDA 启动器，用四卡 NPU 和短 rollout 验证。
  - path: examples/retool/retool_qwen3_4b_rl.sh
    profile: slime_retool
    runner: linux-aarch64-a2-4
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    timeout_minutes: 300
    overlay_args:
      - "--hf-checkpoint ${SLIME_MODEL_PATH}"
      - "--ref-load ${SLIME_TORCH_DIST_PATH}"
      - "--prompt-data ${SLIME_FIXTURE_JSONL}"
      - "--input-key prompt"
      - "--label-key label"
      - --apply-chat-template
      - "--reward-key score"
      - "--custom-generate-function-path generate_with_retool.generate"
      - "--custom-rm-path generate_with_retool.reward_func"
      - "--num-rollout 2"
      - "--rollout-batch-size 4"
      - "--n-samples-per-prompt 2"
      - "--global-batch-size 8"
      - "--rollout-max-response-len 512"
      - "--rollout-max-context-len 2048"
      - "--rollout-temperature 0.8"
      - "--attention-dropout 0.0"
      - "--hidden-dropout 0.0"
      - --colocate
      - "--actor-num-gpus-per-node 4"
      - "--num-gpus-per-node 4"
      - "--tensor-model-parallel-size 2"
      - "--rollout-num-gpus-per-engine 2"
      - "--sglang-device npu"
      - "--sglang-mem-fraction-static 0.65"
      - "--sglang-cuda-graph-max-bs 16"
      - "--max-tokens-per-gpu 4096"
      - --use-dynamic-batch-size
      - "--attention-backend flash"
      - --ci-test

unsupported:
  # __init__.py：标记 examples 包；非独立样例。
  - examples/__init__.py
  # run_qwen36_35b_a3b_swe_8nodes.sh：SWE 编码智能体训练；硬编码八节点和远程 sandbox，CI 无法接入。
  - examples/coding_agent_rl/run_qwen36_35b_a3b_swe_8nodes.sh
  # aiohttp_threaded.py：提供 sandbox 并发工具；非独立样例。
  - examples/coding_agent_rl/aiohttp_threaded.py
  # docker_sandbox.py：提供远程 Docker sandbox 适配；非独立样例。
  - examples/coding_agent_rl/docker_sandbox.py
  # generate.py：提供 SWE 智能体 rollout 和奖励逻辑；非独立样例。
  - examples/coding_agent_rl/generate.py
  # sandbox.py：提供 SWE-bench 环境整备；非独立样例。
  - examples/coding_agent_rl/sandbox.py
  # run-glm4.7-355B-A32B-delta.sh：增量权重同步训练；硬编码 128 卡与共享盘，CI 无法接入。
  - examples/delta_weight_sync/run-glm4.7-355B-A32B-delta.sh
  # multi_task.sh：多任务评测；硬编码数据路径并启用 W&B，需专用 CI 配置后接入。
  - examples/eval_multi_task/multi_task.sh
  # multi_task.yaml：多任务评测数据配置；非独立样例。
  - examples/eval_multi_task/multi_task.yaml
  # run-qwen3.5-9B-fully_async.sh：大模型全异步训练；同路径已有 0.5B 看护，暂不重复接入。
  - examples/fully_async/run-qwen3.5-9B-fully_async.sh
  # run_geo3k_qwen35.sh：Geo3K 视觉语言训练；依赖私有 Megatron-Bridge fork，CI 无法获取。
  - examples/geo3k_vlm/run_geo3k_qwen35.sh
  # run_geo3k_vlm.sh：Geo3K 视觉语言训练；上游 release 缺少此路径，manifest 无法校验。
  - examples/geo3k_vlm/run_geo3k_vlm.sh
  # run_geo3k_vlm_sft.sh：Geo3K SFT；需要预处理数据且暂无 NPU 验证先例。
  - examples/geo3k_vlm/run_geo3k_vlm_sft.sh
  # run_geo3k_vlm_multi_turn.py：多轮 Geo3K 训练；启动逻辑依赖 CUDA，需 NPU 配方。
  - examples/geo3k_vlm_multi_turn/run_geo3k_vlm_multi_turn.py
  # run_grpo_npu.sh：多轮 Geo3K GRPO；硬编码 16 卡和占位路径，暂不能直接接入。
  - examples/geo3k_vlm_multi_turn/run_grpo_npu.sh
  # run_ppo_npu.sh：多轮 Geo3K PPO；硬编码 16 卡和占位路径，暂不能直接接入。
  - examples/geo3k_vlm_multi_turn/run_ppo_npu.sh
  # npu_run_geo3k_vlm_multi_turn_qwen35_9b.sh：多轮 Geo3K NPU 启动器；需 16 卡，超出单机 CI。
  - examples/geo3k_vlm_multi_turn/npu_run_geo3k_vlm_multi_turn_qwen35_9b.sh
  # npu_run_geo3k_vlm_multi_turn_qwen35_9b.py：多轮 Geo3K NPU 配方；需 16 卡，超出单机 CI。
  - examples/geo3k_vlm_multi_turn/npu_run_geo3k_vlm_multi_turn_qwen35_9b.py
  # run_geo3k_vlm_multi_turn_grpo_npu.py：组装 GRPO 启动参数；非独立样例。
  - examples/geo3k_vlm_multi_turn/run_geo3k_vlm_multi_turn_grpo_npu.py
  # run_geo3k_vlm_multi_turn_ppo_npu.py：组装 PPO 启动参数；非独立样例。
  - examples/geo3k_vlm_multi_turn/run_geo3k_vlm_multi_turn_ppo_npu.py
  # base_env.py：多轮环境基类；非独立样例。
  - examples/geo3k_vlm_multi_turn/base_env.py
  # env_geo3k.py：多轮 Geo3K 环境与打分；非独立样例。
  - examples/geo3k_vlm_multi_turn/env_geo3k.py
  # geo3k_vlm_multi_turn_config.yaml：多轮训练配置；非独立样例。
  - examples/geo3k_vlm_multi_turn/geo3k_vlm_multi_turn_config.yaml
  # rollout.py：多轮 Geo3K rollout 逻辑；非独立样例。
  - examples/geo3k_vlm_multi_turn/rollout.py
  # run-qwen3-30B-A3B-multi-agent.sh：多智能体训练；30B 的八卡布局暂无 NPU 验证，需缩模型。
  - examples/multi_agent/run-qwen3-30B-A3B-multi-agent.sh
  # agent_system.py：实现多智能体角色；非独立样例。
  - examples/multi_agent/agent_system.py
  # prompts.py：多智能体提示模板；非独立样例。
  - examples/multi_agent/prompts.py
  # rollout_with_multi_agents.py：多智能体 rollout 逻辑；非独立样例。
  - examples/multi_agent/rollout_with_multi_agents.py
  # run-qwen3-8B-opd-megatron.sh：Megatron teacher 蒸馏；需额外转换 teacher 权重且暂无 NPU 先例。
  - examples/on_policy_distillation/run-qwen3-8B-opd-megatron.sh
  # run-glm4.7-30B-opd.sh：GLM 蒸馏；teacher/student 需 16 卡，超出单机 CI。
  - examples/on_policy_distillation/run-glm4.7-30B-opd.sh
  # retool_glm4.7_flash_rl_npu.sh：GLM 工具调用训练；硬编码 16 卡与占位路径，暂不接入。
  - examples/retool/retool_glm4.7_flash_rl_npu.sh
  # retool_qwen3_4b_sft.sh：工具调用 SFT；与 RL 版本共用工具链，待 RL 配方验证后接入。
  - examples/retool/retool_qwen3_4b_sft.sh
  # generate_with_retool.py：工具调用 rollout 与奖励；非独立样例。
  - examples/retool/generate_with_retool.py
  # rl_data_preprocess.py：RL 数据预处理；非独立训练样例。
  - examples/retool/rl_data_preprocess.py
  # sft_data_processing.py：SFT 数据预处理；非独立训练样例。
  - examples/retool/sft_data_processing.py
  # tool_sandbox.py：提供本地 Python sandbox；非独立样例。
  - examples/retool/tool_sandbox.py
  # run_qwen2.5_3B.sh：检索增强训练；依赖大规模索引和 CUDA 检索服务，CI 暂不可用。
  - examples/search-r1/run_qwen2.5_3B.sh
  # generate_with_search.py：检索 rollout 与奖励逻辑；非独立样例。
  - examples/search-r1/generate_with_search.py
  # google_search_server.py：Google 搜索代理；需要付费 API key，CI 不接入。
