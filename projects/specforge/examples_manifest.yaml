  # ===== managed-local dflash：单个 `specforge train` 拥有全栈（mooncake +
  # capture server + producer + consumer 由 launch_plan supervisor 起），
  # run_example.sh 对 managed-local/ 路径不起外部服务。recipe 锁死的
  # trainer 卡数通过结构化 overlay 压缩（apply_overrides 对 [...] 走
  # yaml.safe_load）：nproc_per_node=1 + trainer_cuda_visible_devices=["1"]，
  # capture server 留卡 0。4B 已端到端验证，8B 的 capture 需
  # mem_fraction_static=0.65（0.5 会 OOM）。=====
  - path: examples/configs/online/disaggregated/managed-local/qwen3.5-4b-dflash-disaggregated-npu.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
