version: 1
scan:
  # specforge 的 "examples" 形态特殊：训练入口是 specforge CLI（不是各 example
  # 自带 python 脚本），recipe 是 typed YAML，shell wrapper 只是把 CONFIG=
  # 翻译成 `specforge train --config <path>`。files-only 模型：
  # 入口源文件 = yaml config / sh script / py utility；include_extensions
  # 只收 .sh / .py / .yaml，.ipynb / .md / 图像 / 字体天然不进。
  # YAML recipes 是被消费的入口，不是 helper，所以默认 include 进来。
  root: examples
  include_extensions: ['.sh', '.py', '.yaml']

supported:
  # ===== 在 coder sglang-hdc（910B4×4，torch 2.10.0 + torch_npu 2.10.0 +
  # CANN 9.0.0 + sglang 0.5.18）端到端验证通过；recipe 名称带 `-npu` 后缀，
  # 其他 NPU recipe（dflash2 / domino / mtp）跑全 recipe 需要更多卡，
  # 列入 unsupported =====
  #
  # 端到端 smoke 在 [Quick-start-Ascend.md](docs/Quick-start-Ascend.md) 已
  # CI 绿（specforge-quick-start.yml 的 5 段 #test 块：smoke-download-model
  # → smoke-apply-patches → smoke-start-mooncake → smoke-start-sglang →
  # smoke-train-launch + smoke-train-monitor）。这里把它包成 single-step
  # overlay 走 examples-template 引擎验证一遍，作为 examples 看护的最小
  # 入口。overlay 的每条改动与 smoke 的命令行严格对齐——只是把 smoke 那
  # 段 shell 的整段命令搬到 overlay_args 里（不需要再写 helper shell）。
  - path: examples/configs/online/disaggregated/external/qwen3.5-4b-dflash-online-npu.yaml
    profile: specforge
    runner: linux-aarch64-a2-4                # 4 卡 runner：capture 卡 0、trainer 卡 1，卡 2/3 留给 HCCL buffer
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      # 训练规模压到 1 步：recipe 默认 num_epochs=10 / max_steps=10000 / batch_size=2 / accumulation_steps=4
      # → 单 epoch 几十小时；CI 1 步即可验证 producer→mooncake→consumer 链路。
      - training.max_steps=1
      - training.batch_size=1
      - training.accumulation_steps=1
      # 序列长度从 recipe 默认 3072 压到 512：smoke 的样本本来就只是 1 条 sharegpt 对话，
      # 3072 会让 attention logits 的 H 维度白算，对 1 步训练没意义；512 是实际样本 token 长度的上限。
      - data.max_length=512
      # 注入 fixture 路径：recipe 默认指向 ./cache/dataset/train_regen.jsonl，
      # 那是 scripts/regenerate_train_data.py 的产物（需要先拉 sharegpt 再用
      # qwen3-8b / qwen3.6-27b 重新生成，单这一项就要 1-2 小时 + 1 张卡跑推理）。
      # smoke 的数据从 setup_example.sh 写一份 sharegpt_train.jsonl 1 行 fixture
      # 进 ${FIXTURE_DIR}，这里把它覆到 recipe 字段。
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      # 锚点数压到 32：recipe 默认 num_anchors=512 是按 3.5-4B 训练稳定度调的；
      # 1 步训练不会触发 dflash 的 loss_decay 累积，32 个 anchor 已经够
      # producer 走完一整条采样链；锚点越少单步耗时越短（实测从 ~120s 降到 ~30s）。
      - training.num_anchors=32
      # 关掉周期保存：recipe 默认 save_interval=10000，1 步训练根本到不了，
      # 关掉避免 save 路径空跑检查 + 不在 CI 输出目录堆无用 checkpoint。
      - training.save_interval=0
      # 日志每步打：recipe 默认 log_interval=50，1 步训练要看到 marker 必须降到 1。
      - training.log_interval=1
      # 关掉 tensorboard 上报：recipe 默认 report_to=tensorboard，未配 TB 路径时会
      # 在 writer.flush() 抛 Warning 阻塞训练；CI 不需要 TB，直接 none。
      - tracking.report_to=none
      # trainer 进程数压到 1：recipe 默认 nproc_per_node=8 是按 8 卡 A2 pod 调的，
      # smoke 只用卡 1 跑 trainer，单进程足够；卡 0 给 sglang capture server。
      - deployment.trainer.nproc_per_node=1
      # receive_buffers 显式回退 pageable：上游把默认值改成 pinned 后，NPU 上
      # pin 判定走 torch.cuda.is_available() 恒为 False，pageable host buffer
      # register_buffer 返回 -600 变成硬 RuntimeError；pageable 走 get_into 老路径
      # 正常。与 Quick-start-Ascend.md smoke-train-launch 保持一致。
      - deployment.disaggregated.receive_buffers=pageable
      # target model 路径：recipe 默认 Qwen/Qwen3.5-4B（HF Hub，runner 不可达），
      # 覆成 setup_example.sh 从 ModelScope 预下载并 export 的本地路径。
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
      # Qwen3.5-4B 是 hybrid Mamba/GDN，文本 decoder 嵌在 model.language_model.*；
      # smoke train 的 FSDP 初始化要从这个嵌套路径拿 embed，否则会拿 None。
      - model.embedding_key="model.language_model.embed_tokens.weight"
      # run_id 是 dflash consumer 拿 SQLite WAL + mooncake store_id 的命名空间；
      # recipe 默认 qwen3.5-4b-dflash-npu-online，CI 输出目录要清旧日志避免
      # _claim_fresh_control_path 拒绝继续跑。直接复用 recipe 默认值即可，
      # 不在这里显式覆。
    timeout_minutes: 180                       # 冷缓存下 Qwen3.5-4B snapshot + sglang 首次 graph compile (5-10 min) + 1 步训练

  # ===== dflash 家族 + dspark（在 coder NPU 端到端验证通过：纯 torch sketch
  # 模型 + sdpa attention，无 triton/xformers 依赖）。capture 的 method /
  # aux layer ids 由 run_example.sh 经 resolve_server_capture_contract 动态
  # 解析，不再硬编码 dflash。dflash2 / dspark 已实测 1 步训练出 step loss；
  # qwen3-4b-dflash / qwen2.5-0.5b-dflash 为 dflash 同构，dpace 为 dflash 的
  # loss_type 变体，--plan 全部通过。8B 条目为单卡 32G HBM 边界（16G 权重
  # + Adam 状态），batch_size=1 + expandable_segments 下可装。=====
  - path: examples/configs/online/disaggregated/external/qwen3.5-4b-dflash2-online-npu.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
    overlay_args:
      - training.max_steps=1
      - training.batch_size=1
      - training.accumulation_steps=1
      - data.max_length=512
      - data.train_data_path=${FIXTURE_DIR}/sharegpt_train.jsonl
      - training.num_anchors=32
      - training.save_interval=0
      - training.log_interval=1
      - tracking.report_to=none
      - deployment.trainer.nproc_per_node=1
      - deployment.disaggregated.receive_buffers=pageable
      - model.target_model_path=${SPECFORGE_MODEL_PATH}
      # recipe 把 embedding_key 写成了 model.embed_tokens.weight；Qwen3.5-4B 是
      # hybrid Mamba/GDN，文本 decoder 嵌在 model.language_model.* 下。
      - model.embedding_key="model.language_model.embed_tokens.weight"
    timeout_minutes: 180

  - path: examples/configs/online/disaggregated/external/qwen3-4b-dspark-disaggregated.yaml
    profile: specforge
    runner: linux-aarch64-a2-4
    image: swr.cn-southwest-2.myhuaweicloud.com/base_image/dockerhub/lmsysorg/sglang:v0.5.18-cann9.0.0-910b
