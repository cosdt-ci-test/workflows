      - --config qwen3_debugmodel
      - --override.imports npu_compat.npu_attention
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/qwen3_debugmodel
    timeout_minutes: 60
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
