      - --config qwen3_debugmodel_moe_param_groups
      - --override.imports npu_compat.npu_attention
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
