  # 7) Two cards: qwen3_1_7b (1.7B params).  The weights plus the optimizer
  #    state are ~20 GB, which does not fit one 32 GB card together with the
  #    activations (measured: OOM), but two cards do.  Same assets as the
  #    0.6B entry (setup fetches Qwen3-1.7B's tokenizer) and the same
  #    dataset override.
  - path: example/run_train_2card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
