      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/muse_glimmer_debugmodel
    timeout_minutes: 60

# No upstream file is an example on its own: torchtitan's examples are
# (module, config) combinations, recorded in `unsupported_configs` below.
# The upstream library tree is declared as "not an example" via
# scan.exclude, so the path-based reconciliation has nothing to flag.
unsupported: []

# (module, config) ledger of the examples this project does NOT run, with
# the reason per family. The reconciliation matches paths literally, so
# these compound entries are not machine-checked - they are the human
# record of what was tried and why it is out of scope.
unsupported_configs:
  # flux_debugmodel：**网络不是瓶颈**，缺的是 gated 资产 + 显存。2026-10-27 在
  # hdc-stable-npu-2（1 卡）用 modelscope 本地资产实测（集群到 modelscope 通、到
  # huggingface.co 不通），可绕开的都绕开了：
  # (1) tokenizer 资产可解 —— modelscope 有 google/t5-v1_1-small 与
  #     AI-ModelScope/CLIP-vit-large-patch14，CLI 覆盖 --tokenizer.t5-tokenizer-path /
  #     --tokenizer.clip-tokenizer-path / --encoder.t5-encoder / --encoder.clip-encoder
  #     指向本地目录即可（实测生效）；
  # (2) --encoder.random-init 生效，可跳过 gated 的 black-forest-labs/FLUX.1-dev
  #     ae.safetensors（该仓库 401 gated）；顺带 transformers>=4.51.1 +
  #     sentencepiece 可从 pypi 装；
  # (3) --parallelism.spmd-backend spmd_types 生效，绕开 1 卡的
  #     flux/parallelize.py:70 `assert dp_mesh is not None`（该 assert 只在非
  #     spmd_types 分支；CUDA 同卡同死，非 NPU 专属）；实测模型能建、FSDP 能上；
  # (4) 数据用本地 tests/assets/cc12m_test —— FluxDataLoader.Config.dataset 默认
  #     就是 cc12m-test，不需要 HF 的 pixparse/cc12m-wds（后者同样 401 gated）；
  # 仍然不通的是两件：
  # (5) 文本编码器必须是真 T5-XXL —— flux 的投影层按 d_model=4096 建的，换
  #     t5-v1_1-small（512）实测报 aclnnAddmm "The k-axis of the two inputs are
  #     different"；google/t5-v1_1-xxl 非 gated 可下，但 pytorch_model.bin 44.5 GB；
  # (6) 显存 —— T5-XXL fp32 19 GB + CLIP + 主干 + 优化器状态 > 1 卡 32 GB。
  # → 网络通了之后仍缺 44.5 GB 权重与多卡，故仍留 unsupported。
  - torchtitan/models/flux/config_registry.py:flux_debugmodel

  # --- llama3 系：debugmodel 系（+ varlen/ce_loss/dist_gemm/sft 变体）现在是通过
  # project 侧 launcher 跑的（见 supported 段），所以下面这些 upstream config_registry
  # 入口按「不是 example 文件」的语义留在 unsupported 段（reconciliation 按路径字面
  # 匹配，会按设计报 stale；per-config 理由见本段注释）。
  # 2026-10-26 复测（hdc-stable-npu-3，CANN 9.1.0 / torch 2.14.0 / torch_npu 2.14.0 /
  # triton-ascend 3.6.0，torchtitan v0.3.0 干净 checkout）修正了原来的「三墙」结论：
  #   · ComplexRoPE 复数墙 —— 仍然成立。rope.py:233,261 用 torch.polar/view_as_complex
  #     生成 complex64，NPU 的 aclnnIndex 无 DT_COMPLEX64 实现（实测
  #     AclNN_Parameter_Error(EZ1001): Tensor self not implemented for DT_COMPLEX64）。
  #     supported 段用 npu_compat.npu_attention 在实数域做同样的 gather 绕过（数值与
  #     upstream 逐位一致），但「upstream 组件在 NPU 上原样跑不了」这个事实不变。
  #   · flex 墙 —— 仍然成立，但根因是三层，不是「NPU 缺算子」：
  #     ① torch_npu 2.14.0 的 lowering.make_reduction 缺 strict_sum 形参，而 torch 2.14
  #       的 inductor sum_ lowering 总是传它 → NPU 上**任何** compiled reduction 都挂
  #       （连带 torchtitan 的 compile 特性整体不可用，与 flex 无关）；
