      - --comm.mode default
      - --dataloader.dataset c4_test
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/qwen3_1_7b
    timeout_minutes: 90

  # 8) Eight cards: deepseek_v3_16b, whose recipe asks for expert parallelism
  #    of 8 (16B x 12 bytes = 192 GB, spread over 8 x 32 GB).  Needs the
  #    per-family override and the deepseek-moe-16b-base tokenizer asset.
  - path: example/run_train_8card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0,1,2,3,4,5,6,7'
    name: deepseek_v3/deepseek_v3_16b (8 cards)
    overlay_args:
      - --module deepseek_v3
      - --config deepseek_v3_16b
      - --override.imports npu_compat_deepseek.deepseek_attention
      - --comm.mode default
      # the recipe compiles its loss component (compile=CompileConfig(enable=True,
      # components=["loss"])) and torch_npu 2.14.0 cannot lower ANY compiled
      # reduction: its lowering.make_reduction lacks the strict_sum keyword that
      # torch 2.14's inductor sum_ lowering always passes
      # ("TypeError: make_reduction() got an unexpected keyword argument
      # 'strict_sum'").  The compiled-loss path is therefore skipped here; the
      # same wall blocks every compiled recipe (graph_trainer and friends).
      - --compile.no-enable
      - --dataloader.dataset c4_test
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/deepseek_v3_16b
    timeout_minutes: 120

  # 9) muse_glimmer, single card (text path; the multimodal variant needs
