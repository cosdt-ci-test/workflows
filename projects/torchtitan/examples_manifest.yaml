  #    path and the two MoE recipes.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    name: qwen3/qwen3_debugmodel
    overlay_args:
