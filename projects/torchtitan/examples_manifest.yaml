version: 1
scan:
  root: torchtitan
  include_extensions: ['.py', '.sh']
  # torchtitan 的 "example" 不是目录 + 脚本的形态，而是单个 train.py
  # 入口 + `--module X --config Y` CLI 参数选模型配置。所以
  # scan.root 设为仓库根 `torchtitan`，include_extensions 留宽；
  # 其余子树都是库代码而非 example，用 exclude 声明「不是 example」
  # （覆盖判定：supported(非 project 源) ∪ unsupported ∪ exclude）。
  #
  # 注意：本项目的 supported 条目是 project 源的启动脚本
  # （projects/torchtitan/example/），它们调用上游的 torchtitan.train
  # 入口，因此上游的 train.py / trainer.py 也不计入 example。
  exclude:
    - torchtitan/__init__.py
    - torchtitan/components
    - torchtitan/config
    - torchtitan/distributed
    - torchtitan/experiments
    - torchtitan/hf_datasets
    - torchtitan/models
    - torchtitan/observability
    - torchtitan/ops
    - torchtitan/overrides
    - torchtitan/protocols
    - torchtitan/tools
    - torchtitan/train.py
    - torchtitan/trainer.py

# The example set of this project is the (module, config) combinations
# below, not a file tree: the unsupported section records them as
# "<path>:<config>" entries (the daily reconciliation matches paths
# literally, so these entries are reported as stale by design - the
# per-config reasons live in the comments next to them).
#

# Supported examples run torchtitan's own trainer entry point
# (`python -m torchtitan.train --module X --config Y`) through the
# project-side launchers in projects/torchtitan/example/ (source: project).
#
# The NPU-incompatible attention stack is replaced through torchtitan's
# official override mechanism (--override.imports, see
# torchtitan/config/override.py + torchtitan/overrides/README.md).
# One override replaces the `GQAttention.Config` node (the framework rejects
# nested overrides), carrying both fixes:
#   RealGatherComplexRoPE - upstream ComplexRoPE keeps a complex64 cache and
#       indexes it with the position ids; aclnnIndex has no DT_COMPLEX64
#       implementation. The override gathers the same values in real space
#       and hands them back to upstream's own rotation code.
#   BlockCausalSDPA - upstream builds the per-document block-causal mask only
#       for the Flex / Varlen backends (neither compiles on NPU), and upstream
#       forbids SDPA as a language-model backend (it cannot consume
#       per-document positions). The override feeds SDPA an explicit dense
#       block-causal mask instead (aclnn SDPA accepts attn_mask).
# Both replacements are numerically equivalent to the upstream components
# they stand in for; projects/torchtitan/example/check_npu_overrides.py
# asserts that on CPU (measured 2026-10-26: rope max_abs_diff 0.0 - bit
# identical, since upstream's own cache math and rotation are reused; mask
# max_abs_diff 3.6e-07 against a naive per-document causal reference).
# The loss is upstream's own default (`llama3_debugmodel` ->
# ChunkedLossWrapper): the 2026-09 "ChunkedLossWrapper backward-inside-forward
# meta-tensor leak" does NOT reproduce on torch 2.14 / torch_npu 2.14
# (re-verified 2026-10-26 on hdc-stable-npu-3: 1-card / 2-card FSDP,
# seq-len 256 and 2048, all exit 0), so the `llama3_debugmodel_ce_loss`
# detour is dropped. No upstream source file is modified - the torchtitan
# checkout stays clean.
#
# Stack: CANN 9.2.0 (container image) / torch 2.14.0 / torch_npu 2.14.0 /
# triton-ascend 3.6.0 (Ascend fork) / modelscope 1.40.2.
supported:
  # 1) Single card: 2 steps of llama3 debugmodel on one NPU. Covers config
  #    parsing, model build, tokenizer + dataloader (c4_test), forward /
  #    backward, optimizer step, metrics, checkpoint write.
  #    Config is upstream's default `llama3_debugmodel` (ChunkedLossWrapper) -
  #    no loss override, no config detour.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    name: llama3/llama3_debugmodel
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel
      - --override.imports npu_compat.npu_attention
      - --comm.mode default
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_1card
    timeout_minutes: 60

  # 2) Two cards: same model with FSDP shard=2 + bfloat16. Adds real
  #    cross-rank HCCL collectives, DTensor parameter distribution and the
  #    default spmd backend (torch >= 2.13 translates the FSDP annotations,
  #    so no --parallelism.spmd-backend override is needed).
  - path: example/run_train_2card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0,1'
    name: llama3/llama3_debugmodel (2 cards)
    overlay_args:
      - --module llama3
      - --config llama3_debugmodel
      - --override.imports npu_compat.npu_attention
      - --comm.mode default
      - --training.dtype bfloat16
      - --training.steps 2
      - --training.local-batch-size 1
      - --training.seq-len 256
      - --metrics.log-freq 1
      - --metrics.disable-color-printing
      - --dump-folder ${CI_OUTPUT_DIR}/llama3_debugmodel_2card
    timeout_minutes: 90

  # 3) One more llama3 recipe, single card. All the entries below share
  #    the same launcher and the same override; only --module / --config
  #    change. Measured exit 0 on hdc-stable-npu-2 / -3 (2026-10-27):
  #    varlen attention backend, the ce_loss recipe (kept for coverage even
  #    though the default recipe now runs), the dist_gemm TP backend, and the
  #    SFT recipe with its chat dataset.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
