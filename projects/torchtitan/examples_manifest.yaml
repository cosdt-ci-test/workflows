version: 1
scan:
  root: torchtitan
  include_extensions: ['.py', '.sh']
  # torchtitan 的 "example" 不是目录 + 脚本的形态，而是一个 recipe 函数
  # （v0.4.0 起 CLI 是 `--module X --config Y`，配置由 recipe 返回）。
  # 所以 scan.root 设为仓库根 `torchtitan`，include_extensions 留宽；
  # 其余子树都是库代码而非 example，用 exclude 声明「不是 example」
  # （覆盖判定：supported(非 project 源) ∪ unsupported ∪ exclude）。
  #
  # 注意：本项目的 supported 条目是 project 源的启动脚本
  # （projects/torchtitan/example/），它们调用上游的 torchtitan.train
  # 入口，因此上游的 train.py / trainer.py 也不计入 example。
  #
  # v0.4.0 的包布局（exclude 按它对齐）：
  #   新增 _torch_compat（torch 2.15 兼容层）、quantization（从
  #   components/quantization 提上来）、rl（从 experiments/rl 提上来）、
  #   training_engine.py（trainer 的底座）；
  #   消失 hf_datasets（并入 components/data）、overrides（并入
  #   config/transform）、protocols（并入 models/base）。
  exclude:
    - torchtitan/__init__.py
    - torchtitan/_torch_compat
    - torchtitan/components
    - torchtitan/config
    - torchtitan/distributed
    - torchtitan/experiments
    - torchtitan/models
    - torchtitan/observability
    - torchtitan/ops
    - torchtitan/quantization
    - torchtitan/rl
    - torchtitan/tools
    - torchtitan/train.py
    - torchtitan/trainer.py
    - torchtitan/training_engine.py

# The example set of this project is the (module, config) combinations
# below, not a file tree: the unsupported section records them as
# "<path>:<config>" entries (the daily reconciliation matches paths
# literally, so these entries are reported as stale by design - the
# per-config reasons live in the comments next to them).
#

# Supported examples run torchtitan's own trainer entry point
# (`python -m torchtitan.train --module X --config Y`) through the
# project-side launchers in projects/torchtitan/example/ (source: project).
#
# --- torchtitan v0.4.0: the CLI is recipe-based -------------------------
# Upstream dropped the "module + a long list of --training.* flags"
# configuration.  A recipe is now a plain function returning a
# `Trainer.Config`, selected with `--module <module> --config <function>`,
# and the CLI only adds `--override`, `--comm-backend`, `--output-dir`,
# `--resume-step` and `--print-config` on top of it: `--training.steps`,
# `--comm.mode` and `--dump-folder` no longer exist.
#
# The project therefore ships its own recipe module
# (projects/torchtitan/example/npu_recipes.py): every function in it calls
# the matching **upstream** recipe and applies the NPU-specific
# adjustments on top --
#   1. two steps (upstream runs 10 to 1000; a CI smoke needs two to
#      cover data -> forward -> backward -> optimizer -> metrics);
#   2. upstream's plain `CrossEntropyLoss` instead of the
#      `ChunkedLossWrapper` (the wrapper computes the lm_head inside a
#      custom autograd Function, and on torch_npu that Function leaks
#      meta tensors into the decoder backward graph);
#   3. no compiled regions (`model.local_compile_regions = []`): torch_npu
#      2.14.0 cannot lower ANY compiled reduction (inductor's `sum_`
#      lowering always passes `strict_sum`, which NPU's
#      `lowering.make_reduction` does not accept);
#   4. the bundled `tests/assets/c4_test` dataset instead of HF's
#      `allenai/c4`, which the cluster cannot reach;
#   5. color-free metrics, so the CI log can be matched as plain text;
#   6. an explicit dtype: float32 for the small smokes, bfloat16 for the
#      two-card entry and for the 16B size tier (in float32 the 16B model
#      needs 16B x 16 bytes = 256 GB, exactly the 8 x 32 GB of the
#      eight-card runner).
# The upstream checkout stays git clean -- no source file is patched.
#
# --- the NPU-incompatible attention stack --------------------------------
# It is replaced through torchtitan's official override mechanism
# (`--override <module.function>`, see torchtitan/config/override.py):
#   RealGatherComplexRoPE - upstream ComplexRoPE keeps a complex64 cache and
#       indexes it with the position ids; aclnnIndex has no DT_COMPLEX64
#       implementation. The override gathers the same values in real space
#       and hands them back to upstream's own rotation code.
#   NpuBlockCausalSDPA - upstream builds the per-document block-causal mask
#       only for the Flex / Varlen backends (neither compiles on NPU), and
#       upstream forbids SDPA as a language-model backend (it cannot consume
#       per-document positions). The override feeds SDPA an explicit dense
#       block-causal mask instead (aclnn SDPA accepts attn_mask).
# One override replaces one config node, so each family gets the override
# that matches its own attention class:
#   llama3 / qwen3 / sft -> npu_compat.npu_attention        (GQAttention.Config)
#   deepseek_v3           -> npu_compat_deepseek.deepseek_attention (MLA)
#   muse_glimmer          -> npu_compat_muse.muse_attention (its own class,
#                            with the query scaling, the output gate and
#                            the per-layer sliding window)
# Both replacements are numerically equivalent to the upstream components
# they stand in for; projects/torchtitan/example/check_npu_overrides.py
# asserts that on CPU (the numbers quoted below are from the 2026-10-26
# v0.3.0-era run: rope max_abs_diff 0.0 - bit identical, since upstream's
# own cache math and rotation are reused; mask max_abs_diff 3.6e-07
# against a naive per-document causal reference.  Every examples run
# re-measures them and prints the numbers to stderr).
#
# Stack: CANN 9.2.0 (container image) / torch 2.14.0 / torch_npu 2.14.0 /
# triton-ascend 3.6.0 (Ascend fork) / modelscope 1.40.2.
#
# Status: the entries below were re-written for the v0.4.0 recipe CLI on
# 2026-11-10 and have **not** been re-measured yet.  The "measured exit 0"
# notes further down come from the v0.3.0-era runs (2026-10-26 / -27) and
# describe the same upstream recipes -- not the v0.4.0 CLI.
supported:
  # 1) Single card: 2 steps of the llama3 debugmodel on one NPU.  Covers
  #    recipe loading, model build, tokenizer + dataloader (c4_test),
  #    forward / backward, optimizer step and metrics.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config llama3_debugmodel
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/llama3_debugmodel
    timeout_minutes: 60

  # 2) Two cards: the same model with FSDP shard=2 + bfloat16.  Adds real
  #    cross-rank HCCL collectives, DTensor parameter distribution and the
  #    FSDP2 MixedPrecisionPolicy (the one that needs the torch 2.15
  #    compatibility shim).
  - path: example/run_train_2card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0,1'
    overlay_args:
      - --module npu_recipes
      - --config llama3_debugmodel_bf16
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/llama3_debugmodel_2card
    timeout_minutes: 90

  # 3) One more llama3 recipe, single card.  All the entries below share
  #    the same launcher and the same override; only --config changes.
  #    Measured exit 0 on hdc-stable-npu-2 / -3 (2026-10-27, v0.3.0 CLI):
  #    varlen attention backend, the ce_loss recipe (kept for coverage even
  #    though the default recipe now runs), the dist_gemm TP backend, and
  #    the SFT recipe with its chat dataset.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config llama3_debugmodel_varlen_attn
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/llama3_debugmodel_varlen_attn
    timeout_minutes: 60
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config llama3_debugmodel_ce_loss
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/llama3_debugmodel_ce_loss
    timeout_minutes: 60
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config llama3_debugmodel_dist_gemm
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/llama3_debugmodel_dist_gemm
    timeout_minutes: 60
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config sft_debugmodel
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/llama3_sft_debugmodel
    timeout_minutes: 60

  # 4) qwen3 family, single card.  The rope is upstream's CosSinRoPE (a real
  #    cache, no complex64 problem) so the override leaves it alone; only the
  #    attention backend is swapped.  Covers the dense model and the two MoE
  #    recipes.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config qwen3_debugmodel
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/qwen3_debugmodel
    timeout_minutes: 60
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config qwen3_debugmodel_moe_param_groups
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/qwen3_debugmodel_moe_param_groups
    timeout_minutes: 60
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config qwen3_moe_debug
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/qwen3_moe_debug
    timeout_minutes: 60

  # 5) A size tier, not just a debugmodel: qwen3 0.6B on one card.  Two
  #    things the debugmodel recipes do not need: the real tokenizer (the
  #    recipe's hf_assets_path points at ./assets/hf/Qwen3-0.6B, which
  #    setup_example.sh fetches from modelscope) and the bundled dataset
  #    (the recipe asks for HF's allenai/c4, unreachable from the cluster;
  #    c4_test is the local copy the debugmodel recipes use).
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config qwen3_0_6b
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/qwen3_0_6b
    timeout_minutes: 60

  # 6) deepseek_v3, single card.  Its attention is the family's own
  #    DeepSeekMLAAttention (not GQAttention), so it needs the per-family
  #    override in example/npu_compat_deepseek.py -- the same two fixes
  #    (real-space RoPE gather, SDPA with a dense block-causal mask), with
  #    upstream's forward plus a positions passthrough.
  #    MLA's value head dim differs from q/k's, which SDPA accepts.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config deepseek_v3_debugmodel
      - --override npu_compat_deepseek.deepseek_attention
      - --output-dir ${CI_OUTPUT_DIR}/deepseek_v3_debugmodel
    timeout_minutes: 60
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config deepseek_v3_debugmodel_mtp
      - --override npu_compat_deepseek.deepseek_attention
      - --output-dir ${CI_OUTPUT_DIR}/deepseek_v3_debugmodel_mtp
    timeout_minutes: 60

  # 7) Two cards: qwen3 1.7B.  The weights plus the optimizer state are
  #    ~20 GB, which does not fit one 32 GB card together with the
  #    activations (measured: OOM), but two cards do.  Same assets as the
  #    0.6B entry (setup fetches Qwen3-1.7B's tokenizer) and the same
  #    bundled dataset.
  - path: example/run_train_2card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-2
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0,1'
    overlay_args:
      - --module npu_recipes
      - --config qwen3_1_7b
      - --override npu_compat.npu_attention
      - --output-dir ${CI_OUTPUT_DIR}/qwen3_1_7b
    timeout_minutes: 90

  # 8) Eight cards: deepseek_v3 16B, whose recipe asks for expert
  #    parallelism of 8.  It runs in bfloat16 (the recipe's
  #    npu_recipes.deepseek_v3_16b sets training.dtype): in float32 the
  #    parameters, gradients and AdamW states alone need 16B x 16 bytes =
  #    256 GB, i.e. exactly the 8 x 32 GB of the runner before any
  #    activation.  Needs the per-family override and the
  #    deepseek-moe-16b-base tokenizer asset.
  - path: example/run_train_8card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-8
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0,1,2,3,4,5,6,7'
    overlay_args:
      - --module npu_recipes
      - --config deepseek_v3_16b
      - --override npu_compat_deepseek.deepseek_attention
      - --output-dir ${CI_OUTPUT_DIR}/deepseek_v3_16b
    timeout_minutes: 120

  # 9) muse_glimmer, single card (text path; the multimodal variant needs
  #    an NPU op the vision path does not have yet).  Its attention is its
  #    own class (GQAttention plus a query scaling, an output gate and a
  #    per-layer sliding window), so it gets its own override -- the
  #    generic one would drop those three fields.
  - path: example/run_train_1card.sh
    source: project
    profile: torchtitan
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.2.0-910b-ubuntu22.04-py3.12
    npu_devices: '0'
    overlay_args:
      - --module npu_recipes
      - --config muse_glimmer_debugmodel
      - --override npu_compat_muse.muse_attention
      - --output-dir ${CI_OUTPUT_DIR}/muse_glimmer_debugmodel
    timeout_minutes: 60

# No upstream file is an example on its own: torchtitan's examples are
# (module, config) combinations, recorded in `unsupported_configs` below.
# The upstream library tree is declared as "not an example" via
# scan.exclude, so the path-based reconciliation has nothing to flag.
unsupported: []

# (module, config) ledger of the examples this project does NOT run, with
# the reason per family. The reconciliation matches paths literally, so
# these compound entries are not machine-checked - they are the human
# record of what was tried and why it is out of scope.
unsupported_configs:
  # ===== 上游 v0.4.0 退役的 flavor（2026-11-10 核对 v0.4.0 tag，全树已无这些函数）=====
  # 这些条目在 v0.3.0 时都存在、也曾各有归属段落；v0.4.0 把它们从 recipe 树里删了，
  # 所以它们从 ledger 里整条移除（而不是留一条「已退役」的占位）：
  #   llama3_debugmodel_float8 / llama3_debugmodel_float8_emulate_lora
  #   qwen35_0_8b / qwen35_2b / qwen35_4b / qwen35_9b / qwen35_27b / qwen35_35b_a3b
  #   transformers_modeling_backend_full / _sft_full / _full_moe
  #   deepseek_v3_debugmodel_minimal_async_ep / deepseek_v3_16b_minimal_async_ep
  #   deepseek_v3_671b_float8
  #   gpt_oss_20b / gpt_oss_120b
  #   llama3_405b
  #   qwen3_debugmodel_non_fused_qkv（原先在 qwen3 段，已并入 qwen3 flavor）
  # 核对方法：upstream v0.4.0 checkout 里 `grep -rn "def <flavor>" --include="*.py"` 全树 0 命中。

  # flux_debugmodel：**网络不是瓶颈**，缺的是 gated 资产 + 显存。2026-10-27 在
  # hdc-stable-npu-2（1 卡）用 modelscope 本地资产实测（集群到 modelscope 通、到
  # huggingface.co 不通），可绕开的都绕开了：
  # (1) tokenizer 资产可解 —— modelscope 有 google/t5-v1_1-small 与
  #     AI-ModelScope/CLIP-vit-large-patch14，CLI 覆盖 --tokenizer.t5-tokenizer-path /
  #     --tokenizer.clip-tokenizer-path / --encoder.t5-encoder / --encoder.clip-encoder
  #     指向本地目录即可（实测生效）；
  # (2) --encoder.random-init 生效，可跳过 gated 的 black-forest-labs/FLUX.1-dev
  #     ae.safetensors（该仓库 401 gated）；顺带 transformers>=4.51.1 +
  #     sentencepiece 可从 pypi 装；
  # (3) --parallelism.spmd-backend spmd_types 生效，绕开 1 卡的
  #     flux/parallelize.py:70 `assert dp_mesh is not None`（该 assert 只在非
  #     spmd_types 分支；CUDA 同卡同死，非 NPU 专属）；实测模型能建、FSDP 能上；
  # (4) 数据用本地 tests/assets/cc12m_test —— FluxDataLoader.Config.dataset 默认
  #     就是 cc12m-test，不需要 HF 的 pixparse/cc12m-wds（后者同样 401 gated）；
  # 仍然不通的是两件：
  # (5) 文本编码器必须是真 T5-XXL —— flux 的投影层按 d_model=4096 建的，换
  #     t5-v1_1-small（512）实测报 aclnnAddmm "The k-axis of the two inputs are
  #     different"；google/t5-v1_1-xxl 非 gated 可下，但 pytorch_model.bin 44.5 GB；
  # (6) 显存 —— T5-XXL fp32 19 GB + CLIP + 主干 + 优化器状态 > 1 卡 32 GB。
  # → 网络通了之后仍缺 44.5 GB 权重与多卡，故仍留 unsupported。
  - torchtitan_recipes/tests/models/flux.py:flux_debugmodel

  # --- llama3 系：debugmodel 系（+ varlen/ce_loss/dist_gemm/sft 变体）现在是通过
  # project 侧 launcher 跑的（见 supported 段），所以下面这些 upstream recipe
  # 入口按「不是 example 文件」的语义留在 unsupported 段（reconciliation 按路径字面
  # 匹配，会按设计报 stale；per-config 理由见本段注释）。
  # v0.4.0 的 recipe 都在 `torchtitan_recipes/tests/models/<family>.py`（测试 flavor）
  # 或 `torchtitan_recipes/models/<family>.py`（生产 flavor），函数名即 `--config` 的取值；
  # v0.3.0 的 `torchtitan/models/<x>/config_registry.py` 在 v0.4.0 里已经没有了。
  # 2026-10-26 复测（hdc-stable-npu-3，CANN 9.1.0 / torch 2.14.0 / torch_npu 2.14.0 /
  # triton-ascend 3.6.0，torchtitan v0.3.0 干净 checkout）修正了原来的「三墙」结论：
  #   · ComplexRoPE 复数墙 —— 仍然成立。rope.py:233,261 用 torch.polar/view_as_complex
  #     生成 complex64，NPU 的 aclnnIndex 无 DT_COMPLEX64 实现（实测
  #     AclNN_Parameter_Error(EZ1001): Tensor self not implemented for DT_COMPLEX64）。
  #     supported 段用 npu_compat.npu_attention 在实数域做同样的 gather 绕过（数值与
  #     upstream 逐位一致），但「upstream 组件在 NPU 上原样跑不了」这个事实不变。
  #   · flex 墙 —— 仍然成立，但根因是三层，不是「NPU 缺算子」：
  #     ① torch_npu 2.14.0 的 lowering.make_reduction 缺 strict_sum 形参，而 torch 2.14
  #       的 inductor sum_ lowering 总是传它 → NPU 上**任何** compiled reduction 都挂
  #       （连带 torchtitan 的 compile 特性整体不可用，与 flex 无关）；
  #     ② triton-ascend 3.6.0 硬编码 -std=c++17（backends/ascend/utils.py:709），而
  #       torch 2.14 的 ATen headers 要 C++20 → npu_utils 运行期扩展编不出来；
  #     ③ torch_npu 自己的 flex lowering（_inductor/kernel/flex_attention.py:746）
  #       SubgraphLoweringException: Buffers cannot be created while lowering a
  #       pointwise subgraph —— 这层是真实的能力缺口，①②只是依赖版本 skew。
  #     supported 段同样用 override 把 flex 换成带 dense block-causal 掩码的 SDPA
