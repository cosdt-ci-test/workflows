version: 1
scan:
  root: recipes
  include_extensions: ['.py']
  # 对账基准（human-readable，无机器消费）：本清单的 supported/unsupported
  # 条目均对照 torchtune v0.6.1 release tag（meta-pytorch/torchtune@a6290a5，
  # "[release-only] Bump version for 0.6.1 release"）实测 / 静态分析得到。
  # 升级时人工同步：拉新 release tag 后重跑 setup_example.sh + 实测每条
  # supported、核对 unsupported（dev/ 下文件 import 链可能有变）。
  # files-only 模型（docs/examples-guard-engine.md §2.7）：对账单位是
  # 入口文件 .py。非 entry point 的包初始化 / YAML 配置 / 文档 / SLURM
  # 启动器若被扫描命中，会落到 unsupported（其扫描后缀与本仓 examples
  # 树里几乎不出现，仅作声明）；所有"已识别不是 example"的条目都列在
  # unsupported 段。

supported:
  # ===== 已在 coder hdc-stable-npu-3（910B4×2, torch 2.11.0+cpu, torch_npu 2.11.0,
  # CANN 9.1.0）端到端跑通（setup_example.sh 实跑 + recipe exit 0），依赖线 pin
  # 见 setup_example.sh 注释 =====
  # 验证日期：2026-09-18（最近一轮 distributed 翻案 2026-09-21）；
  # torchtune checkout=v0.6.1 release tag（meta-pytorch/torchtune@a6290a5
  # "[release-only] Bump version for 0.6.1 release"）。release tag 锁定后，
  # 本 manifest 列项与 release 树严格对齐；main HEAD bd2a0fc 多出来的
  # recipes/qat_single_device.py / recipes/dev/async_grpo_full_finetune_distributed.py
  # 不在 release 树中（main HEAD 独占），未在本期验证。
  # 关键 pin + patch（per setup_example.sh）：
  #   - setup_torchtune() pin torchao==0.13.0（v0.6.1 用 torchao.dtypes.nf4tensor；
  #     main HEAD 才是 torchao.quantization.NF4Tensor + torchao==0.18.0）
  #   - 量化 Int8DynActInt4WeightQuantizer 的默认 groupsize=256 不整除
  #     Qwen2.5-0.5B 的 hidden_size=896（896/256=3.5），overlay 改成
  #     groupsize=128（896/128=7）

  # LoRA SFT：Qwen2.5-0.5B + 50 行 alpaca，1 step，1 卡 ~12 秒
  - path: recipes/lora_finetune_single_device.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_lora_single_device.yaml  # 完整相对路径（cwd=target root）；OmegaConf 不补 .yaml 后缀
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json  # upstream 默认 /tmp/Qwen2.5-0.5B-Instruct/vocab.json；改 setup 预下载的 ModelScope snapshot
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt  # BPE 分词器配套 merges 文件
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}  # FullModelHFCheckpointer 从 snapshot 根目录读权重（避免 HF 下载）
      - checkpointer.output_dir=${CI_OUTPUT_DIR}  # 输出到 CI 工作目录（默认 /tmp/torchtune/qwen2_5_0_5B/lora_single_device 在容器内会被清）
      - dataset.source=json  # upstream alpaca_cleaned_dataset 默认 yahma/alpaca-cleaned（HF 不可达）；换成本地 json builder
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json  # 仓内 50 行 alpaca fixture
      - gradient_accumulation_steps=1  # upstream 默认 8：1 step 即可验证
      - max_steps=1  # 压到 CI 规模
      - log_every_n_steps=1  # upstream 默认 1：确保 1 步内也有日志
      - batch_size=1  # upstream 默认 2：压批
      - max_seq_len=512  # upstream 默认 2048：压序列长度
    timeout_minutes: 60

  # 全量 SFT：Qwen2.5-0.5B + 50 行 alpaca，1 step，1 卡
  - path: recipes/full_finetune_single_device.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_full_single_device.yaml
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - dataset.source=json
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json
      - gradient_accumulation_steps=1
      - max_steps=1
      - log_every_n_steps=1
      - batch_size=1
      - max_seq_len=512
    timeout_minutes: 60

  # LoRA DPO：Qwen2.5-0.5B + 8 行对话式偏好数据，1 step
  - path: recipes/lora_dpo_single_device.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_lora_single_device.yaml  # 复用 LoRA SFT 配置（DPO 在 cfg 层级覆盖 loss/dataset）
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - loss._component_=torchtune.rlhf.loss.DPOLoss  # upstream LoRA config 无 loss 项；DPO 必填
      - dataset._component_=torchtune.datasets.preference_dataset  # 走偏好数据 builder（默认 alpaca_cleaned_dataset 走 SFT 路径）
      - dataset.source=json  # 本地 json 文件
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_preference_conv_8.jsonl  # 8 行 chosen/rejected 消息列表（与 ChosenRejectedToMessages 对齐）
      - gradient_accumulation_steps=1
      - max_steps=1
      - log_every_n_steps=1
      - batch_size=1
      - max_seq_len=512
    timeout_minutes: 60

  # 推理生成：Qwen2.5-0.5B，单条 prompt（upstream 配置默认是 Llama2 7B）
  - path: recipes/generate.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/generation.yaml  # upstream generation 配置：默认 model=llama2_7b
      - model._component_=torchtune.models.qwen2_5.qwen2_5_0_5b  # 覆盖为 Qwen2.5-0.5B base
      - tokenizer._component_=torchtune.models.qwen2_5.qwen2_5_tokenizer  # Qwen2.5 BPE tokenizer
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.checkpoint_files=[model.safetensors]  # upstream 默认 2 个 .bin shard（Llama2 风格）；0.5B 单 shard
      - checkpointer.model_type=QWEN2  # upstream 默认 LLAMA2；走 qwen2_hf_to_tune（处理 q/k/v bias）而不是基类 hf_to_tune
      - 'prompt.user="The capital of France is"'  # Dict[Role,str] 格式（generate.py:104 强类型）；内嵌空格会被 shlex.split 拆开，run_example.sh 必须改用 shlex.quote 包值或收紧为单 token；CI 矩阵里此 overlay_arg 在 coder 复现必抛 ValueError "got capital"，由 examples-guard 守护
      - 'prompt.system=null'  # 同上：Dict 键
      - max_new_tokens=20  # upstream 默认 300：压 token 数
    # 2026-09-18 CI run 35322839791：timeout=15 在 setup 阶段撞墙，torch 148MB
    # 走 cluster pip cache 被 4 个并发 job 压到 237 kB/s，光 torch 就要 10min；
    # torchvision 装到一半容器被 k8s 杀掉 ("container implementation failed")。
    # 跟同 run 的 lora_finetune/full_finetune/lora_dpo（timeout=30，setup 17min 内
    # 跑通）对齐，提到 30。2026-09-20 run 35483424375 30min 仍不够（torch 下载
    # 挂 28min 直接超时），跟 xtuner（35483448757）同修：setup 改 curl 续传，
    # timeout 提到 60 兜底。
    timeout_minutes: 60

  # 量化：Qwen2.5-0.5B，Int8DynActInt4 权重量化（torchao）
  # Int8DynActInt4WeightQuantizer 用 torchao 0.18 的
  # Int8DynamicActivationIntxWeightConfig + PerGroup(groupsize=256)，
  # 要求每一维的 hidden_size 是 groupsize 的倍数。Qwen2.5-0.5B 的
  # hidden_size=896，896/256=3.5 不整除 → AssertionError at
  # choose_qparams_affine。v0.6.1 跑得通是因为 torchao 0.13 的
  # int8_dynamic_activation_int4_weight 不做这个 block_size 校验。
  # 修法：overlay 把 groupsize 改成 128（896/128=7，整除）。
  # 量化算法仍是 Int8DynActInt4，意图保留，只是 group size 调小。
  - path: recipes/quantize.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/quantization.yaml  # upstream quantize 配置：默认 Int8DynActInt4WeightQuantizer + Llama2 7B
      - model._component_=torchtune.models.qwen2_5.qwen2_5_0_5b  # 覆盖为 Qwen2.5-0.5B base
      - tokenizer._component_=torchtune.models.qwen2_5.qwen2_5_tokenizer
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.checkpoint_files=[model.safetensors]
      - checkpointer.model_type=QWEN2  # 同 generate：走 qwen2_hf_to_tune
      - checkpointer.output_dir=${CI_OUTPUT_DIR}  # 量化结果落 CI 工作目录
      - quantizer.groupsize=128  # Qwen2.5-0.5B hidden_size=896，128 是能整除的标准 group size
    # 2026-09-18 CI run 35322839791：同上 setup timeout 不足，提到 30。
    # 2026-09-20 run 35483424375 30min 仍超时（torch 下载挂 28min），提到 60。
    timeout_minutes: 60

  # 评测：Qwen2.5-0.5B + lm_eval + 自定义 ci_truthfulqa_mc2 任务（本地 JSON 驱动）
  # eleuther_eval recipe 在 __init__ 强检 `version("lm-eval") < "0.4.5"`
  # （**字符串比较**，不是 packaging.version——0.4.10-0.4.49 都被误拒；
  # 详见 setup_example.sh 注释 + 端到端跑通日期 2026-09-17），setup 装
  # `lm-eval==0.4.5`（recipe import 链只用到 lm_eval.tasks /
  # lm_eval.evaluator / lm_eval.models.huggingface / lm_eval.utils 这四块，
  # 0.4.5 已稳定）。任务数据走 fixtures/ci_truthfulqa_2.json（2 行手工写的
  # TruthfulQA mc2 格式），通过 `include_path` 指向 fixtures/eleuther_tasks/，
  # lm_eval 的 TaskManager 把 `ci_truthfulqa_mc2` 注册为覆盖 built-in
  # truthfulqa_mc2 的本地任务，绕开 HF datasets 拉取 truthfulqa。`acc`
  # 指标而非原版 `mc2`：原版 mc2 是 truthfulqa/utils.py 里的自定义聚合函数，
  # 用 built-in `acc` 避免把 utils.py 也 vendor 进 fixtures。`device=npu`
  # overlay 把 upstream config 的 `device: cuda` 翻成 NPU。
  # 2026-09-18 在 coder hdc-stable-npu-3 跑通：exit 0，acc=1.0 / 0.94s /
  # 1.56GB HBM（5×5 loglikelihood 一次性跑完）。
  # ⚠️ eleuther_eval recipe 内部硬编 `pretrained="gpt2"`（recipes/eleuther_eval.py:311
  #   `super().__init__(pretrained="gpt2", device=str(device))`），会触发
  #   `transformers.AutoConfig.from_pretrained("gpt2")`。coder pod 无法访问
  #   huggingface.co（curl hang），需要在 runner 环境里设置
  #   `HF_ENDPOINT=https://hf-mirror.com` 让 transformers 走中国镜像；CI 集群
  #   直连 HF 时不设也无害。fixture YAML 需要 `data_files`
  # 写相对 cwd 的路径（datasets 4.x resolve_pattern 用 base_path="")，并且
  # multiple_choice 类型要求 `doc_to_choice` 显式提供，不能只给 doc_to_text /
  # doc_to_target。
  - path: recipes/eleuther_eval.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/evaluation.yaml
      - model._component_=torchtune.models.qwen2_5.qwen2_5_0_5b
      - tokenizer._component_=torchtune.models.qwen2_5.qwen2_5_tokenizer
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.checkpoint_files=[model.safetensors]
      - checkpointer.model_type=QWEN2
      - device=npu
      - tasks=[ci_truthfulqa_mc2]
      - include_path=${TARGET_ROOT}/fixtures/eleuther_tasks
      - limit=2  # fixture 只有 2 行
      - batch_size=1  # 0.5B + 多项选择 5 个候选，loglikelihood 一次跑就行
      - max_seq_length=512  # upstream 默认 4096：2 行短问答压短
    # 2026-09-18 CI run 35322839791：setup 比其它 3 个 recipe 还要重（多装
    # lm-eval==0.4.5 + evaluate==0.4.6 + sacrebleu + scikit-learn 等 30+ 包），
    # 15min 连 setup 跑不完；同 run 的 lora_finetune/full_finetune/lora_dpo
    # 用 30min 全过，对齐到 30。2026-09-20 run 35483424375 30min 仍超时
    # （torch 下载挂 28min 直接超时），提到 60 兜底（同 xtuner 35483448757）。
    timeout_minutes: 60

  # 知识蒸馏 single_device：Qwen2.5-0.5B student + Qwen2.5-1.5B teacher
  # recipe 自身硬编 StatefulDistributedSampler(num_replicas=1, rank=0)，
  # 完全不调 init_process_group；只走 upstream yaml + overlay + cached teacher。
  # 复用 upstream qwen2/1.5_to_0.5B_KD_lora_single_device.yaml，overlay 把
  # 所有 qwen2 _component_ 换成 qwen2_5（torchtune.models.qwen2_5.qwen2_5_1_5b_instruct
  # 是 1.5B factory——upstream qwen2_5 只暴露 _base / _instruct 后缀族，
  # 没有裸 qwen2_5_1_5b，需要 _instruct 后缀）。
  - path: recipes/knowledge_distillation_single_device.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2/1.5_to_0.5B_KD_lora_single_device.yaml  # upstream KD yaml，overlay 改 qwen2→qwen2_5
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json  # upstream 默认 /tmp/Qwen2-0.5B-Instruct/vocab.json；改 setup 预下载的 Qwen2.5-0.5B snapshot
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}  # student = Qwen2.5-0.5B
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - teacher_model._component_=torchtune.models.qwen2_5.qwen2_5_1_5b_instruct  # overlay qwen2→qwen2_5 + 1.5B factory 是 _instruct 后缀
      - teacher_checkpointer.checkpoint_dir=${TT_TEACHER_PATH}  # teacher = Qwen2.5-1.5B（setup_example.sh 新加的 download）
      - teacher_checkpointer.output_dir=${CI_OUTPUT_DIR}
      - model._component_=torchtune.models.qwen2_5.lora_qwen2_5_0_5b  # overlay qwen2→qwen2_5
      - dataset.source=json  # upstream alpaca_cleaned_dataset 走 HF，CI 不可达
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json  # 仓内 50 行 alpaca fixture
      - max_steps_per_epoch=1
      - gradient_accumulation_steps=1
      - batch_size=1
    timeout_minutes: 60

  # LoRA DPO distributed：Qwen2.5-0.5B + 8 行 preference 数据
  # 复用 upstream qwen2_5/0.5B_lora_single_device.yaml，加 DPOLoss 注入；
  # FSDP + init_process_group(hccl) + world_size=1 都已 coder 实证。
  # run_example.sh 必须 export MASTER_ADDR=127.0.0.1 MASTER_PORT=29500
  # RANK=0 WORLD_SIZE=1 LOCAL_RANK=0（distributed 入口守卫）。
  - path: recipes/lora_dpo_distributed.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_lora_single_device.yaml  # 复用 LoRA SFT yaml（DPO 在 cfg 层级覆盖 loss/dataset）
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - loss._component_=torchtune.rlhf.loss.DPOLoss  # upstream LoRA config 无 loss 项；DPO 必填
      - dataset._component_=torchtune.datasets.preference_dataset  # 走 chosen/rejected 消息列表
      - dataset.source=json
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_preference_conv_8.jsonl  # 仓内 8 行偏好数据
      - gradient_accumulation_steps=1
      - max_steps_per_epoch=1
      - batch_size=1
      - max_seq_len=512
      - device=npu  # 强制 npu（yaml 默认 cuda）
    timeout_minutes: 60

  # 全量 SFT distributed：Qwen2.5-0.5B + alpaca fixture
  # 复用 upstream qwen2_5/0.5B_full_single_device.yaml，overlay 强制
  # tp/cp/dp-shard 全 1 让 ParallelDims.build_mesh("npu") 退化成 1-rank mesh；
  # 关 enable_fp8_training（NPU 不支持 FP8 path）。
  - path: recipes/full_finetune_distributed.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_full_single_device.yaml
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - dataset.source=json
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json
      - tensor_parallel_dim=1  # 强制 1-rank mesh（不触发 parallelize_module）
      - context_parallel_dim=1
      - data_parallel_shard_dim=1
      - data_parallel_replicate_dim=1
      - enable_fp8_training=False  # FP8 path 未 wire NPU
      - gradient_accumulation_steps=1
      - max_steps_per_epoch=1
      - batch_size=1
      - max_seq_len=512
      - device=npu
    timeout_minutes: 60

  # LoRA SFT distributed：Qwen2.5-0.5B + alpaca fixture
  # 复用 upstream qwen2_5/0.5B_lora_single_device.yaml，overlay 强制
  # dp-shard_dim/replicate_dim 全 1 走 1-rank FSDP；同 full_finetune_distributed
  # 用同套 ParallelDims 退化模板。FSDP 入口 `init_process_group(self.distributed_backend)`
  # 拿 "hccl"（torch_npu 2.11.0 在 registry.py:34-43 注册 "npu"→"hccl"）。
  # coder npu-3 跑通：exit 0, Loss=2.9031 (step 1/1), 模型权重已存到 ${CI_OUTPUT_DIR}。
  - path: recipes/lora_finetune_distributed.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_lora_single_device.yaml
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - dataset.source=json
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json
      - tensor_parallel_dim=1
      - context_parallel_dim=1
      - data_parallel_shard_dim=1
      - data_parallel_replicate_dim=1
      - enable_fp8_training=False
      - gradient_accumulation_steps=1
      - max_steps_per_epoch=1
      - batch_size=1
      - max_seq_len=512
      - device=npu
    timeout_minutes: 60

  # 全量 DPO distributed：Qwen2.5-0.5B + 8 行 preference fixture
  # 全参 DPO（非 LoRA），DPO loss 公式与 lora_dpo_distributed 同，但 model 是
  # full-parameter qwen2_5_0_5b 走 FSDP；DPO recipe 多读一个 ref_checkpointer
  # 单独 cfg（与 checkpointer 同指向，ref_policy=初始 policy 权重），上游
  # 0.5B_full_single_device.yaml 没 lr_scheduler 段，overlay 注入 cosine warmup。
  # coder npu-3 跑通：exit 0, Loss=0.6931 (= ln 2，DPO 期望初始熵下限)。
  - path: recipes/full_dpo_distributed.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2_5/0.5B_full_single_device.yaml
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - ref_checkpointer._component_=torchtune.training.FullModelHFCheckpointer  # DPO recipe 必须独立 cfg（line 279 读 cfg.ref_checkpointer）
      - ref_checkpointer.checkpoint_dir=${TT_MODEL_PATH}  # ref_policy = 初始 policy 权重
      - ref_checkpointer.checkpoint_files=[model.safetensors]
      - ref_checkpointer.recipe_checkpoint=null
      - ref_checkpointer.output_dir=${CI_OUTPUT_DIR}
      - ref_checkpointer.model_type=QWEN2
      - lr_scheduler._component_=torchtune.training.lr_schedulers.get_cosine_schedule_with_warmup  # upstream 0.5B_full_single_device.yaml 没 lr_scheduler
      - lr_scheduler.num_warmup_steps=100
      - loss._component_=torchtune.rlhf.loss.DPOLoss
      - dataset._component_=torchtune.datasets.preference_dataset  # 偏好数据 builder（chosen/rejected 消息列表）
      - dataset.source=json
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_preference_conv_8.jsonl
      - tensor_parallel_dim=1
      - context_parallel_dim=1
      - data_parallel_shard_dim=1
      - data_parallel_replicate_dim=1
      - enable_fp8_training=False
      - gradient_accumulation_steps=1
      - max_steps_per_epoch=1
      - batch_size=1
      - max_seq_len=512
      - device=npu
    timeout_minutes: 60

  # 知识蒸馏 distributed：Qwen2.5-0.5B student + Qwen2.5-1.5B teacher
  # KD recipe 的 distributed 入口是
  # `is_distributed()` guard + `StatefulDistributedSampler(num_replicas=self.world_size)`
  # （recipes/knowledge_distillation_distributed.py:914），不走 init_process_group
  # 不走 ParallelDims.build_mesh，所以世界大小通过 MASTER_* env + is_distributed()
  # 单一来源控制。teacher 仍走 FullModelHFCheckpointer 单独 cfg。Qwen2.5-0.5B
  # student hidden=896 / Qwen2.5-1.5B teacher hidden=1536，KD loss 用 KL 散度
  # 对齐 token-level logits（linear_cross_entropy wrapper 兼容）。
  # coder npu-3 跑通：exit 0, Loss=2.94。
  - path: recipes/knowledge_distillation_distributed.py
    profile: torchtune
    runner: linux-aarch64-a2-1
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --config recipes/configs/qwen2/1.5_to_0.5B_KD_lora_single_device.yaml  # upstream qwen2 KD yaml，overlay 改 qwen2→qwen2_5
      - tokenizer.path=${TT_MODEL_PATH}/vocab.json
      - tokenizer.merges_file=${TT_MODEL_PATH}/merges.txt
      - checkpointer.checkpoint_dir=${TT_MODEL_PATH}  # student
      - checkpointer.output_dir=${CI_OUTPUT_DIR}
      - model._component_=torchtune.models.qwen2_5.lora_qwen2_5_0_5b
      - teacher_model._component_=torchtune.models.qwen2_5.qwen2_5_1_5b_instruct
      - teacher_checkpointer.checkpoint_dir=${TT_TEACHER_PATH}
      - teacher_checkpointer.output_dir=${CI_OUTPUT_DIR}
      - dataset.source=json
      - dataset.data_files=${TARGET_ROOT}/fixtures/ci_alpaca_50.json
      - max_steps_per_epoch=1
      - gradient_accumulation_steps=1
      - batch_size=1
      - device=npu
    timeout_minutes: 60

