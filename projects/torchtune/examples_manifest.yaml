unsupported:
  # ===== runtime-verified: cross-component ABI gap =====
  # 2026-09-21 在 coder hdc-stable-npu-3 实跑，QATLoRALinear.__init__ 在
  # lora.py:231 的 isinstance assert 必崩：
  #     assert isinstance(activation_qat_config, FakeQuantizeConfig)
  #     AssertionError
  # 根因（torchao ABI）：torchtune main HEAD bd2a0fc 的
  # torchtune/modules/peft/lora.py:222
  #     from torchao.quantization.qat.api import FakeQuantizeConfig
  # 期望 Int8DynActInt4WeightQATQuantizer.get_activation_fake_quantize_config()
  # 返回 `api.FakeQuantizeConfig` 的实例。但 torchao 0.12+ 把返回值改成
  # `IntxFakeQuantizeConfig`（位于 fake_quantize_config 模块），其 MRO
  # 只有 `IntxFakeQuantizeConfig → FakeQuantizeConfigBase → ABC → object`，
  # 并不继承 `api.FakeQuantizeConfig`，assert 必挂。
  # pin 范围无解（与 torchtune main HEAD + torch 2.11 ABI 兼容的版本）：
  #   - torchao 0.11.0: api.FakeQuantizeConfig ✓ — 但缺 NF4Tensor，
  #     `torchtune/modules/common_utils.py:19` `from torchao.quantization
  #     import NF4Tensor` ImportError，整个 torchtune 加载链断
  #   - torchao 0.12.0: 报 `from torch._inductor.kernel.flex_attention import`
  #     ModuleNotFoundError（torch 2.11 还没有 `kernel.flex_attention` 子模块）
  #   - torchao 0.13.0/0.14.0/0.15.0/0.18.0: NF4Tensor 在；assert 必挂
  # （per memory `torchao-nf4tensor-api-breaks.md`：0.13 dtypes.nf4tensor /
  # 0.15 Int4Tensor / 0.18 quantization.NF4Tensor —— 唯独 0.18 在
