version: 1
scan:
  root: examples
  include_extensions: ['.py']
supported:
  - path: examples/pytorch/text-generation/run_generation.py
    profile: generation
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_type gpt2
      - --model_name_or_path ${TINYGPT2_PATH}
      - --prompt Hello
      - --length 10
      - --seed 42
    timeout_minutes: 60
  - path: examples/pytorch/text-classification/run_glue_no_trainer.py
    profile: glue
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${DISTILBERT_PATH}
      - --train_file ${TARGET_ROOT}/tests/fixtures/tests_samples/MRPC/train.csv
      - --validation_file ${TARGET_ROOT}/tests/fixtures/tests_samples/MRPC/dev.csv
      - --max_length 64
      - --per_device_train_batch_size 2
      - --per_device_eval_batch_size 2
      - --max_train_steps 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  - path: examples/pytorch/question-answering/run_qa_no_trainer.py
    profile: small-training
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${DISTILBERT_PATH}
      - --train_file ${TARGET_ROOT}/tests/fixtures/tests_samples/SQUAD/sample.json
      - --validation_file ${TARGET_ROOT}/tests/fixtures/tests_samples/SQUAD/sample.json
      - --max_seq_length 128
      - --doc_stride 64
      - --max_train_samples 4
      - --max_eval_samples 4
      - --per_device_train_batch_size 1
      - --per_device_eval_batch_size 1
      - --max_train_steps 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  - path: examples/pytorch/multiple-choice/run_swag_no_trainer.py
    profile: small-training
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${DISTILBERT_PATH}
      - --train_file ${TARGET_ROOT}/tests/fixtures/tests_samples/swag/sample.json
      - --validation_file ${TARGET_ROOT}/tests/fixtures/tests_samples/swag/sample.json
      - --max_seq_length 64
      - --per_device_train_batch_size 1
      - --per_device_eval_batch_size 1
      - --max_train_steps 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
  - path: examples/pytorch/token-classification/run_ner_no_trainer.py
    profile: small-training
    runner: linux-aarch64-a2-2
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    overlay_args:
      - --model_name_or_path ${DISTILBERT_PATH}
      - --train_file ${TARGET_ROOT}/tests/fixtures/tests_samples/conll/sample.json
      - --validation_file ${TARGET_ROOT}/tests/fixtures/tests_samples/conll/sample.json
      - --max_length 64
      - --per_device_train_batch_size 1
      - --per_device_eval_batch_size 1
      - --max_train_steps 1
      - --output_dir ${CI_OUTPUT_DIR}
    timeout_minutes: 60
