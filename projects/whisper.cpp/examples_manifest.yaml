version: 1
# 对账模型（docs/examples-check-design.md §2.6）：files 单位 = examples/ 下递归的
# .cpp/.sh/.py 文件；目录条目（cli/bench/…）作为前缀毯子覆盖其内部源文件。
# 顶层共享 helper 不是 example，登记在 scan.exclude。whisper.android /
# whisper.android.java / whisper.nvim / whisper.objc / whisper.swiftui 是
# Java/Lua/ObjC/Swift 移植，无 .cpp/.sh/.py 源，在对账中恒为 stale（视野外
# 提示，不判红）。
scan:
  root: examples
  unit: files
  include_extensions: ['.cpp', '.sh', '.py']
  exclude:
    - examples/common.cpp             # 各 example 共用的命令行/音频工具
    - examples/common-whisper.cpp
    - examples/common-ggml.cpp
    - examples/common-sdl.cpp
    - examples/ffmpeg-transcode.cpp   # stream 类 example 共用的媒体转码工具
    - examples/grammar-parser.cpp     # GBNF 语法解析器，被 grammar 类 example 引用
supported:
  - path: examples/cli
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/whisper-cli
    overlay_args:
      - -m ${WHISPER_CI_MODEL}
      - -f ${TARGET_ROOT}/samples/jfk.wav
      - -t 4
      - --device 0
    timeout_minutes: 60
  - path: examples/bench
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/whisper-bench
    overlay_args:
      - -m ${WHISPER_CI_MODEL}
      - -t 4
    timeout_minutes: 60
  - path: examples/quantize
    profile: host
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/whisper-quantize
    overlay_args:
      - ${WHISPER_CI_MODEL}
      - ${CI_OUTPUT_DIR}/tiny.en-q8_0.bin
      - q8_0
    timeout_minutes: 60
  - path: examples/parakeet-quantize
    profile: host
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/parakeet-quantize
    overlay_args:
      - ${PARAKEET_CI_MODEL}
      - ${CI_OUTPUT_DIR}/parakeet-tdt-q8_0.bin
      - q8_0
    timeout_minutes: 90
  - path: examples/parakeet-cli
    profile: parakeet
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/parakeet-cli
    overlay_args:
      - -m ${PARAKEET_CI_MODEL}
      - -f ${TARGET_ROOT}/samples/jfk.wav
      - -t 4
      - --device 0
    timeout_minutes: 60
  - path: examples/test-cmake
    profile: cmake-pkg
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: examples/test-cmake/build/test-cmake
    timeout_minutes: 90
  - path: examples/vad-speech-segments
    profile: vad
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/whisper-vad-speech-segments
    overlay_args:
      - -vm ${WHISPER_CI_VAD_MODEL}
      - -f ${TARGET_ROOT}/samples/jfk.wav
      - -t 4
    timeout_minutes: 60
  - path: examples/server
    profile: cann
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: swr.cn-south-1.myhuaweicloud.com/ascendhub/cann:9.1.0-910b-ubuntu22.04-py3.12
    exec: build/bin/whisper-server
    overlay_args:
      - -m ${WHISPER_CI_MODEL}
      - -t 4
      - --device 0
      - --host 127.0.0.1
      - --port 18080
    timeout_minutes: 60
unsupported:
  # Node 绑定。examples/addon.node/addon.cpp 的 run_with_progress 在打印
  # processing 之后调用 whisper_full_parallel。上游 v1.9.4 在昇腾上的两次运行
  # 都死在这一步，glibc 报 free(): invalid pointer 后 abort，退出码 134。
  # 没有 progress: 0%，也没有转写文本：
  #   run 36729963369，job examples/addon，2026-09-30。14:44:39.122 打印
  #   processing，14:44:39.141 abort。77.11MB 的 tiny.en 已经在 CANN0 上，
  #   日志有 using CANN0 backend。
  #   run 33365746103，2026-08-31。processing 之后 23ms，同样 abort。
  # 同一次 36729963369 里，whisper-cli 用同一模型、同一段 samples/jfk.wav、
  # 同一张卡转写出 ask not what your country can do for you。它在 processing
  # 之后 18ms 打印 new_pool_for_device，mel 耗时 16.13ms。addon 的日志里没有
  # new_pool_for_device。examples/server 同一次运行也转写成功。server.cpp 在
  # 主线程 whisper_init，请求处理走 httplib 默认 ThreadPool，在工作线程里调用
  # whisper_full_parallel。所以不是「昇腾跑不了 whisper」，也不是「在工作线程里
  # 调 whisper_full 就必然崩」。
  # addon.cpp 的 blob 从 v1.9.4 到 v1.9.6 相同，sha 71f65b0423c2c05d5403de4a9943ca39ea659c8f。
  # 同一份绑定在不链接 CANN 的 Ubuntu 22.04、Node 20.18.2、OpenMP 的 CPU 路径上，
  # 以及 macOS Metal 上，能转写完并打印 progress: 0% 和 progress: 100%。
  # 崩溃只出现在昇腾镜像里、以 -DGGML_CANN=on 编出、再由 node 加载的这份绑定上。
  # 两次 CI 日志都没有 core，看不到是哪一次 free 收到了坏指针。processing 之后、
  # 第一次 NPU 图之前，源码上紧挨着的是 CPU 上的 log_mel_spectrogram、主循环开头的
  # progress_callback（addon.cpp 用 Napi::ThreadSafeFunction::BlockingCall），
  # 然后才是 whisper_encode_internal。同一次运行里 whisper-cli 的 flash attn 是 1，
  # addon 的 flash attn 是 0：cli.cpp 默认 true，addon.cpp 默认 false。这些是已经
  # 核对过的差别，不是已经钉死的 free 调用点。不改 addon.cpp 修不到这次 abort，
  # 所以这条看护不跑。unsupported 只表示本看护现在不跑它。
  - examples/addon.node
  # Browser / WebAssembly ports.
  - examples/bench.wasm
  - examples/command.wasm
  - examples/stream.wasm
  - examples/whisper.wasm
  # WASM static file server. serve_forever. Real HTTP inference is examples/server.
  - examples/server.py
  # Thin wrapper around the retired ./main binary. In-tree fixture is missing.
  - examples/python
  # Microphone + sox + ffplay. Interactive.
  - examples/generate-karaoke.sh
  # External live stream and an infinite loop.
  - examples/livestream.sh
  # Twitch + streamlink. Infinite loop.
  - examples/twitch.sh
  # YouTube VOD via yt-dlp + ffmpeg. Unbounded download and mainland network.
  - examples/yt-wsp.sh
  # Microphone + SDL2 interactive tools.
  - examples/command
  - examples/stream
  # Rename shim. Always exits failure.
  - examples/deprecation-warning
  # Long-running language server. Also gated on WHISPER_SDL2.
  - examples/lsp
  # Intel SYCL backend.
  - examples/sycl
  # Needs llama.cpp plus SDL2 and a microphone.
  - examples/talk-llama
  # Voice-controlled chess, SDL2 / interactive.
  - examples/wchess
  # Android SDK / NDK / device. JNI is CPU.
  - examples/whisper.android
  - examples/whisper.android.java
  # Neovim + microphone + interactive stream.
  - examples/whisper.nvim
  # Xcode / iOS / macOS platform ports.
  - examples/whisper.objc
  - examples/whisper.swiftui
