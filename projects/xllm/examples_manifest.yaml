version: 1
scan:
  root: examples
  include_extensions: ['.py']
supported:
  - path: examples/generate.py
    profile: default
    runner: linux-aarch64-a2-1
    npu_devices: '0'
    image: quay.io/jd_xllm/xllm-ai:xllm-dev-a2-arm-cann9-20260605
    overlay_args:
      - --model /root/.cache/modelscope/Qwen2-7B-Instruct
      - --max_tokens 10
    timeout_minutes: 120
  - path: examples/generate_beam_search.py
    profile: default
    runner: linux-aarch64-a2-1
