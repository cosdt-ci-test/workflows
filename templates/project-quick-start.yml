# Copy to .github/workflows/<project>-quick-start.yml and replace every
# <project>, <fork_repo>, <upstream_repo>, <runner-label>, <swr-image>,
# and <monitored-doc-url> placeholder. Register the project in
# projects.yaml. See docs/guarding-examples.md for the contract.
name: <project>-quick-start

# Quick Start doc test (Ascend / NPU):
#   1. Periodically: lightweight monitor — hash the doc, the latest
#      upstream release, and the upstream main HEAD SHA.
#   2. If any of those signals changed, install the project and run
#      the e2e doc test on the NPU runner.
#   3. If nothing changed, exit after the monitor (no NPU work).

concurrency:
  group: <project>-quick-start
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_install:
        description: 'force the install + test steps to run (skip the monitor check)'
        type: boolean
        default: false
      upstream_repo:
        description: 'override the upstream repo to test'
        required: false
        default: ''
      upstream_ref:
        description: 'override the upstream ref to test'
        required: false
        default: 'main'
      monitored_doc_url:
        description: 'override the doc URL to monitor'
        required: false
        default: ''

permissions:
  contents: read

env:
  CI_IMAGE: <swr-image>
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || inputs.upstream_repo || '<upstream_repo>' }}
  UPSTREAM_REF_DEFAULT: ${{ inputs.upstream_ref || 'main' }}
  MONITORED_DOC_URL: ${{ vars.MONITORED_DOC_URL || inputs.monitored_doc_url || '<monitored-doc-url>' }}
  GH_API: https://api.github.com

jobs:
  monitor-and-test:
    name: monitor + (test on change)
    runs-on: [<runner-label>]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    container:
      image: <swr-image>
      options: >-
        --privileged --shm-size=64g
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
    env:
      PIP_INDEX_URL: https://repo.huaweicloud.com/ascend/repos/pypi
      PIP_TRUSTED_HOST: repo.huaweicloud.com
      PIP_TIMEOUT: "120"
    steps:
      - name: Print context
        run: |
          echo "Trigger:    ${{ github.event_name }}"
          echo "Upstream:   ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_REF_DEFAULT }}"
          echo "Force:      ${{ inputs.force_install || 'false' }}"

      - name: Source CANN and check NPU
        run: |
          export PATH="/usr/local/sbin:$PATH"
          source /usr/local/Ascend/ascend-toolkit/set_env.sh
          npu-smi info || true
          python -c "import torch, torch_npu; print(torch.__version__, torch_npu.__version__, torch.npu.device_count())" || true

      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows
          fetch-depth: 1

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TARGET_REPO || '<fork_repo>' }}
          ref: ${{ vars.TARGET_REF || 'main' }}
          path: target
          fetch-depth: 1

      - name: Restore monitor state
        id: cache-restore
        if: inputs.force_install != true
        uses: actions/cache@v4
        with:
          path: .monitor-state
          key: monitor-state-<project>
          restore-keys: |
            monitor-state-<project>-

      - name: Monitor doc hash
        id: monitor-doc
        if: inputs.force_install != true
        env:
          DOC_URL: ${{ env.MONITORED_DOC_URL }}
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          NEW=$(curl -fsSL --retry 3 "$DOC_URL" | sha256sum | cut -d' ' -f1)
          OLD=$(cat "$STATE_DIR/.doc_hash" 2>/dev/null || echo "")
          if [ "$OLD" != "$NEW" ]; then
            echo "$NEW" > "$STATE_DIR/.doc_hash"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Monitor upstream latest release SHA
        id: monitor-release
        if: inputs.force_install != true
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/releases/latest" -o /tmp/release.json
          TAG=$(jq -r '.tag_name // empty' /tmp/release.json)
          SHA=$(jq -r '.target_commitish // empty' /tmp/release.json)
          OLD=$(cat "$STATE_DIR/.last_release_sha" 2>/dev/null || echo "")
          if [ -n "$SHA" ] && [ "$OLD" != "$SHA" ]; then
            echo "$SHA" > "$STATE_DIR/.last_release_sha"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Monitor upstream main HEAD
        id: monitor-commit
        if: inputs.force_install != true
        run: |
          set -euo pipefail
          STATE_DIR=".monitor-state"
          mkdir -p "$STATE_DIR"
          SHA=$(curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/main" | jq -r '.sha // empty')
          OLD=$(cat "$STATE_DIR/.last_tested_sha" 2>/dev/null || echo "")
          if [ -n "$SHA" ] && [ "$OLD" != "$SHA" ]; then
            echo "$SHA" > "$STATE_DIR/.last_tested_sha"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist monitor state
        if: inputs.force_install != true && always()
        uses: actions/cache@v4
        with:
          path: .monitor-state
          key: monitor-state-<project>-${{ github.run_id }}
          retention-days: 30

      - name: Decide whether to run tests
        id: decide
        if: inputs.force_install != true
        run: |
          CHANGED="false"
          REF="${{ env.UPSTREAM_REF_DEFAULT }}"
          if [ "${{ steps.monitor-doc.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REF="${{ steps.monitor-doc.outputs.ref }}"
          elif [ "${{ steps.monitor-release.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REF="${{ steps.monitor-release.outputs.ref }}"
          elif [ "${{ steps.monitor-commit.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REF="${{ steps.monitor-commit.outputs.ref }}"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Install project and run quick-start tests
        id: test
        if: |
          inputs.force_install == true ||
          steps.decide.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd target
          python -m pip install -U pip
          python -m pip install -e .
          # Replace with the project's doc e2e command.
          python -m unittest tests.docs.test_quick_start_ascend -v 2>&1 | tee /tmp/unittest.log

      - name: Write result JSON
        if: always()
        env:
          TRIGGER: ${{ github.event_name }}
          TARGET_REPO: ${{ vars.TARGET_REPO || '<fork_repo>' }}
          TARGET_REF: ${{ vars.TARGET_REF || 'main' }}
          JOB_STATUS: ${{ job.status }}
          FORCE_INSTALL: ${{ inputs.force_install || false }}
          CHANGED: ${{ steps.decide.outputs.changed }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          if [ "$FORCE_INSTALL" = "true" ] || [ "$CHANGED" = "true" ]; then
            tests_ran=true
          else
            tests_ran=false
          fi
          python3 - "$tests_ran" <<'EOF'
          import json
          import os
          import sys

          result = {
              'trigger': os.environ['TRIGGER'],
              'target_repo': os.environ['TARGET_REPO'],
              'target_ref': os.environ['TARGET_REF'],
              'path': '<monitored-doc-path>',
              'image': os.environ['CI_IMAGE'],
              'job_status': os.environ['JOB_STATUS'],
              'tests_ran': sys.argv[1] == 'true',
          }
          out = os.path.join(os.environ['GITHUB_WORKSPACE'], 'output', 'result.json')
          with open(out, 'w', encoding='utf-8') as handle:
              json.dump(result, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          EOF

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: <project>-quick-start-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/unittest.log
            /tmp/release.json
            ${{ github.workspace }}/output/result.json

  validate-results:
    needs: [monitor-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflows
        uses: actions/checkout@v4
        with:
          path: workflows

      - name: Download quick-start results
        uses: actions/download-artifact@v4
        with:
          pattern: <project>-quick-start-*
          path: downloaded
          merge-multiple: false

      - name: Validate result.json
        run: |
          set -euo pipefail
          python3 -m pip install -q check-jsonschema
          shopt -s nullglob
          files=(downloaded/*/result.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no result.json found in <project>-quick-start-* artifacts"
            exit 1
          fi
          check-jsonschema --schemafile workflows/schemas/result.schema.json "${files[@]}"
